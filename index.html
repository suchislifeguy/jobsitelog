<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>JobSite Log | Professional</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; overscroll-behavior-y: none; }
      .custom-scrollbar::-webkit-scrollbar { display: none; }
      
      /* --- PRINT STYLING --- */
      @media print {
        @page { margin: 12mm; size: A4; }
        body { background-color: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .no-print, .app-ui, button { display: none !important; }
        .print-only { display: block !important; }
        .print-block { break-inside: avoid !important; page-break-inside: avoid !important; margin-bottom: 24px; }
      }

      /* Template Button Styles */
      .template-btn {
        transition: all 0.2s;
        border: 1px solid #e2e8f0;
      }
      .template-btn:hover {
        background-color: #f8fafc;
        border-color: #f97316;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef } from 'react';
      import ReactDOM from 'react-dom/client';
      import { get, set } from 'idb-keyval';
      import { 
        Clock, Trash2, Package, Wrench, ImageIcon, Download, Printer, 
        FileText, Plus, X, Save, Hammer, MapPin, ChevronRight, 
        ClipboardList, Pencil, Maximize2, Sparkles, Layout
      } from 'lucide-react';

      const DB_KEY = 'jobsite-log-db-v1';

      // --- TEMPLATES DATA ---
      const TASK_TEMPLATES = {
        marking: {
          title: "Mark with Highlight Paint",
          materials: "Fluorescent Spray Paint, Marking Chalk",
          tools: "Marking Wand, Measuring Tape",
          description: "Marking out site boundaries and service locations as per site plan."
        },
        washing: {
          title: "Pressure Washing",
          materials: "Degreaser, Surface Sealer",
          tools: "Petrol Pressure Washer, Turbo Nozzle, Scrubbing Brush",
          description: "Deep clean of hard surfaces to remove grime and prepare for treatment."
        },
        fencing: {
          title: "Fence Installation",
          materials: "Fence Panels, Posts, Rapid Set Concrete, Nails/Screws",
          tools: "Post Hole Digger, Level, Impact Driver, String Line",
          description: "Installing vertical posts and securing panels. Ensuring level alignment across run."
        }
      };

      const calculateStats = (tasks) => {
        let totalMinutes = 0;
        const materials = [];
        const tools = new Set();
        tasks.forEach(t => {
          if (t.estimatedTime) {
            const m = t.estimatedTime.match(/(\d+)/);
            if(m) totalMinutes += parseInt(m[1]) * (t.estimatedTime.includes('h') ? 60 : 1);
          }
          t.materials.forEach(mat => materials.push(mat));
          t.tools.forEach(tool => tools.add(tool));
        });
        return { totalMinutes, materials, tools: Array.from(tools) };
      };

      const formatTime = (mins) => {
        const h = Math.floor(mins/60);
        const m = mins%60;
        return h > 0 ? `${h}h ${m > 0 ? m+'m' : ''}` : `${m}m`;
      };

      // --- PDF REPORT COMPONENT ---
      const PrintReport = ({ job }) => {
        if (!job) return null;
        const { totalMinutes, materials, tools } = calculateStats(job.tasks);

        return (
          <div className="print-only hidden">
            <div style={{ maxWidth: '1000px', margin: '0 auto' }}>
              {/* Header */}
              <div style={{ borderBottom: '3px solid #0f172a', paddingBottom: '15px', marginBottom: '30px', display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
                <div>
                  <h1 style={{ fontSize: '28pt', fontWeight: '800', margin: 0, color: '#0f172a', letterSpacing: '-1px' }}>JOBSITE LOG</h1>
                  <p style={{ margin: 0, color: '#64748b', fontSize: '11pt', fontWeight: '500' }}>{new Date().toLocaleDateString('en-AU', { dateStyle: 'long' })}</p>
                </div>
                <div style={{ textAlign: 'right' }}>
                  <h2 style={{ fontSize: '16pt', fontWeight: '700', margin: 0 }}>{job.address}</h2>
                  <p style={{ margin: 0, color: '#475569', fontSize: '12pt' }}>{job.clientName}</p>
                </div>
              </div>

              {/* Task Cards */}
              {job.tasks.map((task, idx) => (
                <div key={task.id} className="print-block" style={{ border: '1px solid #e2e8f0', borderRadius: '12px', overflow: 'hidden', backgroundColor: '#fff' }}>
                  {/* Task Header - Hours prominently visible */}
                  <div style={{ backgroundColor: '#0f172a', color: '#fff', padding: '12px 20px', display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                    <span style={{ fontWeight: '700', fontSize: '13pt' }}>{idx + 1}. {task.title}</span>
                    {task.estimatedTime && (
                      <div style={{ backgroundColor: '#f97316', padding: '4px 12px', borderRadius: '6px', fontWeight: '800', fontSize: '11pt' }}>
                        {task.estimatedTime.toUpperCase()}
                      </div>
                    )}
                  </div>

                  <div style={{ padding: '20px' }}>
                    {task.description && <p style={{ fontSize: '11pt', color: '#334155', marginBottom: '20px', lineHeight: '1.6' }}>{task.description}</p>}
                    
                    {/* Separated Details Table */}
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', marginBottom: '20px' }}>
                      <div style={{ padding: '12px', backgroundColor: '#f8fafc', borderRadius: '8px', border: '1px solid #f1f5f9' }}>
                        <h4 style={{ fontSize: '8pt', color: '#94a3b8', textTransform: 'uppercase', marginBottom: '5px', fontWeight: '700' }}>Materials Used</h4>
                        <div style={{ fontSize: '10pt', color: '#1e293b' }}>{task.materials.join(', ') || 'None'}</div>
                      </div>
                      <div style={{ padding: '12px', backgroundColor: '#f8fafc', borderRadius: '8px', border: '1px solid #f1f5f9' }}>
                        <h4 style={{ fontSize: '8pt', color: '#94a3b8', textTransform: 'uppercase', marginBottom: '5px', fontWeight: '700' }}>Tools Required</h4>
                        <div style={{ fontSize: '10pt', color: '#1e293b' }}>{task.tools.join(', ') || 'None'}</div>
                      </div>
                    </div>

                    {/* Clean Image Grid */}
                    {task.imageUrls?.length > 0 && (
                      <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                        {task.imageUrls.map((url, i) => (
                          <div key={i} style={{ borderRadius: '8px', overflow: 'hidden', height: '240px', border: '1px solid #e2e8f0' }}>
                            <img src={url} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      // --- APP LOGIC ---
      const App = () => {
        const [jobs, setJobs] = useState([]);
        const [activeJobId, setActiveJobId] = useState(null);
        const [viewMode, setViewMode] = useState('dashboard');
        
        // Task Form State
        const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
        const [taskData, setTaskData] = useState({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });

        useEffect(() => {
          get(DB_KEY).then(data => setJobs(data || []));
        }, []);

        const saveToDB = (newJobs) => {
          setJobs(newJobs);
          set(DB_KEY, newJobs);
        };

        const activeJob = jobs.find(j => j.id === activeJobId);

        // Template Applicator
        const applyTemplate = (key) => {
          const t = TASK_TEMPLATES[key];
          setTaskData({
            ...taskData,
            title: t.title,
            materials: t.materials,
            tools: t.tools,
            desc: t.description
          });
        };

        const handleAddTask = () => {
          const newTask = {
            id: Date.now(),
            title: taskData.title,
            estimatedTime: taskData.time,
            materials: taskData.materials.split(',').map(s => s.trim()).filter(s => s),
            tools: taskData.tools.split(',').map(s => s.trim()).filter(s => s),
            description: taskData.desc,
            imageUrls: taskData.images
          };

          const updatedJobs = jobs.map(j => {
            if (j.id === activeJobId) return { ...j, tasks: [...j.tasks, newTask], updatedAt: Date.now() };
            return j;
          });

          saveToDB(updatedJobs);
          setIsTaskFormOpen(false);
          setTaskData({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });
        };

        const createNewJob = () => {
          const addr = prompt("Job Address:");
          if (!addr) return;
          const newJob = { id: Date.now(), address: addr, clientName: prompt("Client Name:"), tasks: [], updatedAt: Date.now() };
          saveToDB([...jobs, newJob]);
          setActiveJobId(newJob.id);
          setViewMode('detail');
        };

        return (
          <div className="min-h-screen pb-20">
            {/* Header */}
            <header className="bg-slate-900 text-white p-4 sticky top-0 z-40 no-print flex justify-between items-center shadow-lg">
              <div className="flex items-center gap-2" onClick={() => setViewMode('dashboard')}>
                <Hammer className="text-orange-500" />
                <h1 className="font-extrabold text-xl tracking-tight">JOBSITE LOG</h1>
              </div>
              {viewMode === 'detail' && (
                <button onClick={() => window.print()} className="bg-orange-500 hover:bg-orange-600 p-2 rounded-lg flex items-center gap-2 text-sm font-bold">
                  <Printer size={18} /> PRINT PDF
                </button>
              )}
            </header>

            {/* Dashboard View */}
            {viewMode === 'dashboard' && (
              <main className="p-4 max-w-4xl mx-auto no-print">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-bold text-slate-800">Active Jobs</h2>
                  <button onClick={createNewJob} className="bg-slate-900 text-white px-4 py-2 rounded-xl flex items-center gap-2 font-bold shadow-md">
                    <Plus size={20} /> New Job
                  </button>
                </div>
                <div className="grid gap-4">
                  {jobs.map(job => (
                    <div key={job.id} onClick={() => { setActiveJobId(job.id); setViewMode('detail'); }} className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex justify-between items-center cursor-pointer hover:border-orange-500 transition-all">
                      <div>
                        <h3 className="font-bold text-lg">{job.address}</h3>
                        <p className="text-slate-500 text-sm">{job.clientName} • {job.tasks.length} tasks</p>
                      </div>
                      <ChevronRight className="text-slate-400" />
                    </div>
                  ))}
                </div>
              </main>
            )}

            {/* Detail View */}
            {viewMode === 'detail' && activeJob && (
              <main className="p-4 max-w-4xl mx-auto no-print">
                <button onClick={() => setViewMode('dashboard')} className="mb-4 text-slate-600 font-medium flex items-center gap-1">
                  <ChevronRight className="rotate-180" size={18} /> Back to Jobs
                </button>
                <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 mb-6">
                  <h2 className="text-2xl font-black text-slate-900">{activeJob.address}</h2>
                  <p className="text-slate-500">{activeJob.clientName}</p>
                </div>

                <div className="grid gap-4">
                  {activeJob.tasks.map((task, i) => (
                    <div key={task.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden">
                      <div className="p-4 flex justify-between items-center bg-slate-50 border-b">
                        <span className="font-bold text-slate-700">Task {i+1}</span>
                        <span className="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-xs font-bold">{task.estimatedTime}</span>
                      </div>
                      <div className="p-4">
                        <h3 className="font-bold text-lg mb-1">{task.title}</h3>
                        <p className="text-slate-600 text-sm">{task.description}</p>
                      </div>
                    </div>
                  ))}
                </div>

                <button onClick={() => setIsTaskFormOpen(true)} className="fixed bottom-6 right-6 bg-orange-500 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center hover:scale-110 transition-transform">
                  <Plus size={30} />
                </button>
              </main>
            )}

            {/* Task Modal with Templates */}
            {isTaskFormOpen && (
              <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm p-4 overflow-y-auto">
                <div className="bg-white max-w-lg mx-auto rounded-3xl shadow-2xl overflow-hidden">
                  <div className="p-6">
                    <div className="flex justify-between items-center mb-6">
                      <h2 className="text-xl font-black">Add New Task</h2>
                      <button onClick={() => setIsTaskFormOpen(false)}><X /></button>
                    </div>

                    {/* Quick Templates Section */}
                    <div className="mb-6">
                      <label className="block text-xs font-bold text-slate-400 uppercase mb-3 flex items-center gap-1">
                        <Sparkles size={12} /> Quick Templates
                      </label>
                      <div className="flex flex-wrap gap-2">
                        <button onClick={() => applyTemplate('marking')} className="template-btn px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1">
                          <Layout size={14} /> Marking
                        </button>
                        <button onClick={() => applyTemplate('washing')} className="template-btn px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1">
                          <Layout size={14} /> Wash
                        </button>
                        <button onClick={() => applyTemplate('fencing')} className="template-btn px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1">
                          <Layout size={14} /> Fence
                        </button>
                      </div>
                    </div>

                    <div className="space-y-4">
                      <input value={taskData.title} onChange={e => setTaskData({...taskData, title: e.target.value})} placeholder="Task Title" className="w-full p-3 rounded-xl border border-slate-200 focus:ring-2 ring-orange-500 outline-none" />
                      <div className="flex gap-4">
                        <div className="flex-1">
                          <input value={taskData.time} onChange={e => setTaskData({...taskData, time: e.target.value})} placeholder="Time (e.g. 2h)" className="w-full p-3 rounded-xl border border-slate-200 outline-none" />
                        </div>
                        <input type="file" multiple accept="image/*" onChange={e => {
                          const files = Array.from(e.target.files);
                          Promise.all(files.map(f => new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (re) => resolve(re.target.result);
                            reader.readAsDataURL(f);
                          }))).then(urls => setTaskData({...taskData, images: [...taskData.images, ...urls]}));
                        }} className="hidden" id="img-up" />
                        <label htmlFor="img-up" className="bg-slate-100 p-3 rounded-xl cursor-pointer hover:bg-slate-200"><ImageIcon /></label>
                      </div>
                      <input value={taskData.materials} onChange={e => setTaskData({...taskData, materials: e.target.value})} placeholder="Materials (comma separated)" className="w-full p-3 rounded-xl border border-slate-200 outline-none" />
                      <input value={taskData.tools} onChange={e => setTaskData({...taskData, tools: e.target.value})} placeholder="Tools (comma separated)" className="w-full p-3 rounded-xl border border-slate-200 outline-none" />
                      <textarea value={taskData.desc} onChange={e => setTaskData({...taskData, desc: e.target.value})} placeholder="Detailed Description..." className="w-full p-3 rounded-xl border border-slate-200 h-32 outline-none" />
                      
                      <button onClick={handleAddTask} className="w-full bg-slate-900 text-white p-4 rounded-2xl font-bold text-lg hover:bg-orange-500 transition-colors">
                        Save Task
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            )}

            <PrintReport job={activeJob} />
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
