<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>JobSite Master | Quote & Handover</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
      @media print {
        @page { margin: 8mm; size: A4; }
        body { background-color: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .no-print, button, .action-btns, .fixed { display: none !important; }
        .print-only { display: block !important; }
        .print-card { break-inside: avoid; border: 2px solid #0f172a !important; margin-bottom: 15px; border-radius: 10px; overflow: hidden; page-break-inside: avoid; }
        img { max-width: 100% !important; height: auto !important; }
      }
      .img-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; margin-top: 10px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'react';
      import ReactDOM from 'react-dom/client';
      import { get, set } from 'idb-keyval';
      import { 
        Trash2, ImageIcon, Printer, Plus, X, Hammer, 
        ChevronRight, Sparkles, MapPin, Pencil, Save, HardDrive, CheckCircle2, ClipboardCheck
      } from 'lucide-react';

      const DB_KEY = 'jobsite-lifecycle-v1';

      const TEMPLATES = {
        handover: { 
          title: "Final Handover Inspection", 
          materials: "N/A - Final Inspection", 
          tools: "No delays reported", 
          desc: "Completed site walkthrough with client. All defects rectified." 
        },
        rectification: { 
          title: "Minor Defect Fix", 
          materials: "Touch-up paint, sealant", 
          tools: "Inclement weather (1 day delay)", 
          desc: "Fixed minor scratches and resealed edges." 
        }
      };

      const compressImage = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800;
              let width = img.width;
              let height = img.height;
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.6));
            };
          };
        });
      };

      const App = () => {
        const [jobs, setJobs] = useState([]);
        const [activeJobId, setActiveJobId] = useState(null);
        const [viewMode, setViewMode] = useState('dashboard');
        const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
        const [editingTaskId, setEditingTaskId] = useState(null);
        const [dbSize, setDbSize] = useState('0 MB');
        const [taskData, setTaskData] = useState({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });

        useEffect(() => { loadJobs(); }, []);

        const loadJobs = async () => {
          const data = await get(DB_KEY) || [];
          setJobs(data);
          updateStorageMetric(data);
        };

        const updateStorageMetric = (data) => {
          const string = JSON.stringify(data);
          const size = (new TextEncoder().encode(string).length / 1024 / 1024).toFixed(2);
          setDbSize(`${size} MB`);
        };

        const saveToDB = (newJobs) => { setJobs(newJobs); set(DB_KEY, newJobs); updateStorageMetric(newJobs); };

        const activeJob = jobs.find(j => j.id === activeJobId);

        const createNewJob = (type) => {
          const addr = prompt(`${type.toUpperCase()} - Job Address:`);
          if(!addr) return;
          const client = prompt("Client Name:");
          const newJob = { id: Date.now(), type, address: addr, clientName: client, tasks: [] };
          saveToDB([...jobs, newJob]);
        };

        const handleSaveTask = () => {
          if (!taskData.title) return alert("Required: Title");
          const updatedTasks = editingTaskId 
            ? activeJob.tasks.map(t => t.id === editingTaskId ? { ...taskData, id: editingTaskId } : t)
            : [...activeJob.tasks, { ...taskData, id: Date.now() }];
          saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: updatedTasks } : j));
          closeTaskModal();
        };

        const closeTaskModal = () => {
          setIsTaskFormOpen(false);
          setEditingTaskId(null);
          setTaskData({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });
        };

        const handleImageUpload = async (e) => {
          const files = Array.from(e.target.files);
          const compressedStrings = await Promise.all(files.map(file => compressImage(file)));
          setTaskData(prev => ({ ...prev, images: [...prev.images, ...compressedStrings] }));
        };

        return (
          <div className="min-h-screen">
            <header className="bg-slate-900 text-white p-4 no-print flex justify-between items-center shadow-lg sticky top-0 z-50">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => setViewMode('dashboard')}>
                <div className="bg-emerald-500 p-2 rounded-xl text-white shadow-inner"><ClipboardCheck size={22} /></div>
                <h1 className="font-black text-xl tracking-tight uppercase leading-none">JobSite <span className="text-emerald-400">Master</span></h1>
              </div>
              <div className="flex items-center gap-4">
                <div className="hidden md:flex items-center gap-1 text-slate-500 text-[10px] font-bold uppercase tracking-widest">
                  <HardDrive size={12}/> {dbSize}
                </div>
                {viewMode === 'detail' && (
                  <button onClick={() => window.print()} className="bg-white text-slate-900 px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 uppercase shadow-sm">
                    <Printer size={16} /> Print
                  </button>
                )}
              </div>
            </header>

            {viewMode === 'dashboard' ? (
              <main className="p-4 max-w-2xl mx-auto">
                <div className="mb-8">
                  <h2 className="text-2xl font-black text-slate-800 tracking-tight mb-4">Project Pipeline</h2>
                  <div className="grid grid-cols-2 gap-3">
                    <button onClick={() => createNewJob('quote')} className="bg-slate-900 text-white p-4 rounded-2xl text-sm font-black shadow-lg flex flex-col items-center gap-2 border-b-4 border-orange-500 active:translate-y-1 transition-all uppercase">
                       <Plus size={20} /> New Quote
                    </button>
                    <button onClick={() => createNewJob('handover')} className="bg-slate-900 text-white p-4 rounded-2xl text-sm font-black shadow-lg flex flex-col items-center gap-2 border-b-4 border-emerald-500 active:translate-y-1 transition-all uppercase">
                       <CheckCircle2 size={20} /> New Handover
                    </button>
                  </div>
                </div>

                <div className="grid gap-4">
                  {jobs.sort((a,b) => b.id - a.id).map(j => (
                    <div key={j.id} onClick={() => { setActiveJobId(j.id); setViewMode('detail'); }} className={`bg-white p-6 rounded-3xl border-2 transition-all cursor-pointer group flex justify-between items-center ${j.type === 'handover' ? 'border-emerald-100 hover:border-emerald-500' : 'border-slate-100 hover:border-orange-500'}`}>
                      <div>
                        <div className="flex items-center gap-2 mb-1">
                          <span className={`text-[10px] font-black px-2 py-0.5 rounded-full uppercase tracking-widest ${j.type === 'handover' ? 'bg-emerald-100 text-emerald-600' : 'bg-orange-100 text-orange-600'}`}>
                            {j.type}
                          </span>
                        </div>
                        <p className="font-black text-slate-900 text-lg leading-tight">{j.address}</p>
                        <p className="text-[12px] text-slate-400 font-bold uppercase mt-1">{j.tasks.length} LOG ENTRIES</p>
                      </div>
                      <div className="flex items-center gap-4">
                        <button onClick={(e) => { e.stopPropagation(); if(confirm("Delete?")) saveToDB(jobs.filter(x => x.id !== j.id)); }} className="p-2 text-slate-200 hover:text-red-500 transition-colors">
                           <Trash2 size={20} />
                        </button>
                        <ChevronRight size={20} className="text-slate-300" />
                      </div>
                    </div>
                  ))}
                </div>
              </main>
            ) : (
              <main className="p-4 max-w-2xl mx-auto no-print">
                <button onClick={() => setViewMode('dashboard')} className="mb-6 text-slate-400 font-bold text-xs flex items-center gap-1 hover:text-slate-900 uppercase tracking-widest">
                  <ChevronRight size={14} className="rotate-180" /> Dashboard
                </button>
                
                <div className={`p-8 rounded-[2.5rem] border shadow-sm mb-8 relative overflow-hidden ${activeJob?.type === 'handover' ? 'bg-emerald-50 border-emerald-100' : 'bg-white border-slate-200'}`}>
                  <div className="relative z-10 flex items-start gap-4">
                    <div className="bg-white p-4 rounded-2xl text-slate-600 shadow-sm"><MapPin size={24} /></div>
                    <div>
                      <h2 className="text-3xl font-black text-slate-900 leading-tight">{activeJob?.address}</h2>
                      <p className="text-slate-500 font-bold uppercase tracking-widest text-[14px]">{activeJob?.clientName}</p>
                    </div>
                  </div>
                </div>

                <div className="space-y-6 mb-32">
                  {activeJob?.tasks.map((t, i) => (
                    <div key={t.id} className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                      <div className="bg-slate-50 p-4 border-b flex justify-between items-center">
                        <span className="font-black text-slate-400 text-[12px] tracking-widest uppercase">Entry #{i+1}</span>
                        <div className="flex gap-2">
                           <button onClick={() => { setEditingTaskId(t.id); setTaskData(t); setIsTaskFormOpen(true); }} className="p-2 text-slate-400 hover:text-blue-500"><Pencil size={18}/></button>
                           <button onClick={() => { if(confirm("Delete log?")) saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: j.tasks.filter(tk => tk.id !== t.id) } : j)); }} className="p-2 text-slate-400 hover:text-red-500"><Trash2 size={18}/></button>
                        </div>
                      </div>
                      <div className="p-6">
                        <div className="flex justify-between items-start mb-2">
                           <h3 className="font-black text-xl text-slate-900">{t.title}</h3>
                           <span className="bg-slate-100 px-3 py-1 rounded-full text-xs font-black text-slate-500">{t.time}</span>
                        </div>
                        <p className="text-slate-500 text-sm leading-relaxed mb-4">{t.desc}</p>
                        {t.images?.length > 0 && (
                          <div className="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                            {t.images.map((img, idx) => (
                              <img key={idx} src={img} className="h-24 w-24 object-cover rounded-2xl border flex-shrink-0 shadow-sm" />
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                <button onClick={() => setIsTaskFormOpen(true)} className={`fixed bottom-8 right-8 text-white w-20 h-20 rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-all z-40 border-4 border-white ${activeJob?.type === 'handover' ? 'bg-emerald-600' : 'bg-slate-900'}`}>
                  <Plus size={40} />
                </button>
              </main>
            )}

            {isTaskFormOpen && (
              <div className="fixed inset-0 z-[100] bg-slate-900/90 backdrop-blur-md p-4 overflow-y-auto">
                <div className="bg-white rounded-[3rem] max-w-md mx-auto p-8 shadow-2xl mt-4">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-2xl font-black text-slate-900">{editingTaskId ? 'Edit' : 'New'} {activeJob?.type === 'handover' ? 'Completion Record' : 'Log Entry'}</h2>
                    <button onClick={closeTaskModal} className="text-slate-400"><X size={24}/></button>
                  </div>

                  {activeJob?.type === 'handover' && !editingTaskId && (
                    <div className="mb-6">
                      <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                        {Object.keys(TEMPLATES).map(key => (
                          <button key={key} onClick={() => setTaskData({...taskData, ...TEMPLATES[key]})} className="whitespace-nowrap bg-emerald-50 border-2 border-emerald-100 px-4 py-2 rounded-2xl text-[12px] font-black text-emerald-700 uppercase tracking-widest hover:border-emerald-500 transition-all">
                            <Sparkles size={14} className="inline mr-1"/> {key}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="space-y-4">
                    <input placeholder="Item Title / Phase" className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold" value={taskData.title} onChange={e => setTaskData({...taskData, title: e.target.value})} />
                    
                    <div className="flex gap-4">
                      <input placeholder="Duration" className="w-32 p-4 bg-slate-50 rounded-2xl outline-none font-black text-center" value={taskData.time} onChange={e => setTaskData({...taskData, time: e.target.value})} />
                      <label className="flex-1 bg-slate-100 p-4 rounded-2xl cursor-pointer flex items-center justify-center">
                        <ImageIcon className="text-slate-600 mr-2" />
                        <span className="text-xs font-black text-slate-500 uppercase">Add Photos</span>
                        <input type="file" multiple accept="image/*" className="hidden" onChange={handleImageUpload} />
                      </label>
                    </div>

                    {taskData.images.length > 0 && (
                      <div className="img-preview-grid">
                        {taskData.images.map((img, i) => (
                          <div key={i} className="relative aspect-square">
                            <img src={img} className="w-full h-full object-cover rounded-2xl border" />
                            <button onClick={() => setTaskData(p => ({...p, images: p.images.filter((_, idx) => idx !== i)}))} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1"><X size={10}/></button>
                          </div>
                        ))}
                      </div>
                    )}
                    
                    <input placeholder="Materials Used" className="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm font-medium" value={taskData.materials} onChange={e => setTaskData({...taskData, materials: e.target.value})} />
                    
                    <input 
                      placeholder={activeJob?.type === 'handover' ? "Delays or Obstacles" : "Tools Used"} 
                      className="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm font-medium border-l-4 border-orange-400" 
                      value={taskData.tools} 
                      onChange={e => setTaskData({...taskData, tools: e.target.value})} 
                    />

                    <textarea 
                      placeholder={activeJob?.type === 'handover' ? "Final Work Summary..." : "Task Description..."} 
                      className="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm font-medium h-28 resize-none" 
                      value={taskData.desc} 
                      onChange={e => setTaskData({...taskData, desc: e.target.value})} 
                    />
                    
                    <button onClick={handleSaveTask} className={`w-full text-white p-5 rounded-[2rem] font-black text-lg shadow-xl flex items-center justify-center gap-2 transition-all ${activeJob?.type === 'handover' ? 'bg-emerald-600' : 'bg-slate-900'}`}>
                      <Save size={20} /> SAVE {activeJob?.type === 'handover' ? 'HANDOVER' : 'LOG'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* --- PRINT SECTION --- */}
            {activeJob && (
              <div className="print-only hidden p-4">
                <div className={`border-b-[8px] pb-4 mb-4 flex justify-between items-end ${activeJob.type === 'handover' ? 'border-emerald-600' : 'border-slate-900'}`}>
                  <div>
                    <h1 className="text-4xl font-black tracking-tighter uppercase leading-none">
                      {activeJob.type === 'handover' ? 'Completion Certificate' : 'Jobsite Field Report'}
                    </h1>
                    <p className="text-slate-400 font-black text-sm uppercase tracking-widest mt-2">{new Date().toLocaleDateString('en-AU', { dateStyle: 'full' })}</p>
                  </div>
                  <div className="text-right">
                    <p className="text-2xl font-black text-slate-900 uppercase">{activeJob.address}</p>
                    <p className="text-slate-500 font-bold text-sm">{activeJob.clientName}</p>
                  </div>
                </div>

                {activeJob.tasks.map((t, idx) => (
                  <div key={t.id} className="print-card">
                    <div className={`px-5 py-3 font-black border-b flex justify-between items-center text-lg uppercase ${activeJob.type === 'handover' ? 'bg-emerald-50 text-emerald-800' : 'bg-slate-50 text-slate-800'}`}>
                      <span>{idx + 1}. {t.title}</span>
                      <span className="text-sm">{t.time}</span>
                    </div>
                    <div className="p-6">
                      <p className="text-[14px] text-slate-700 mb-6 leading-relaxed border-l-4 border-slate-200 pl-4 italic font-medium">"{t.desc}"</p>
                      <div className="grid grid-cols-2 gap-4 mb-6">
                        <div className="p-4 bg-slate-50 rounded-xl border">
                          <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Materials</label>
                          <span className="text-[12px] font-bold text-slate-600 uppercase leading-tight">{t.materials || 'None'}</span>
                        </div>
                        <div className="p-4 bg-slate-50 rounded-xl border">
                          <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">
                            {activeJob.type === 'handover' ? 'Delays/Notes' : 'Tools Used'}
                          </label>
                          <span className="text-[12px] font-bold text-slate-600 uppercase leading-tight">{t.tools || 'None'}</span>
                        </div>
                      </div>
                      {t.images?.length > 0 && (
                        <div className="grid grid-cols-2 gap-4">
                          {t.images.map((img, i) => (
                            <div key={i} className="rounded-xl overflow-hidden border h-64 shadow-sm">
                              <img src={img} className="w-full h-full object-cover" />
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
                
                {activeJob.type === 'handover' && (
                  <div className="mt-12 grid grid-cols-2 gap-12">
                    <div className="border-t-2 border-slate-900 pt-4">
                      <p className="text-[10px] font-black uppercase text-slate-400">Representative Signature</p>
                    </div>
                    <div className="border-t-2 border-slate-900 pt-4">
                      <p className="text-[10px] font-black uppercase text-slate-400">Client Signature / Date</p>
                    </div>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
