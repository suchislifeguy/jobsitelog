<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>JobSite Log | Professional</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
      
      /* --- PRINT STYLING --- */
      @media print {
        @page { margin: 10mm; size: A4; }
        body { background-color: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .no-print, button, .action-btns { display: none !important; }
        .print-only { display: block !important; }
        .print-card { 
          break-inside: avoid; 
          border: 2px solid #0f172a !important; 
          margin-bottom: 20px; 
          border-radius: 12px; 
          overflow: hidden;
          page-break-inside: avoid;
        }
      }

      .img-preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
        gap: 12px;
        margin-top: 10px;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'react';
      import ReactDOM from 'react-dom/client';
      import { get, set } from 'idb-keyval';
      import { 
        Trash2, ImageIcon, Printer, Plus, X, Hammer, 
        ChevronRight, Sparkles, MapPin, Pencil, Save, Clock
      } from 'lucide-react';

      const DB_KEY = 'jobsite-log-master-v1';

      // --- UPDATED TEMPLATES ---
      const TEMPLATES = {
        marking: { 
          title: "Mark with Highlight Paint", 
          materials: "Yellow/White Spray Paint, Masking Tape, Rags, Turps", 
          tools: "Paint Brush, Roller Brush, Drop sheet", 
          desc: "Paint Leading edge " 
        },
        washing: { 
          title: "Pressure Washing", 
          materials: "Industrial Degreaser", 
          tools: "Petrol Pressure Washer, Turbo Nozzle, hose, tap fittings, cleaning disc", 
          desc: "Deep cleaning hard surfaces to remove buildup." 
        },
        fencing: { 
          title: "Fence Installation", 
          materials: "Timber Pailings, Railings, Steel Posts, Concrete, Nails, Bolts, Bits", 
          tools: "Post Hole Digger, Level, Impact Driver, Wheel Barrow, Bucket, Trowel, Shovel, Stringline", 
          desc: "Excavation of post holes, setting posts in concrete, and mounting panels." 
        }
      };

      const App = () => {
        const [jobs, setJobs] = useState([]);
        const [activeJobId, setActiveJobId] = useState(null);
        const [viewMode, setViewMode] = useState('dashboard');
        const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
        const [editingTaskId, setEditingTaskId] = useState(null);
        const [taskData, setTaskData] = useState({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });

        useEffect(() => { 
          get(DB_KEY).then(data => setJobs(data || [])); 
        }, []);

        const saveToDB = (newJobs) => { 
          setJobs(newJobs); 
          set(DB_KEY, newJobs); 
        };

        const activeJob = jobs.find(j => j.id === activeJobId);

        const getAggregatedTotals = (tasks) => {
          let totalMins = 0;
          let matSet = new Set();
          let toolSet = new Set();

          tasks.forEach(t => {
            const timeVal = parseFloat(t.time) || 0;
            if (t.time?.toLowerCase().includes('m')) {
              totalMins += timeVal;
            } else {
              totalMins += timeVal * 60;
            }
            t.materials.split(',').forEach(m => m.trim() && matSet.add(m.trim()));
            t.tools.split(',').forEach(t => t.trim() && toolSet.add(t.trim()));
          });

          const h = Math.floor(totalMins / 60);
          const m = Math.round(totalMins % 60);

          return {
            totalHours: `${h}h ${m}m`,
            mats: Array.from(matSet).join(', ') || 'None listed',
            tools: Array.from(toolSet).join(', ') || 'None listed'
          };
        };

        const handleSaveTask = () => {
          if (!taskData.title) return alert("Please enter a Task Title");
          
          let updatedTasks;
          if (editingTaskId) {
            updatedTasks = activeJob.tasks.map(t => t.id === editingTaskId ? { ...taskData, id: editingTaskId } : t);
          } else {
            updatedTasks = [...activeJob.tasks, { ...taskData, id: Date.now() }];
          }

          saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: updatedTasks } : j));
          closeTaskModal();
        };

        const openEditTask = (task) => {
          setEditingTaskId(task.id);
          setTaskData({ ...task });
          setIsTaskFormOpen(true);
        };

        const closeTaskModal = () => {
          setIsTaskFormOpen(false);
          setEditingTaskId(null);
          setTaskData({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });
        };

        const handleImageUpload = (e) => {
          const files = Array.from(e.target.files);
          files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (ev) => {
              setTaskData(prev => ({ ...prev, images: [...prev.images, ev.target.result] }));
            };
            reader.readAsDataURL(file);
          });
        };

        return (
          <div className="min-h-screen">
            <header className="bg-slate-900 text-white p-4 no-print flex justify-between items-center shadow-lg sticky top-0 z-50">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => setViewMode('dashboard')}>
                <div className="bg-orange-500 p-2 rounded-xl text-white shadow-inner"><Hammer size={22} /></div>
                <h1 className="font-black text-xl tracking-tight uppercase">Jobsite Log</h1>
              </div>
              {viewMode === 'detail' && (
                <button onClick={() => window.print()} className="bg-white text-slate-900 px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 uppercase tracking-wider shadow-sm">
                  <Printer size={16} /> Print Report
                </button>
              )}
            </header>

            {viewMode === 'dashboard' ? (
              <main className="p-4 max-w-2xl mx-auto">
                <div className="flex justify-between items-center mb-8">
                  <h2 className="text-2xl font-black text-slate-800 tracking-tight">Projects</h2>
                  <button onClick={() => {
                    const addr = prompt("Job Address:");
                    if(addr) saveToDB([...jobs, { id: Date.now(), address: addr, clientName: prompt("Client Name:"), tasks: [] }]);
                  }} className="bg-slate-900 text-white px-6 py-3 rounded-2xl text-sm font-bold shadow-xl">+ New Site</button>
                </div>
                <div className="grid gap-4">
                  {jobs.map(j => (
                    <div key={j.id} onClick={() => { setActiveJobId(j.id); setViewMode('detail'); }} className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm flex justify-between items-center hover:border-orange-500 transition-all cursor-pointer">
                      <div>
                        <p className="font-black text-slate-900 text-lg">{j.address}</p>
                        <p className="text-[14px] text-slate-400 font-bold uppercase mt-1 tracking-widest">{j.tasks.length} LOG ENTRIES</p>
                      </div>
                      <ChevronRight size={20} className="text-slate-300" />
                    </div>
                  ))}
                </div>
              </main>
            ) : (
              <main className="p-4 max-w-2xl mx-auto no-print">
                <button onClick={() => setViewMode('dashboard')} className="mb-6 text-slate-400 font-bold text-xs flex items-center gap-1 hover:text-slate-900 transition-colors">
                  <ChevronRight size={14} className="rotate-180" /> BACK TO PROJECTS
                </button>
                <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm mb-8 relative overflow-hidden">
                  <div className="relative z-10 flex items-start gap-4">
                    <div className="bg-slate-100 p-4 rounded-2xl text-slate-600 shadow-inner"><MapPin size={24} /></div>
                    <div>
                      <h2 className="text-3xl font-black text-slate-900 leading-tight">{activeJob?.address}</h2>
                      <p className="text-slate-400 font-bold uppercase tracking-widest text-[14px] mt-1">{activeJob?.clientName}</p>
                    </div>
                  </div>
                </div>

                <div className="space-y-6 mb-24">
                  {activeJob?.tasks.map((t, i) => (
                    <div key={t.id} className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                      <div className="bg-slate-50 p-5 border-b flex justify-between items-center">
                        <span className="font-black text-slate-400 text-[14px] tracking-widest uppercase">Entry #{i+1}</span>
                        <div className="flex gap-4 items-center">
                           <button onClick={() => openEditTask(t)} className="bg-white p-2 rounded-lg text-slate-400 hover:text-orange-500 border border-slate-100"><Pencil size={18}/></button>
                           <button onClick={() => { if(confirm("Delete this log?")) saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: j.tasks.filter(tk => tk.id !== t.id) } : j)); }} className="bg-white p-2 rounded-lg text-slate-400 hover:text-red-500 border border-slate-100"><Trash2 size={18}/></button>
                        </div>
                      </div>
                      <div className="p-6">
                        <h3 className="font-black text-xl text-slate-900 mb-2">{t.title}</h3>
                        <p className="text-slate-500 text-sm leading-relaxed">{t.desc}</p>
                        {t.images?.length > 0 && (
                          <div className="flex gap-3 mt-4 overflow-x-auto pb-2 no-scrollbar">
                            {t.images.map((img, idx) => (
                              <img key={idx} src={img} className="h-24 w-24 object-cover rounded-2xl border flex-shrink-0" />
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                <button onClick={() => setIsTaskFormOpen(true)} className="fixed bottom-8 right-8 bg-slate-900 text-white w-20 h-20 rounded-full shadow-2xl flex items-center justify-center active:scale-90 hover:bg-orange-500 transition-all z-40 border-4 border-white">
                  <Plus size={40} />
                </button>
              </main>
            )}

            {isTaskFormOpen && (
              <div className="fixed inset-0 z-[100] bg-slate-900/90 backdrop-blur-md p-4 overflow-y-auto">
                <div className="bg-white rounded-[3rem] max-w-md mx-auto p-8 shadow-2xl mt-4">
                  <div className="flex justify-between items-center mb-8">
                    <h2 className="text-2xl font-black text-slate-900 tracking-tight">{editingTaskId ? 'Edit Log' : 'New Log'}</h2>
                    <button onClick={closeTaskModal} className="bg-slate-100 p-3 rounded-full hover:bg-red-50 text-slate-400 hover:text-red-500 transition-colors"><X size={24}/></button>
                  </div>
                  
                  {!editingTaskId && (
                    <div className="mb-8">
                      <label className="text-[14px] font-black text-slate-400 uppercase tracking-widest block mb-3">Quick Templates</label>
                      <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                        {Object.keys(TEMPLATES).map(key => (
                          <button key={key} onClick={() => setTaskData({...taskData, ...TEMPLATES[key]})} className="whitespace-nowrap bg-white border-2 border-slate-100 px-5 py-2.5 rounded-2xl text-[14px] font-black hover:border-orange-500 hover:text-orange-500 transition-all flex items-center gap-2 uppercase tracking-wider">
                            <Sparkles size={14}/> {key}
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="space-y-5">
                    <input placeholder="Task Title" className="w-full p-5 bg-slate-50 rounded-2xl border-none focus:ring-2 ring-orange-500 outline-none font-bold" value={taskData.title} onChange={e => setTaskData({...taskData, title: e.target.value})} />
                    <div className="flex gap-4">
                      <input placeholder="Time (e.g. 2.5h)" className="flex-1 p-5 bg-slate-50 rounded-2xl border-none outline-none font-black" value={taskData.time} onChange={e => setTaskData({...taskData, time: e.target.value})} />
                      <label className="bg-slate-100 p-5 rounded-2xl cursor-pointer hover:bg-slate-200">
                        <ImageIcon className="text-slate-600" />
                        <input type="file" multiple accept="image/*" className="hidden" onChange={handleImageUpload} />
                      </label>
                    </div>

                    {taskData.images.length > 0 && (
                      <div className="img-preview-grid">
                        {taskData.images.map((img, i) => (
                          <div key={i} className="relative aspect-square">
                            <img src={img} className="w-full h-full object-cover rounded-2xl border" />
                            <button onClick={() => setTaskData(p => ({...p, images: p.images.filter((_, idx) => idx !== i)}))} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1.5 shadow-lg border-2 border-white"><X size={12}/></button>
                          </div>
                        ))}
                      </div>
                    )}

                    <input placeholder="Materials" className="w-full p-5 bg-slate-50 rounded-2xl border-none outline-none text-sm font-medium" value={taskData.materials} onChange={e => setTaskData({...taskData, materials: e.target.value})} />
                    <input placeholder="Tools Used" className="w-full p-5 bg-slate-50 rounded-2xl border-none outline-none text-sm font-medium" value={taskData.tools} onChange={e => setTaskData({...taskData, tools: e.target.value})} />
                    <textarea placeholder="Description..." className="w-full p-5 bg-slate-50 rounded-2xl border-none outline-none text-sm font-medium h-32 resize-none" value={taskData.desc} onChange={e => setTaskData({...taskData, desc: e.target.value})} />
                    
                    <button onClick={handleSaveTask} className="w-full bg-slate-900 text-white p-6 rounded-[2rem] font-black text-lg shadow-2xl flex items-center justify-center gap-2">
                      <Save size={20} /> {editingTaskId ? 'UPDATE LOG' : 'SAVE LOG ENTRY'}
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* --- PDF OUTPUT SECTION --- */}
            {activeJob && (
              <div className="print-only hidden p-8">
                <div className="border-b-[14px] border-slate-900 pb-8 mb-8 flex justify-between items-end">
                  <div>
                    <h1 className="text-5xl font-black tracking-tighter text-slate-900">JOBSITE LOG</h1>
                    <p className="text-slate-400 font-black text-xl uppercase tracking-widest mt-2">{new Date().toLocaleDateString('en-AU', { dateStyle: 'full' })}</p>
                  </div>
                  <div className="text-right">
                    <p className="text-3xl font-black text-slate-900 uppercase tracking-tight">{activeJob.address}</p>
                    <p className="text-slate-500 font-bold text-xl">{activeJob.clientName}</p>
                  </div>
                </div>

                <div className="bg-slate-900 text-white p-14 rounded-3xl mb-12 grid grid-cols-4 gap-10">
                  <div className="border-r border-slate-700 flex flex-col justify-center">
                    <h4 className="text-xs uppercase text-orange-500 font-black mb-3 tracking-[0.2em]">Total Time</h4>
                    <p className="text-4xl font-black">{getAggregatedTotals(activeJob.tasks).totalHours}</p>
                  </div>
                  <div className="col-span-3">
                    <div className="space-y-3">
                      <p className="text-[14px] leading-relaxed opacity-95">
                        <strong className="text-slate-400 uppercase mr-2">Materials:</strong> 
                        <span className="font-medium italic">{getAggregatedTotals(activeJob.tasks).mats}</span>
                      </p>
                      <p className="text-[14px] leading-relaxed opacity-95">
                        <strong className="text-slate-400 uppercase mr-2">Tools:</strong> 
                        <span className="font-medium italic">{getAggregatedTotals(activeJob.tasks).tools}</span>
                      </p>
                    </div>
                  </div>
                </div>

                {activeJob.tasks.map((t, idx) => (
                  <div key={t.id} className="print-card">
                    <div className="bg-slate-100 p-5 font-black border-b flex justify-between items-center text-slate-800 text-xl tracking-tight uppercase">
                      <span>{idx + 1}. {t.title}</span>
                    </div>
                    <div className="p-8">
                      {t.desc && <p className="text-lg text-slate-700 mb-8 leading-relaxed border-l-4 border-slate-200 pl-6 italic font-medium">"{t.desc}"</p>}
                      
                      <div className="grid grid-cols-3 gap-6 mb-10">
                        <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100 flex flex-col items-center justify-center text-center">
                          <label className="text-[14px] font-black uppercase text-slate-400 block mb-2 tracking-[0.1em]">Labor Time</label>
                          <span className="font-black text-2xl text-slate-900 border-b-4 border-orange-500 px-2">{t.time || 'N/A'}</span>
                        </div>
                        <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                          <label className="text-[14px] font-black uppercase text-slate-400 block mb-2 tracking-[0.1em]">Materials</label>
                          <span className="text-[13px] font-bold text-slate-600 uppercase leading-tight">{t.materials || 'None'}</span>
                        </div>
                        <div className="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                          <label className="text-[14px] font-black uppercase text-slate-400 block mb-2 tracking-[0.1em]">Tools</label>
                          <span className="text-[13px] font-bold text-slate-600 uppercase leading-tight">{t.tools || 'None'}</span>
                        </div>
                      </div>

                      {t.images?.length > 0 && (
                        <div className="grid grid-cols-2 gap-6">
                          {t.images.map((img, i) => (
                            <div key={i} className="rounded-2xl overflow-hidden border border-slate-100 h-80 shadow-sm">
                              <img src={img} className="w-full h-full object-cover" />
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
