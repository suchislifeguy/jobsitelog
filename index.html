            </div>
            <button onClick={() => setIsTaskFormOpen(true)} className={`fixed right-5 text-white w-14 h-14 rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-all z-40 border-[3px] border-white dark:border-slate-800 ${activeJob?.type==='handover'?'bg-emerald-600':'bg-slate-900 dark:bg-slate-700'}`} style={{ bottom: 'calc(5rem + env(safe-area-inset-bottom))' }}><Plus size={28}/></button>
          </main>
        )}

        {/* Route planning bottom bar */}
        {selectionMode && (
          <div className="fixed left-0 right-0 z-[45] bg-slate-950/95 backdrop-blur-md border-t border-slate-800 p-4 no-print flex justify-between items-center" style={{ bottom: 'calc(4rem + env(safe-area-inset-bottom))' }}>
            <span className="text-white font-black text-sm">{selectedJobs.length} Stops Selected</span>
            <button onClick={openGoogleMaps} disabled={selectedJobs.length===0} className={`px-6 py-3 rounded-2xl font-black text-sm transition-all ${selectedJobs.length>0?'bg-blue-600 hover:bg-blue-500 text-white shadow-xl':'bg-slate-800 text-slate-500 cursor-not-allowed'}`}>Plan Route</button>
          </div>
        )}

        {/* BOTTOM NAVIGATION BAR */}
        <div className="fixed bottom-0 left-0 right-0 bg-white/90 dark:bg-slate-950/90 backdrop-blur-lg border-t border-slate-200 dark:border-slate-800 flex justify-around items-center px-2 pt-2 bottom-nav-safe z-50 no-print">
          <button onClick={() => { setViewMode('dashboard'); setSelectionMode(false); }} className={`flex flex-col items-center p-2 w-16 transition-colors ${viewMode==='dashboard' && !selectionMode ? 'text-orange-500' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
            <Home size={22} className={viewMode==='dashboard' && !selectionMode ? 'fill-orange-100 dark:fill-orange-900/40' : ''}/>
            <span className="text-[10px] font-bold mt-1">Home</span>
          </button>
          <button onClick={() => { setViewMode('dashboard'); setSelectionMode(!selectionMode); }} className={`flex flex-col items-center p-2 w-16 transition-colors ${selectionMode ? 'text-blue-500' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
            <Map size={22} className={selectionMode ? 'fill-blue-100 dark:fill-blue-900/40' : ''}/>
            <span className="text-[10px] font-bold mt-1">{selectionMode ? 'Done' : 'Route'}</span>
          </button>
          <button onClick={() => setViewMode('schedule')} className={`flex flex-col items-center p-2 w-16 transition-colors ${viewMode==='schedule' ? 'text-purple-500' : 'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300'}`}>
            <Calendar size={22} className={viewMode==='schedule' ? 'fill-purple-100 dark:fill-purple-900/40' : ''}/>
            <span className="text-[10px] font-bold mt-1">Schedule</span>
          </button>
          <button onClick={() => setShowSettings(true)} className="flex flex-col items-center p-2 w-16 text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 transition-colors relative">
            <Settings size={22}/>
            {(!apiKey || expiringLicences.length > 0 || insuranceExpiring) && <span className="absolute top-2 right-4 w-2 h-2 bg-amber-400 rounded-full border border-white dark:border-slate-900"/>}
            <span className="text-[10px] font-bold mt-1">Settings</span>
          </button>
        </div>

        {/* Modals */}
        {showSettings && <SettingsModal apiKey={apiKey} geminiModel={geminiModel} extraTaxRate={extraTaxRate} isDarkMode={isDarkMode} toggleTheme={() => setIsDarkMode(!isDarkMode)} exportData={exportData} importData={importData} userTemplates={userTemplates} saveUserTemplates={saveUserTemplates} userMaterials={userMaterials} saveUserMaterials={saveUserMaterials} businessProfile={businessProfile} saveBusinessProfile={saveBusinessProfile} googleClientId={googleClientId} setGoogleClientId={setGoogleClientId} isGoogleConnected={!!googleToken} googleToken={googleToken} connectGoogleCalendar={connectGoogleCalendar} disconnectGoogleCalendar={disconnectGoogleCalendar} onSave={(k,m,t) => { setApiKey(k); setGeminiModel(m); setExtraTaxRate(Number(t)); localStorage.setItem('geminiApiKey',k); localStorage.setItem('geminiModel',m); localStorage.setItem('joblog-extratax', t); }} onClose={() => setShowSettings(false)} showToast={showToast} dbSize={dbSize} isPro={isUnlocked} onUnlockPro={handleUnlockSuccess}/>}
        {showUpgrade && <UpgradeModal onClose={() => setShowUpgrade(false)} onUnlock={handleUnlockSuccess} showToast={showToast}/>}
        {newJobModal && <NewJobModal type={newJobModal} apiKey={apiKey} geminiModel={geminiModel} onSave={handleCreateJob} onClose={() => setNewJobModal(null)} showToast={showToast} toggleVoice={toggleVoice} listeningField={listeningField}/>}
        {showAIAssistModal && activeJob && <AIAssistModal onClose={() => setShowAIAssistModal(false)} onGenerate={handleGenerateDocument} isGenerating={isGenerating} docType={activeJob.type === 'handover' ? 'Completion Invoice' : 'Quotation'} apiKey={apiKey}/>}

        {/* Task Form */}
        {isTaskFormOpen && (
          <div className="fixed inset-0 z-[100] bg-slate-900/90 dark:bg-slate-950/95 backdrop-blur-md flex items-end sm:items-center justify-center sm:p-4">
            <div className="bg-white dark:bg-slate-900 rounded-t-[2.5rem] sm:rounded-[2.5rem] w-full max-w-lg p-5 sm:p-8 shadow-2xl border dark:border-slate-800 max-h-[95vh] flex flex-col animate-slide-up sm:animate-none pb-safe">
              <div className="flex justify-between items-center mb-6 pb-2 border-b border-slate-100 dark:border-slate-800 flex-shrink-0">
                <h2 className="text-xl font-black text-slate-900 dark:text-white">{editingTaskId ? 'Edit' : 'New'} {activeJob?.type==='handover' ? 'Completion Entry' : 'Job Sheet Entry'}</h2>
                <button onClick={closeModal} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-white"><X size={20}/></button>
              </div>
              
              <div className="overflow-y-auto flex-1 no-scrollbar pb-4 pr-1">
                {/* Template Selection Accordion */}
                <div className="mb-4">
                  <button onClick={() => setShowTemplatePop(!showTemplatePop)} className="w-full flex items-center justify-between p-3 bg-slate-50 dark:bg-slate-800 rounded-xl font-black text-sm border border-slate-200 dark:border-slate-700 hover:border-purple-400 dark:text-white transition-colors">
                    <span className="flex items-center gap-2"><Sparkles size={16} className="text-purple-500"/>Use a Template</span>
                    <ChevronDown size={16} className={`transition-transform ${showTemplatePop?'rotate-180':''}`}/>
                  </button>
                  {showTemplatePop && (
                    <div className="mt-2 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl max-h-48 overflow-y-auto p-2 w-full">
                      {userTemplates.length === 0 && <p className="text-sm text-slate-400 p-2 text-center font-medium">No templates yet. Create one in Settings.</p>}
                      {userTemplates.map((t, i) => (
                        <button key={i} onClick={() => { setTaskData(prev=>({...prev,...t.data})); setShowTemplatePop(false); }} className="w-full text-left p-3 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors flex items-center gap-3">
                          <Bookmark size={16} className="text-purple-500 flex-shrink-0"/>
                          <div className="min-w-0"><div className="font-bold text-sm truncate dark:text-white">{t.name}</div>{t.data.title && <div className="text-[10px] text-slate-400 truncate">{t.data.title}</div>}</div>
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                <div className="space-y-3">
                  <div className="relative">
                    <input placeholder="Task / Item Title" className="w-full p-3 pr-10 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none font-bold dark:text-white dark:placeholder-slate-500 text-sm border border-transparent dark:border-slate-700" value={taskData.title} onChange={e=>setTaskData(p=>({...p,title:e.target.value}))}/>
                    <button type="button" onClick={() => toggleVoice('taskTitle', (val) => setTaskData(p => ({...p, title: typeof val === 'function' ? val(p.title) : val})))} className={`absolute right-2 bottom-1.5 p-1.5 rounded-lg transition-colors ${listeningField==='taskTitle'?'bg-red-500 text-white animate-pulse':'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}`}><Mic size={16}/></button>
                  </div>
                  
                  <div className="flex gap-2">
                    <div className="flex-1 relative">
                      <input placeholder="Time (e.g. 2h 30m)" className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none font-black dark:text-white dark:placeholder-slate-500 text-sm border border-transparent dark:border-slate-700" value={taskData.time} onChange={e=>setTaskData(p=>({...p,time:e.target.value}))}/>
                      {taskData.time && <div className="absolute -bottom-4 left-3 text-[9px] text-orange-500 font-black">= {fmtMins(parseTimeToMinutes(taskData.time))}</div>}
                    </div>
                    <label className="flex-shrink-0 bg-slate-100 dark:bg-slate-800 px-4 rounded-xl cursor-pointer flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 gap-2 border border-transparent dark:border-slate-700"><ImageIcon className="text-slate-600 dark:text-slate-400" size={16}/><span className="text-[11px] font-black text-slate-500 dark:text-slate-300 uppercase">Photos</span><input type="file" multiple accept="image/*" className="hidden" onChange={handleImageUpload}/></label>
                  </div>
                  
                  {activeJob?.showCosts && (
                    <div className="flex flex-col gap-2 mt-3">
                      <div className="flex gap-2">
                        <div className="flex-1 relative">
                          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-black text-sm">$</span>
                          <input placeholder="Rate/hr" className={`w-full pl-6 pr-8 p-3 rounded-xl outline-none font-black text-sm ${rateError?'bg-red-50 dark:bg-red-900/20 border-2 border-red-500':'bg-slate-50 dark:bg-slate-800 border-transparent dark:border-slate-700'} dark:text-white dark:placeholder-slate-500`} value={taskData.rate} onChange={e=>{const v=e.target.value;setTaskData(p=>({...p,rate:v}));validateRate(v);}} onBlur={e=>validateRate(e.target.value)}/>
                          <span className="absolute right-2 top-1/2 -translate-y-1/2 text-[9px] text-slate-400 font-black uppercase">/hr</span>
                        </div>
                        <div className="flex-1 relative">
                          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 font-black text-sm">$</span>
                          <div className="flex items-center gap-1">
                            <input placeholder="Materials $" className={`w-full pl-6 pr-8 p-3 rounded-xl outline-none font-black text-sm border ${matError?'bg-red-50 dark:bg-red-900/20 border-red-500':'bg-slate-50 dark:bg-slate-800 border-transparent dark:border-slate-700'} dark:text-white dark:placeholder-slate-500`} value={taskData.materialsCost} onChange={e=>{const v=e.target.value;setTaskData(p=>({...p,materialsCost:v}));validateMat(v);}} onBlur={e=>validateMat(e.target.value)}/>
                            <label className={`p-2.5 rounded-lg transition-colors cursor-pointer border dark:border-slate-700 ${isScanningReceipt ? 'bg-amber-100 text-amber-600 dark:bg-amber-900/40 animate-pulse' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700'}`}>
                              <Camera size={16}/>
                              <input type="file" accept="image/*" capture="environment" className="hidden" onChange={handleScanReceipt}/>
                            </label>
                            {userMaterials.length > 0 && (
                              <button onClick={() => setShowMaterialPop(!showMaterialPop)} className={`p-2.5 rounded-lg transition-colors border dark:border-slate-700 ${showMaterialPop ? 'bg-emerald-100 text-emerald-600 dark:bg-emerald-900/40' : 'bg-slate-100 dark:bg-slate-800 text-slate-500 hover:bg-slate-200 dark:hover:bg-slate-700'}`}><Package size={16}/></button>
                            )}
                          </div>
                        </div>
                      </div>
                      {showMaterialPop && userMaterials.length > 0 && (
                        <div className="bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl max-h-48 overflow-y-auto p-2 w-full">
                          {userMaterials.map((m, i) => (
                            <button key={i} onClick={() => { setTaskData(p=>({...p,materials:m.name,materialsCost:m.price})); setShowMaterialPop(false); }} className="w-full flex items-center justify-between p-3 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors text-left">
                              <span className="font-medium text-sm dark:text-white">{m.name}</span>
                              <span className="font-black text-sm text-emerald-600 dark:text-emerald-400">{fmtAUD(parseFloat(m.price))}</span>
                            </button>
                          ))}
                        </div>
                      )}
                    </div>
                  )}

                  {activeJob?.showCosts && (() => { const hrs=parseTimeToMinutes(taskData.time)/60; const labour=hrs*(parseFloat(taskData.rate)||0); const mats=parseFloat(taskData.materialsCost)||0; const total=labour+mats; return total>0 ? (<div className="bg-slate-900 dark:bg-slate-800 rounded-xl px-4 py-2 flex justify-between items-center"><div className="text-[10px] font-black text-slate-400 uppercase tracking-widest">{labour>0&&<span className="mr-3">Labour {fmtAUD(labour)}</span>}{mats>0&&<span>Mats {fmtAUD(mats)}</span>}</div><div className="text-white font-black text-sm">{fmtAUD(total)}</div></div>) : null; })()}
                  
                  {taskData.images.length > 0 && (
                    <div className="mt-4 img-preview-grid">
                      {taskData.images.map((img,i) => (<div key={i} className="relative w-full aspect-[4/3] group cursor-pointer" onClick={() => setEditingImageIdx(i)}><img src={img} className="w-full h-full object-cover rounded-xl border dark:border-slate-700 shadow-sm"/><div className="absolute inset-0 bg-slate-900/50 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><Edit3 className="text-white drop-shadow-md" size={24}/></div><button onClick={e=>{e.stopPropagation();setTaskData(p=>({...p,images:p.images.filter((_,idx)=>idx!==i)}));}} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md z-10"><X size={12}/></button></div>))}
                      <div className="col-span-full text-[10px] text-center text-slate-400 font-bold uppercase mt-1">Tap photo to annotate</div>
                    </div>
                  )}
                  
                  <input placeholder="Materials Used" className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none text-sm font-medium border border-transparent dark:border-slate-700 dark:text-white dark:placeholder-slate-500" value={taskData.materials} onChange={e=>setTaskData(p=>({...p,materials:e.target.value}))}/>
                  <input placeholder={activeJob?.type==='handover'?'Notes / Delays':'Tools Used'} className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none text-sm font-medium border border-transparent dark:border-slate-700 dark:text-white dark:placeholder-slate-500" value={taskData.tools} onChange={e=>setTaskData(p=>({...p,tools:e.target.value}))}/>
                  
                  <div className="relative">
                    <textarea placeholder="Full details…" className="w-full p-3 pr-10 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none text-sm font-medium h-24 resize-none border border-transparent dark:border-slate-700 dark:text-white dark:placeholder-slate-500" value={taskData.desc} onChange={e=>setTaskData(p=>({...p,desc:e.target.value}))}/>
                    <button type="button" onClick={() => toggleVoice('taskDesc', (val) => setTaskData(p => ({...p, desc: typeof val === 'function' ? val(p.desc) : val})))} className={`absolute right-2 bottom-3 p-2 rounded-full text-white shadow-md transition-all ${listeningField==='taskDesc'?'bg-red-500 animate-pulse':'bg-slate-900 dark:bg-slate-700 hover:bg-orange-500'}`}><Mic size={14}/></button>
                  </div>
                  
                  <button onClick={handleAiSuggest} disabled={isAiSuggesting||!apiKey} className={`w-full flex items-center justify-center gap-2 p-3 rounded-xl font-black text-[11px] uppercase tracking-widest transition-all active:scale-95 ${apiKey?'bg-purple-600 hover:bg-purple-500 text-white':'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'}`}><Sparkles size={14}/> {isAiSuggesting?'Thinking…':'AI Suggest Details'}</button>
                  
                  <div className="flex gap-2 pb-2">
                    <button onClick={handleSaveAsTemplate} className="flex-1 flex items-center justify-center gap-1.5 p-3 rounded-xl font-black text-[11px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-emerald-50 hover:text-emerald-600 border border-transparent dark:border-slate-700 transition-colors uppercase"><Bookmark size={14}/> Template</button>
                    {String(taskData.materials||'').trim() && String(taskData.materialsCost||'').trim() && (<button onClick={handleSaveMaterial} className="flex-1 flex items-center justify-center gap-1.5 p-3 rounded-xl font-black text-[11px] bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-amber-50 hover:text-amber-600 border border-transparent dark:border-slate-700 transition-colors uppercase"><Package size={14}/> Material</button>)}
                  </div>
                </div>
              </div>
              
              <div className="pt-3 border-t border-slate-100 dark:border-slate-800 flex-shrink-0">
                <button onClick={handleSaveTask} className={`w-full text-white p-4 rounded-xl font-black text-base shadow-lg flex items-center justify-center gap-2 transition-all hover:scale-[1.02] ${activeJob?.type==='handover'?'bg-emerald-600 hover:bg-emerald-500':'bg-slate-900 dark:bg-slate-700 hover:bg-slate-800'}`}><Save size={18}/> SAVE ENTRY</button>
              </div>
            </div>
          </div>
        )}

        {/* Naming Template Modal */}
        {isNamingTemplate && (
          <div className="fixed inset-0 z-[250] bg-slate-900/90 backdrop-blur-sm flex items-center justify-center p-4">
            <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] w-full max-w-sm p-6 shadow-2xl border border-slate-800 animate-slide-up sm:animate-none text-center">
              <h3 className="text-slate-900 dark:text-white font-black text-xl mb-4">Name your Template</h3>
              <input autoFocus className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none font-bold mb-4 dark:text-white border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-purple-400" placeholder="e.g. Bathroom Patch" value={saveTemplateName} onChange={e=>setSaveTemplateName(e.target.value)} onKeyDown={e=>e.key==='Enter'&&confirmSaveTemplate()}/>
              <div className="flex gap-3 w-full">
                <button onClick={() => setIsNamingTemplate(false)} className="flex-1 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 py-3 rounded-2xl font-black">Cancel</button>
                <button onClick={confirmSaveTemplate} className="flex-1 bg-purple-600 text-white py-3 rounded-2xl font-black shadow-lg shadow-purple-500/30">Save</button>
              </div>
            </div>
          </div>
        )}

        {/* Canvas annotation editor */}
        {editingImageIdx !== null && (
          <div className="fixed inset-0 z-[200] bg-slate-950 flex flex-col pb-safe">
            <div className="flex justify-between items-center p-4 bg-slate-900 border-b border-slate-800 shadow-md z-10 flex-shrink-0">
              <button onClick={() => setEditingImageIdx(null)} className="text-slate-300 hover:text-white font-bold text-sm px-4 py-2">CANCEL</button>
              <div className="flex items-center gap-2 text-white text-xs font-black uppercase tracking-widest"><Edit3 size={14} className="text-orange-500"/> Mark Defects</div>
              <button onClick={saveAnnotated} className="bg-orange-500 text-white font-bold text-sm px-4 py-2 rounded-xl">SAVE</button>
            </div>
            <div className="flex items-center justify-between px-4 py-2 bg-slate-900/80 border-b border-slate-800/50 flex-shrink-0">
              <div className="flex items-center gap-2">
                <div className={`flex items-center gap-1.5 text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-full ${canvasMode==='draw'?'bg-orange-500/20 text-orange-400 border border-orange-500/40':'bg-blue-500/20 text-blue-400 border border-blue-500/40'}`}>{canvasMode==='draw'?<Pencil size={11}/>:<Move size={11}/>}{canvasMode==='draw'?'Draw mode':'Pan mode'}</div>
                {canvasZoom>1 && <div className="text-[10px] font-black text-slate-500 uppercase">{canvasZoom.toFixed(1)}×</div>}
              </div>
              <div className="text-[10px] font-black text-slate-600 uppercase tracking-widest">Pinch to zoom · 2 fingers</div>
            </div>
            <div className="flex-1 overflow-hidden relative flex items-center justify-center bg-slate-950 canvas-editor-area">
              <div style={{transform:`translate(${canvasPan.x}px,${canvasPan.y}px) scale(${canvasZoom})`,transformOrigin:'center center',willChange:'transform'}}>
                <canvas ref={canvasRef} onMouseDown={onMDown} onMouseMove={onMMove} onMouseUp={onMUp} onMouseLeave={onMUp} onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} className="max-w-full max-h-full object-contain shadow-2xl" style={{cursor:canvasMode==='draw'?'crosshair':'grab',display:'block'}}/>
              </div>
            </div>
            <div className="bg-slate-900 border-t border-slate-800 p-4 z-10 flex-shrink-0">
              <div className="flex justify-between items-center">
                <div className="flex gap-3 items-center">{COLORS.map(c => <button key={c.name} onClick={() => setPenColor(c.hex)} className={`w-8 h-8 rounded-full shadow-inner transition-transform ${penColor===c.hex?'scale-125 ring-2 ring-white ring-offset-1 ring-offset-slate-900':'opacity-70 hover:opacity-100'}`} style={{backgroundColor:c.hex}}/>)}</div>
                <div className="flex items-center gap-3">
                  <button onClick={toggleMode} className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase transition-colors px-3 py-2 rounded-xl ${canvasMode==='pan'?'bg-blue-500/20 text-blue-400':'text-slate-400 hover:text-white'}`}>{canvasMode==='draw'?<Move size={20}/>:<Pencil size={20}/>} {canvasMode==='draw'?'Pan':'Draw'}</button>
                  {canvasZoom>1 && <button onClick={() => {setCanvasZoom(1);zoomRef.current=1;setCanvasPan({x:0,y:0});panRef.current={x:0,y:0};}} className="flex flex-col items-center gap-1 text-[10px] font-black uppercase text-slate-400 hover:text-white"><ZoomIn size={20}/>Reset</button>}
                  <button onClick={handleUndo} disabled={undoStack.length<=1} className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase ${undoStack.length<=1?'text-slate-700':'text-slate-300 hover:text-white'}`}><Undo size={20}/>Undo</button>
                  <button onClick={handleClear} disabled={undoStack.length<=1} className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase ${undoStack.length<=1?'text-slate-700':'text-red-400 hover:text-red-300'}`}><RefreshCcw size={20}/>Clear</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* **FIX**: Pass the `onUpdateJob` and `showToast` props to the PrintPreview component */}
        {printPreviewJob && <PrintPreview 
            job={printPreviewJob} 
            extraTaxRate={extraTaxRate} 
            businessProfile={businessProfile} 
            onClose={() => setPrintPreviewJob(null)}
            onUpdateJob={handleUpdateJobFromPreview} 
            showToast={showToast}
        />}
        
        {appointmentFromJob && <AppointmentFormModal appointment={appointmentFromJob} jobs={jobs} googleToken={googleToken} onSave={handleSaveAppointment} onClose={() => setAppointmentFromJob(null)} showToast={showToast}/>}
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
    </script>
  </body>
</html>
