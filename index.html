    <script type="text/babel" data-type="module">
  import React, { useState, useEffect, useRef, Component } from 'react';
  import ReactDOM from 'react-dom/client';
  import { createPortal } from 'react-dom';
  import { get, set } from 'idb-keyval';
  import {
    Trash2, ImageIcon, Printer, Plus, X, Hammer, ChevronRight, ChevronDown, Sparkles,
    Pencil, Save, HardDrive, CheckCircle2, Clock, Moon, Sun, Edit3, Undo,
    RefreshCcw, Move, ZoomIn, Check, Search, DollarSign, Tag, Share2, Map,
    MapPinned, Navigation, LocateFixed, AlertTriangle, Receipt, Home, Info,
    Download, Upload, Settings, FileText, Bot, Mic, ShieldAlert, Lock,
    Bookmark, Package, PlusCircle, Calendar, Building2, CalendarPlus, Award,
    ShieldCheck, BadgeCheck, FileCheck, Camera
  } from 'lucide-react';

  /* ─── Constants ─────────────────────────────────────────────── */
  const DB_KEY_JOBS      = 'jobsite-master-v4';
  const DB_KEY_TEMPL     = 'joblog-templates';
  const DB_KEY_MATS      = 'joblog-materials';
  const DB_KEY_APPOINTMENTS = 'joblog-appointments';

  const LICENCE_KEYS = [
    { key: "JOBLOG-DEMO-1234", expiry: null },
    { key: "JOBLOG-PRO-001",   expiry: "2027-01-01" },
    { key: "JOBLOG-PRO-002",   expiry: null },
    { key: "JOBLOG-PRO-003",   expiry: null },
    { key: "JOBLOG-PRO-004",   expiry: null },
    { key: "JOBLOG-PRO-005",   expiry: null },
  ];

  /* ─── Licence / Credential Types ────────────────────────────── */
  const LICENCE_TYPE_OPTIONS = [
    'QBCC (QLD)',
    'Fair Trading (NSW)',
    'VBA (VIC)',
    'Building Commission (WA)',
    'CBS (SA)',
    'OCBA (TAS)',
    'ICBN (NT)',
    'Access Canberra (ACT)',
    'Builders Licence',
    'Electrical Licence',
    'Plumbing Licence',
    'Gas Licence',
    'White Card',
    'Asbestos Removal',
    'Demolition Licence',
    'Rigging Licence',
    'Scaffolding Licence',
    'Crane Operator',
    'Refrigeration Licence',
    'Security Licence',
    'Other'
  ];

  const BIZA_KEY         = 'joblog-business';
  const MAX_STOPS        = 12;
  const GST_RATE         = 0.1;

  /* ─── Helpers ────────────────────────────────────────────────── */
  const parseTimeToMinutes = (str) => {
    if (!str) return 0;
    const s = str.toLowerCase().trim();
    const hM = s.match(/(\d+\.?\d*)\s*h/);
    const mM = s.match(/(\d+\.?\d*)\s*m(?:in(?:utes?)?)?(?:\b|$)/);
    if (!hM && !mM) { const n = parseFloat(s); return isNaN(n) ? 0 : n * 60; }
    return (hM ? parseFloat(hM[1]) * 60 : 0) + (mM ? parseFloat(mM[1]) : 0);
  };
  const fmtMins = (m) => { const h = Math.floor(m/60), r = Math.round(m%60); if (!h) return `${r}m`; if (!r) return `${h}h`; return `${h}h ${r}m`; };
  const fmtAUD  = (n) => `$${Number(n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-AU') : '';
  const fmtDateShort = (iso) => iso ? new Date(iso).toLocaleDateString('en-AU', {day:'numeric',month:'short',year:'2-digit'}) : '';
  const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString('en-AU', {day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}) : '';
  
  const toLocalISO = (d) => {
    if (!d) return '';
    const date = new Date(d);
    return new Date(date.getTime() - date.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  };

  const isExpiringSoon = (expiryStr) => {
    if (!expiryStr) return false;
    const diff = new Date(expiryStr) - new Date();
    return diff > 0 && diff < 60 * 24 * 60 * 60 * 1000; // 60 days
  };
  const isExpired = (expiryStr) => {
    if (!expiryStr) return false;
    return new Date(expiryStr) < new Date();
  };

  const getQuoteTotals = (tasks, gstEnabled, extraTaxRate = 0) => {
    let labour = 0, mats = 0;
    (tasks||[]).forEach(t => {
      labour += (parseTimeToMinutes(t.time)/60) * (parseFloat(t.rate)||0);
      mats   += parseFloat(t.materialsCost)||0;
    });
    const subtotal = labour + mats;
    const gst      = gstEnabled ? subtotal * GST_RATE : 0;
    const extra    = subtotal * (extraTaxRate / 100);
    const total    = subtotal + gst + extra;
    return { labour, mats, subtotal, gst, extra, total };
  };

  const compressImage = (file) => new Promise((res, rej) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onerror = () => rej(new Error(`FileReader failed: ${file.name}`));
    reader.onload = (ev) => {
      const img = new Image(); img.src = ev.target.result;
      img.onerror = () => rej(new Error(`Decode failed: ${file.name}`));
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          const MAX = 1200; let w = img.width, h = img.height;
          if (w > MAX) { h *= MAX/w; w = MAX; }
          if (h > MAX) { w *= MAX/h; h = MAX; }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          res(c.toDataURL('image/webp', 0.75));
        } catch(e) { rej(e); }
      };
    };
  });

  const compressLogo = (file) => new Promise((res, rej) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onerror = () => rej(new Error('Logo read failed'));
    reader.onload = (ev) => {
      const img = new Image(); img.src = ev.target.result;
      img.onerror = () => rej(new Error('Logo decode failed'));
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          const MAX = 320; let w = img.width, h = img.height;
          if (w > MAX) { h *= MAX/w; w = MAX; }
          if (h > MAX) { w *= MAX/h; h = MAX; }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          res(c.toDataURL('image/webp', 0.88));
        } catch(e) { rej(e); }
      };
    };
  });

  const STATUSES = [
    { key:'draft',    label:'Draft',    cls:'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700' },
    { key:'sent',     label:'Sent',     cls:'bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 border-blue-200 dark:border-blue-800' },
    { key:'approved', label:'Approved', cls:'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800' },
    { key:'invoiced', label:'Invoiced', cls:'bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-300 border-purple-200 dark:border-purple-800' },
  ];
  const getStatus = (k) => STATUSES.find(s => s.key===k) || STATUSES[0];

  const getStartOfWeek = (date, weekStartsOn = 1) => {
    const d = new Date(date);
    const day = d.getDay() || 7;
    const diff = d.getDate() - day + weekStartsOn;
    return new Date(d.setDate(diff));
  };

  /* ─── PrintEditableDiv ───────────────────────────────────────── */
  const PrintEditableDiv = ({ value, onChange, placeholder, className }) => (
    <div
      contentEditable suppressContentEditableWarning
      onBlur={e => onChange(e.currentTarget.innerText)}
      className={`empty:before:content-[attr(data-placeholder)] empty:before:text-slate-400 whitespace-pre-wrap outline-none ${className}`}
      data-placeholder={placeholder}
    >{value}</div>
  );

  class ErrorBoundary extends Component {
    constructor(props) { super(props); this.state = { hasError: false, error: null }; }
    static getDerivedStateFromError(error) { return { hasError: true, error }; }
    render() {
      if (this.state.hasError) return (
        <div className="min-h-screen flex items-center justify-center p-8 bg-slate-100 dark:bg-slate-950">
          <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] p-8 max-w-sm w-full text-center border dark:border-slate-800 shadow-xl">
            <div className="bg-red-100 dark:bg-red-900/30 p-4 rounded-2xl mb-4 inline-flex"><AlertTriangle size={32} className="text-red-500"/></div>
            <h2 className="text-xl font-black text-slate-900 dark:text-white mb-2">Something went wrong</h2>
            <p className="text-slate-500 dark:text-slate-400 text-sm mb-6">{this.state.error?.message || 'Unexpected error'}</p>
            <button onClick={() => window.location.reload()} className="bg-orange-500 hover:bg-orange-400 text-white font-black px-6 py-3 rounded-2xl w-full active:scale-95 transition-all">Reload App</button>
          </div>
        </div>
      );
      return this.props.children;
    }
  }

  /* ─── PayPalButton ───────────────────────────────────────────── */
  const PayPalButton = () => {
    const containerId = useRef(`paypal-${Math.random().toString(36).substr(2, 9)}`);
    useEffect(() => {
      if (window.paypal) {
        const el = document.getElementById(containerId.current);
        if (el && el.children.length === 0) {
          try { window.paypal.HostedButtons({ hostedButtonId: "KQQ6Q5YFX758G" }).render(`#${containerId.current}`); }

      <div className="flex justify-center overflow-x-auto" style={{ isolation: 'isolate' }}>
        <div id={containerId.current} className="paypal-isolate" style={{ minWidth: '220px', width: 'auto', display: 'inline-block' }}/>
      </div>
    );
  };

  /* ─── Toast ──────────────────────────────────────────────────── */
  const ToastMessage = ({ message, type, onClose }) => {
    useEffect(() => { const timer = setTimeout(onClose, 3500); return () => clearTimeout(timer); }, [onClose]);
    const icons = { success: <CheckCircle2 size={18} className="text-emerald-500"/>, error: <AlertTriangle size={18} className="text-red-500"/>, info: <Info size={18} className="text-blue-500"/> };
    return (
      <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] w-[90%] max-w-sm animate-slide-down">
        <div className="bg-slate-900 dark:bg-slate-800 text-white rounded-2xl shadow-2xl p-4 flex items-center gap-3 border border-slate-700">
          {icons[type]}<p className="text-sm font-bold flex-1">{message}</p>
          <button onClick={onClose} className="text-slate-400 hover:text-white"><X size={16}/></button>
        </div>
      </div>
    );

  /* ─── ConfirmDialog ──────────────────────────────────────────── */
  const ConfirmDialog = ({ message, confirmLabel = 'Delete', onConfirm, onCancel, danger = true }) => (

        <div className="flex gap-3">
          <button onClick={onCancel} className="flex-1 py-4 rounded-2xl bg-slate-100 dark:bg-slate-800 font-black text-sm text-slate-600 dark:text-slate-300 active:scale-95 transition-all">Cancel</button>
          <button onClick={onConfirm} className={`flex-1 py-4 rounded-2xl font-black text-sm text-white active:scale-95 transition-all ${danger ? 'bg-red-500 hover:bg-red-400' : 'bg-orange-500 hover:bg-orange-400'}`}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );

  /* ─── UpgradeModal ───────────────────────────────────────────── */
  const UpgradeModal = ({ onClose, onUnlock, showToast }) => {
    const [key, setKey] = useState('');
    const handleUnlock = () => {
      const input = key.trim().toUpperCase();
      const found = LICENCE_KEYS.find(k => k.key === input);
      if (!found) { showToast('Invalid licence key', 'error'); return; }
      if (found.expiry && new Date(found.expiry) < new Date()) { showToast('This key has expired', 'error'); return; }
      onUnlock(found); showToast('Full version unlocked!', 'success'); onClose();
    };
    return (
      <div className="fixed inset-0 z-[300] bg-slate-900/90 backdrop-blur-md flex items-end sm:items-center justify-center sm:p-4 overflow-y-auto">

          <div className="bg-slate-50 dark:bg-slate-800 p-4 rounded-2xl mb-6 border border-slate-200 dark:border-slate-700 text-left">

  /* ─── AIAssistModal ───────────────────────────────────────────── */
  const AIAssistModal = ({ onClose, onGenerate, isGenerating, docType, apiKey }) => {
    const [prompt, setPrompt] = useState('');
    return (
      <div className="fixed inset-0 z-[600] bg-slate-900/90 backdrop-blur-md flex items-end sm:items-center justify-center sm:p-4 animate-slide-up sm:animate-none">
        <div className="bg-white dark:bg-slate-900 rounded-t-[2.5rem] sm:rounded-[2.5rem] w-full max-w-md p-6 shadow-2xl border dark:border-slate-800 pb-safe">

              <textarea className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none text-sm font-medium h-32 resize-none dark:text-white dark:placeholder-slate-500 mb-4 focus:ring-2 focus:ring-purple-500 border border-slate-200 dark:border-slate-700" placeholder="Additional instructions (optional)..." value={prompt} onChange={e => setPrompt(e.target.value)}/>

  /* ═══════════════════════════════════════════════════════════
     LICENCE EDITOR — inline sub-component used in BusinessProfileEditor
  ═══════════════════════════════════════════════════════════ */
  const LicenceEditor = ({ licences, onChange }) => {
    const [editing, setEditing] = useState(null); // null | index | 'new'
    const blankLicence = { type: LICENCE_TYPE_OPTIONS[0], customType: '', number: '', expiry: '', state: '' };
    const [draft, setDraft] = useState(blankLicence);

    const openNew = () => { setDraft(blankLicence); setEditing('new'); };
    const openEdit = (i) => { setDraft({ ...licences[i] }); setEditing(i); };

    const save = () => {
      if (!draft.number.trim()) return;
      const entry = { ...draft, type: draft.type === 'Other' && draft.customType ? draft.customType : draft.type };
      let updated;
      if (editing === 'new') { updated = [...licences, entry]; }
      else { updated = licences.map((l, i) => i === editing ? entry : l); }
      onChange(updated);
      setEditing(null);
    };

    const remove = (i) => onChange(licences.filter((_, idx) => idx !== i));

    if (editing !== null) {
      return (
        <div className="bg-slate-50 dark:bg-slate-800 rounded-2xl p-4 border border-slate-200 dark:border-slate-700 space-y-3">
          <div className="flex items-center justify-between mb-1">
            <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest">{editing === 'new' ? 'Add Credential' : 'Edit Credential'}</span>
            <button onClick={() => setEditing(null)} className="text-slate-400 hover:text-slate-600"><X size={16}/></button>
          </div>
          <div>
            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Licence / Credential Type</label>
            <select
              className="w-full p-3 bg-white dark:bg-slate-700 rounded-xl outline-none text-sm font-bold dark:text-white focus:ring-2 focus:ring-orange-400 border border-slate-200 dark:border-slate-600"
              value={draft.type}
              onChange={e => setDraft(d => ({ ...d, type: e.target.value, customType: '' }))}
            >
              {LICENCE_TYPE_OPTIONS.map(opt => (
                <option key={opt} value={opt}>{opt}</option>
              ))}
            </select>
          </div>
          {draft.type === 'Other' && (
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Custom Label</label>
              <input className="w-full p-3 bg-white dark:bg-slate-700 rounded-xl outline-none text-sm font-bold dark:text-white focus:ring-2 focus:ring-orange-400 border border-slate-200 dark:border-slate-600" placeholder="e.g. Pest Control Licence" value={draft.customType} onChange={e => setDraft(d => ({ ...d, customType: e.target.value }))}/>
            </div>
          )}
          <div className="grid grid-cols-2 gap-3">
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Licence Number *</label>
              <input className="w-full p-3 bg-white dark:bg-slate-700 rounded-xl outline-none font-mono text-sm font-bold dark:text-white focus:ring-2 focus:ring-orange-400 border border-slate-200 dark:border-slate-600" placeholder="e.g. 1234567" value={draft.number} onChange={e => setDraft(d => ({ ...d, number: e.target.value }))}/>
            </div>
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">State / Jurisdiction</label>
              <input className="w-full p-3 bg-white dark:bg-slate-700 rounded-xl outline-none text-sm font-bold dark:text-white focus:ring-2 focus:ring-orange-400 border border-slate-200 dark:border-slate-600" placeholder="e.g. QLD" value={draft.state} onChange={e => setDraft(d => ({ ...d, state: e.target.value }))}/>
            </div>
          </div>
          <div>
            <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Expiry Date (optional)</label>
            <input type="date" className="w-full p-3 bg-white dark:bg-slate-700 rounded-xl outline-none text-sm font-bold dark:text-white focus:ring-2 focus:ring-orange-400 border border-slate-200 dark:border-slate-600" value={draft.expiry} onChange={e => setDraft(d => ({ ...d, expiry: e.target.value }))}/>
          </div>
          <div className="flex gap-2 pt-1">
            <button onClick={save} className="flex-1 bg-orange-500 hover:bg-orange-400 text-white py-2.5 rounded-xl font-black text-sm flex items-center justify-center gap-1.5"><Check size={14}/> Save</button>
            <button onClick={() => setEditing(null)} className="flex-1 bg-slate-200 dark:bg-slate-700 py-2.5 rounded-xl font-black text-sm text-slate-600 dark:text-slate-300">Cancel</button>
          </div>
        </div>
      );
    }

    return (
      <div className="space-y-2">
        {licences.length === 0 && (
          <p className="text-xs text-slate-400 font-medium text-center py-2">No credentials added yet.</p>
        )}
        {licences.map((lic, i) => {
          const expired = isExpired(lic.expiry);
          const expiring = isExpiringSoon(lic.expiry);
          return (
            <div key={i} className={`flex items-center justify-between p-3 rounded-xl border transition-all ${expired ? 'bg-red-50 dark:bg-red-900/20 border-red-200 dark:border-red-800' : expiring ? 'bg-amber-50 dark:bg-amber-900/20 border-amber-200 dark:border-amber-800' : 'bg-white dark:bg-slate-700 border-slate-200 dark:border-slate-600'}`}>
              <div className="flex items-center gap-3 min-w-0 flex-1">
                <BadgeCheck size={18} className={`${expired ? 'text-red-400' : expiring ? 'text-amber-400' : 'text-slate-400'} flex-shrink-0`} />
                <div className="min-w-0">
                  <p className="font-black text-xs text-slate-800 dark:text-white truncate">{lic.type}</p>
                  <p className="font-mono text-[10px] text-slate-500 dark:text-slate-400">{lic.number}{lic.state ? ` · ${lic.state}` : ''}</p>
                  {lic.expiry && (
                    <p className={`text-[9px] font-black uppercase mt-0.5 ${expired ? 'text-red-500' : expiring ? 'text-amber-500' : 'text-slate-400'}`}>
                      {expired ? 'EXPIRED: ' : expiring ? 'EXPIRES: ' : 'EXP: '}{fmtDate(lic.expiry)}
                    </p>
                  )}
                </div>
              </div>
              <div className="flex gap-1 flex-shrink-0 ml-2">
                <button onClick={() => openEdit(i)} className="p-1.5 text-slate-400 hover:text-blue-500 transition-colors"><Pencil size={14}/></button>
                <button onClick={() => remove(i)} className="p-1.5 text-slate-400 hover:text-red-500 transition-colors"><Trash2 size={14}/></button>
              </div>
            </div>
          );
        })}
        <button onClick={openNew} className="w-full flex items-center justify-center gap-2 py-2.5 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl text-xs font-black uppercase text-slate-400 hover:border-orange-400 hover:text-orange-500 transition-all">
          <PlusCircle size={14}/> Add Credential
        </button>
      </div>
    );
  };

  /* ─── BusinessProfileEditor ──────────────────────────────────── */

  /* ─── TemplateManager ────────────────────────────────────────── */
  const TemplateManager = ({ templates, onSave, onClose }) => {
    const [list, setList] = useState([...templates]);
    const [editing, setEditing] = useState(null);
    const [form, setForm] = useState({ name:'', title:'', time:'', rate:'', materialsCost:'', materials:'', tools:'', desc:'' });
    
    const addNew = () => { setEditing(-1); setForm({ name:'', title:'', time:'', rate:'', materialsCost:'', materials:'', tools:'', desc:'' }); };
    const editTemplate = (index) => { setEditing(index); setForm({...list[index].data, name: list[index].name}); };
    const deleteTemplate = (index) => { const nl = list.filter((_,i)=>i!==index); setList(nl); onSave(nl); };
    
    const saveForm = () => {
      if (!form.name.trim() || !form.title.trim()) return;
      const tpl = { name: form.name.trim(), type: 'quote', data: { title: form.title, time: form.time, rate: form.rate, materialsCost: form.materialsCost, materials: form.materials, tools: form.tools, desc: form.desc } };
      let updated = editing >= 0 ? list.map((t,i)=>i===editing?tpl:t) : [...list, tpl];
      setList(updated); onSave(updated); setEditing(null);
    };

    return (
      <div className="fixed inset-0 z-[200] bg-slate-900/95 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4">
        <div className="bg-white dark:bg-slate-900 rounded-t-[2.5rem] sm:rounded-[2.5rem] w-full max-w-md p-5 sm:p-6 shadow-2xl border dark:border-slate-800 max-h-[85vh] flex flex-col animate-slide-up sm:animate-none pb-safe">
          
          <div className="flex justify-between items-center mb-4 pb-3 border-b border-slate-100 dark:border-slate-800 flex-shrink-0">

          <div className="overflow-y-auto flex-1 no-scrollbar mb-2">

                {list.length === 0 && <p className="text-center text-sm text-slate-400 font-bold py-6">No templates saved yet.</p>}

                  <div key={i} className="flex items-center justify-between bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 p-3 rounded-2xl mb-2">
                    <div className="min-w-0 pr-3">
                      <span className="font-black text-sm text-slate-900 dark:text-white block truncate">{t.name}</span>
                      <p className="text-[10px] text-slate-500 dark:text-slate-400 truncate">{t.data.title}</p>
                    </div>
                    <div className="flex gap-1.5 flex-shrink-0">
                      <button onClick={() => editTemplate(i)} className="bg-blue-50 dark:bg-blue-900/30 text-blue-500 hover:text-blue-600 p-2 rounded-xl"><Pencil size={14}/></button>

              <div className="space-y-3 pb-2">

                <div className="grid grid-cols-2 gap-3">
                  <input className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-400 dark:text-white" placeholder="Time (e.g. 2h)" value={form.time} onChange={e=>setForm({...form,time:e.target.value})}/>
                  <input className="w-full p-3 bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 rounded-xl text-sm outline-none focus:ring-2 focus:ring-orange-400 dark:text-white" placeholder="Rate/hr $" value={form.rate} onChange={e=>setForm({...form,rate:e.target.value})}/>

  /* ─── Signature Pad Component ────────────────────────────────── */
  const SignaturePad = ({ onSave, initialData }) => {
    const canvasRef = useRef(null);
    const isDrawing = useRef(false);

    useEffect(() => {
      if (initialData && canvasRef.current) {
        const ctx = canvasRef.current.getContext('2d');
        const img = new Image();
        img.src = initialData;
        img.onload = () => ctx.drawImage(img, 0, 0);
      }
    }, [initialData]);

    const getPos = (e) => {
      if(!canvasRef.current) return {x:0,y:0};
      const rect = canvasRef.current.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      const scaleX = canvasRef.current.width / rect.width;
      const scaleY = canvasRef.current.height / rect.height;
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    };

    const start = (e) => {
      e.preventDefault();
      isDrawing.current = true;
      const pos = getPos(e);
      const ctx = canvasRef.current.getContext('2d');
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0f172a';
      ctx.beginPath();
      ctx.moveTo(pos.x, pos.y);
    };

    const draw = (e) => {
      if (!isDrawing.current) return;
      e.preventDefault();
      const pos = getPos(e);
      const ctx = canvasRef.current.getContext('2d');
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
    };

    const end = () => {
      if (!isDrawing.current) return;
      isDrawing.current = false;
      onSave(canvasRef.current.toDataURL());
    };

    const clear = () => {
      if(!canvasRef.current) return;
      const cvs = canvasRef.current;
      cvs.getContext('2d').clearRect(0, 0, cvs.width, cvs.height);
      onSave(null);
    };

    return (
      <div className="relative border-2 border-slate-300 border-dashed rounded-xl overflow-hidden bg-slate-50 no-print-border inline-block max-w-full touch-none">
        <canvas 
          ref={canvasRef} width={600} height={200} 
          className="w-full max-w-[600px] h-auto cursor-crosshair" 
          onMouseDown={start} onMouseMove={draw} onMouseUp={end} onMouseOut={end} 
          onTouchStart={start} onTouchMove={draw} onTouchEnd={end}
        />
        <button onClick={clear} className="absolute top-2 right-2 bg-slate-200 hover:bg-slate-300 text-slate-600 text-[10px] font-black uppercase px-2 py-1 rounded shadow no-print transition-colors">Clear</button>
      </div>
    );
  };

    const [dueDate, setDueDate] = useState('');
    const [files, setFiles] = useState([]);
    const [isImporting, setIsImporting] = useState(false);
    const fileInputRef = useRef(null);

    const handleFiles = (e) => { setFiles(prev => [...prev, ...Array.from(e.target.files)]); e.target.value = ''; };
    const removeFile = (index) => setFiles(prev => prev.filter((_,i) => i!==index));
    const createManual = () => { if (!addr.trim()) return showToast('Address is required', 'error'); onSave(addr.trim(), client.trim(), [], dueDate); };

    const createWithAI = async () => {
      if (!apiKey) { showToast('Please save a Gemini API key in Settings first.', 'error'); return; }
      setIsImporting(true);
      try {
        const fileParts = [];
        for (const file of files) {
          if (file.type === 'application/pdf' || file.type.startsWith('image/')) {
            const base64Data = await new Promise((resolve, reject) => { const reader = new FileReader(); reader.onload = () => resolve(reader.result.split(',')[1]); reader.onerror = reject; reader.readAsDataURL(file); });
            fileParts.push({ inlineData: { mimeType: file.type || 'application/pdf', data: base64Data } });
          }
        }
        
        const textPrompt = `You are a data extraction AI. Extract the job details from the attached files (if any) AND the following source text. If it is dictated text, figure out the address, client, and items automatically.
        
Source Text:
"""
${additionalText || 'No additional text provided.'}
"""

Combine the data intelligently. Return ONLY a valid JSON object with keys: "address", "clientName", "dueDate" (ISO YYYY-MM-DD or empty), "tasks" (array of objects with keys: title, time, rate, materialsCost, materials, tools, desc).`;

        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${apiKey}`, { 
          method:'POST', 
          headers:{'Content-Type':'application/json'}, 
          body: JSON.stringify({ 
            contents:[{parts:[{text:textPrompt},...fileParts]}], 
            generationConfig:{temperature:0,response_mime_type:'application/json'} 
          }) 
        });
        
        if (!res.ok) throw new Error(`API error ${res.status}`);
        const data = await res.json();
        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const json = JSON.parse(raw.replace(/```json\n?|```/g, '').trim());
        const tasks = (json.tasks || []).map(t => ({ title: t.title||'', time: t.time||'', rate: String(t.rate||''), materialsCost: String(t.materialsCost||''), materials: String(t.materials||''), tools: String(t.tools||''), desc: t.desc||'', images:[] }));
        onSave(json.address || addr, json.clientName || client, tasks, json.dueDate || dueDate);
        showToast('Successfully imported via AI!', 'success');
      } catch (err) { showToast(`AI import failed: ${err.message}`, 'error'); }
      finally { setIsImporting(false); }
    };

    const isHandover = type === 'handover';
    const canUseAI = apiKey && (files.length > 0 || additionalText.trim().length > 0);

    return (
      <div className="fixed inset-0 z-[150] bg-slate-900/90 backdrop-blur-md flex items-end sm:items-center justify-center sm:p-4">
        <div className="bg-white dark:bg-slate-900 rounded-t-[2.5rem] sm:rounded-[2.5rem] w-full max-w-md p-5 sm:p-6 shadow-2xl border dark:border-slate-800 relative overflow-hidden animate-slide-up sm:animate-none pb-safe">
          {isImporting && (
            <div className="absolute inset-0 bg-slate-900/80 rounded-t-[2.5rem] sm:rounded-[2.5rem] flex flex-col items-center justify-center z-10 backdrop-blur-sm">
              <div className="animate-spin rounded-full h-10 w-10 border-b-2 border-orange-500 mb-4"/>
              <p className="text-white font-black text-sm uppercase">Processing with AI…</p>
            </div>
          )}
          <div className="flex justify-between items-center mb-5">
            <div>
              <span className={`text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-widest ${isHandover ? 'bg-emerald-100 dark:bg-emerald-900 text-emerald-600 dark:text-emerald-300' : 'bg-orange-100 dark:bg-orange-900 text-orange-600 dark:text-orange-300'}`}>{isHandover ? 'Completion Report' : 'Job Sheet'}</span>
              <h2 className="text-2xl font-black text-slate-900 dark:text-white mt-1">New Project</h2>
            </div>
            <button onClick={onClose} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-white"><X size={20}/></button>
          </div>
          <div className="space-y-3 max-h-[70vh] overflow-y-auto no-scrollbar pb-4 pr-1">
            <div className="relative">
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Job Address *</label>
              <input autoFocus className="w-full p-3 pr-10 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none font-bold dark:text-white dark:placeholder-slate-500 focus:ring-2 focus:ring-orange-400 border border-transparent dark:border-slate-700" placeholder="e.g. 42 Acacia Ave, Sydney NSW" value={addr} onChange={e => setAddr(e.target.value)}/>
              <button type="button" onClick={() => toggleVoice('newJobAddr', setAddr)} className={`absolute right-2 bottom-2 p-1.5 rounded-lg transition-colors ${listeningField==='newJobAddr'?'bg-red-500 text-white animate-pulse':'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}`}><Mic size={16}/></button>
            </div>
            <div className="relative">
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Client Name</label>
              <input className="w-full p-3 pr-10 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none font-medium dark:text-white dark:placeholder-slate-500 focus:ring-2 focus:ring-orange-400 border border-transparent dark:border-slate-700" placeholder="e.g. John Smith" value={client} onChange={e => setClient(e.target.value)}/>
              <button type="button" onClick={() => toggleVoice('newJobClient', setClient)} className={`absolute right-2 bottom-2 p-1.5 rounded-lg transition-colors ${listeningField==='newJobClient'?'bg-red-500 text-white animate-pulse':'text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700'}`}><Mic size={16}/></button>
            </div>
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Due Date (optional)</label>
              <input type="date" className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none font-medium dark:text-white dark:placeholder-slate-500 focus:ring-2 focus:ring-orange-400 border border-transparent dark:border-slate-700" value={dueDate} onChange={e => setDueDate(e.target.value)}/>
            </div>
            <div className="flex items-center gap-3 py-1">
              <div className="flex-1 h-px bg-slate-100 dark:bg-slate-800"/><span className="text-[10px] font-black text-slate-400 uppercase tracking-widest">or use AI</span><div className="flex-1 h-px bg-slate-100 dark:bg-slate-800"/>
            </div>
            <div className="bg-slate-50 dark:bg-slate-800 rounded-xl p-3 border border-slate-100 dark:border-slate-700">
              <div className="mb-2">
                <p className="text-[11px] font-black text-slate-700 dark:text-slate-300 uppercase flex items-center gap-1.5"><Sparkles size={12} className="text-orange-500"/> AI Auto‑Fill</p>
                <p className="text-[10px] text-slate-400 mt-0.5">Attach documents or dictate what you did.</p>
              </div>
              <label className="flex items-center gap-2 mb-2 bg-slate-200 dark:bg-slate-700 px-3 py-2 rounded-lg cursor-pointer hover:bg-slate-300 transition-colors text-xs font-black uppercase"><Upload size={14}/> Add Documents<input ref={fileInputRef} type="file" multiple accept=".pdf,image/jpeg,image/png,image/webp" className="hidden" onChange={handleFiles}/></label>
              {files.length > 0 && (
                <div className="mb-2">{files.map((f, i) => (<div key={i} className="flex items-center gap-2 bg-white dark:bg-slate-600 p-2 rounded-lg mb-1 shadow-sm"><span className="text-[11px] font-medium truncate flex-1 dark:text-white">{f.name}</span><button onClick={() => removeFile(i)} className="text-red-400"><X size={14}/></button></div>))}</div>
              )}
              <div className="relative">
                <textarea className="w-full p-3 pr-10 bg-white dark:bg-slate-700 rounded-lg outline-none text-xs font-medium resize-none h-20 dark:text-white dark:placeholder-slate-400 shadow-sm" placeholder="Paste text or tap mic: 'I went to 123 Main st and installed 2 power points...'" value={additionalText} onChange={e => setAdditionalText(e.target.value)}/>
                <button type="button" onClick={() => toggleVoice('newJobAI', setAdditionalText)} className={`absolute right-2 bottom-2 p-2 rounded-full text-white shadow-md transition-all ${listeningField==='newJobAI'?'bg-red-500 animate-pulse':'bg-slate-900 dark:bg-slate-800 hover:bg-orange-500'}`}><Mic size={14}/></button>
              </div>
            </div>
          </div>
          <div className="flex gap-3 mt-4 pt-2 border-t border-slate-100 dark:border-slate-800">
            <button onClick={createManual} className={`flex-1 py-3 rounded-xl font-black text-sm shadow-xl transition-all ${addr.trim() ? 'bg-slate-900 dark:bg-slate-700 text-white hover:bg-slate-800 active:scale-95' : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'}`}>Create</button>
            {canUseAI && (
              <button onClick={createWithAI} disabled={isImporting} className="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-3 rounded-xl font-black text-sm shadow-xl flex items-center justify-center gap-2 transition-all active:scale-95"><Sparkles size={16}/> Auto-Fill</button>
            )}
          </div>
        </div>
      </div>
    );
  };

  /* ─── PrintPreview ───────────────────────────────────────────── */
  const PrintPreview = ({ job, extraTaxRate, businessProfile = {}, onClose, onUpdateJob, showToast }) => {
    const [tasks, setTasks] = useState(job.tasks.map(t => ({...t})));
    const [header, setHeader] = useState({
      address: job.address,
      clientName: job.clientName,
      clientRef: job.clientRef || '',
      date: job.date ? new Date(job.date).toISOString().slice(0, 10) : new Date().toISOString().slice(0, 10),
      dueDate: job.dueDate || '',
      projectNotes: job.projectNotes || '',
      projectPhotos: job.projectPhotos || [],
    });
    
    const [signatureEnabled, setSignatureEnabled] = useState(job.showSignature || false);
    const [signatureData, setSignatureData] = useState(job.signature || null);
    const [isGeneratingPDF, setIsGeneratingPDF] = useState(false);

    // Auto-sync changes back to main DB
    useEffect(() => {
      onUpdateJob({
        ...job,
        tasks,
        date: new Date(header.date).toISOString(),
        showSignature: signatureEnabled,
        signature: signatureData
      });
    }, [header.date, signatureEnabled, signatureData, tasks]);

    const updateTask = (index, field, value) => {
      const updated = [...tasks]; updated[index] = { ...updated[index], [field]: value }; setTasks(updated);
    };

    const totals = getQuoteTotals(tasks, job.gstEnabled, extraTaxRate);
    const showCosts = job.showCosts;
    const totalHours = tasks.reduce((a,t) => a + parseTimeToMinutes(t.time), 0);
    const biz = businessProfile;
    const docLabel = job.type === 'handover' ? 'Completion Report' : 'Quotation';

    const printLicences = (biz.licences || []);
    const hasInsurance = biz.insurance && biz.insurancePolicy;

    const handleSharePDF = async () => {
      const element = document.getElementById('pdf-content');
      setIsGeneratingPDF(true);
      try {
        const opt = { margin: 10, filename: `${job.clientName || 'Job'}-${fmtDateShort(header.date)}.pdf`, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
        const pdfBlob = await window.html2pdf().set(opt).from(element).output('blob');
        const file = new File([pdfBlob], `${job.clientName || 'Job_Report'}.pdf`, { type: 'application/pdf' });
        
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({ files: [file], title: `${docLabel} - ${biz.name || 'JobLog'}` });
        } else {
          // Fallback to auto-download if sharing is unsupported
          window.html2pdf().set(opt).from(element).save();
          showToast('Downloaded PDF (Sharing unsupported on this device)', 'success');
        }
      } catch (err) {
        showToast('Error generating PDF', 'error');
        console.error(err);
      } finally {
        setIsGeneratingPDF(false);
      }
    };

    return createPortal(
      <div id="print-container" className="print-preview-overlay fixed inset-0 z-[500] bg-slate-100 dark:bg-slate-900 p-4 sm:p-8 overflow-y-auto pb-safe">
        <div className="max-w-3xl mx-auto">
          <div className="flex flex-wrap justify-between items-center mb-6 no-print gap-4">
            <h2 className="text-xl font-black text-slate-800 dark:text-white">Review Document</h2>
            <div className="flex flex-wrap items-center gap-3">
              <button onClick={() => setSignatureEnabled(!signatureEnabled)} className={`px-4 py-2 rounded-xl font-black flex items-center gap-2 text-sm transition-colors border ${signatureEnabled ? 'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-400 border-emerald-200 dark:border-emerald-800' : 'bg-white dark:bg-slate-800 text-slate-500 border-slate-200 dark:border-slate-700'}`}>
                <Edit3 size={16}/> Signature
              </button>
              <button onClick={() => window.print()} className="bg-white dark:bg-slate-800 text-slate-800 dark:text-slate-200 px-4 py-2 rounded-xl font-black flex items-center gap-2 shadow-sm border dark:border-slate-700"><Printer size={16}/> Print</button>
              <button onClick={handleSharePDF} disabled={isGeneratingPDF} className="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded-xl font-black flex items-center gap-2 shadow-sm">
                {isGeneratingPDF ? <div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"/> : <Share2 size={16}/>} Share PDF
              </button>
              <button onClick={onClose} className="bg-slate-800 text-white px-4 py-2 rounded-xl font-black">Close</button>
            </div>
          </div>
          
          {/* PDF CONTENT WRAPPER */}
          <div id="pdf-content" className="bg-white text-black p-6 sm:p-10 shadow-2xl rounded-sm">
            {/* ─── Business Header ─── */}
            {biz.name && (
              <div className="pb-4 mb-4 border-b-2 border-slate-300">
                <div className="flex justify-between items-start">
                  <div className="flex items-center gap-4">
                    {biz.logo && <img src={biz.logo} className="h-16 w-auto object-contain rounded-lg" alt={biz.name}/>}
                    <div>
                      <h1 className="text-2xl font-black text-slate-900 leading-tight">{biz.name}</h1>
                      {biz.tradingName && <p className="text-sm text-slate-500 font-medium">T/A {biz.tradingName}</p>}
                      {biz.abn && <p className="text-xs font-bold text-slate-600 mt-0.5 font-mono">ABN {biz.abn}</p>}
                    </div>
                  </div>
                  
                  {/* Right-aligned Contact & Credential Details */}
                  <div className="text-right text-sm text-slate-600 space-y-0.5 flex flex-col items-end">
                    {biz.phone && <p className="font-bold">{biz.phone}</p>}
                    {biz.email && <p>{biz.email}</p>}
                    {biz.address && <p className="text-slate-400 text-xs mb-2">{biz.address}</p>}

                    {/* Licences stacked cleanly under contact info */}
                    {(printLicences.length > 0 || hasInsurance) && (
                      <div className="mt-1 pt-2 border-t border-slate-200 inline-block text-right min-w-[150px]">
                        {printLicences.map((lic, i) => (
                          <p key={i} className="text-[10px] text-slate-500 font-medium uppercase tracking-wide leading-tight mb-0.5">
                            {lic.type}: <span className="font-bold text-slate-800 font-mono">{lic.number}</span>
                          </p>
                        ))}
                        {hasInsurance && (
                          <p className="text-[10px] text-slate-500 font-medium uppercase tracking-wide leading-tight">
                            PLI ({biz.insurance}): <span className="font-bold text-slate-800 font-mono">{biz.insurancePolicy}</span>
                          </p>
                        )}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}

            {/* ─── Document Header ─── */}
            <div className="border-b-2 border-slate-300 pb-3 mb-4">
              <div className="flex justify-between items-center text-xs font-black uppercase text-slate-500 mb-2">
                <span>{docLabel}</span>
                {/* Editable Date Input */}
                <PrintEditableDiv 
                  value={fmtDate(header.date)} 
                  onChange={(val) => {
                    // Try to parse common date formats
                    let parsedDate = null;
                    if (val.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/)) {
                      const [_, day, month, year] = val.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
                      parsedDate = new Date(year, month - 1, day);
                    } else if (val.match(/^\d{4}-\d{2}-\d{2}$/)) {
                      parsedDate = new Date(val);
                    } else {
                      parsedDate = new Date(val);
                    }
                    
                    if (parsedDate && !isNaN(parsedDate.getTime())) {
                      setHeader({...header, date: parsedDate.toISOString().slice(0, 10)});
                    } else if (val === '') {
                      setHeader({...header, date: new Date().toISOString().slice(0, 10)});
                    }
                    // Invalid dates are ignored - field stays as-is
                  }}
                  placeholder="DD/MM/YYYY"
                  className="bg-transparent border-b border-dashed border-slate-300 text-right outline-none text-slate-800 cursor-text font-mono text-xs w-32 text-right"
                />
              <input className="w-full text-3xl font-black bg-transparent border-b border-dashed border-slate-300 mb-2 pb-1 outline-none" value={header.clientName} onChange={e => setHeader({...header, clientName: e.target.value})} placeholder="Client Name"/>
              {header.clientRef && <input className="w-full text-lg font-bold bg-transparent border-b border-dashed border-slate-300 mb-1 pb-1 outline-none" value={header.clientRef} onChange={e => setHeader({...header, clientRef: e.target.value})} placeholder="Reference"/>}
              <input className="w-full text-slate-500 font-medium bg-transparent border-b border-dashed border-slate-300 mb-2 pb-1 outline-none" value={header.address} onChange={e => setHeader({...header, address: e.target.value})} placeholder="Address"/>
              {header.dueDate && <div className="text-sm font-bold text-amber-600 mb-2">Due: {fmtDate(header.dueDate)}</div>}
              <PrintEditableDiv value={header.projectNotes} onChange={v => setHeader({...header, projectNotes: v})} placeholder="Project notes / Document Summary" className="w-full text-sm italic bg-transparent border-b border-dashed border-slate-300 mb-2 pb-1"/>
              {header.projectPhotos?.length > 0 && (
                <div className="flex gap-2 mt-2 overflow-x-auto">{header.projectPhotos.map((p,i) => <img key={i} src={p} className="h-16 rounded-lg" alt=""/>)}</div>
              )}
              <div className="flex gap-4 mt-2 text-sm font-medium">
                <span>TOTAL TIME: {fmtMins(totalHours)}</span>
                {showCosts && totals.total > 0 && <span>TOTAL: {fmtAUD(totals.total)} {job.gstEnabled ? '(inc. GST)' : ''}</span>}
              </div>
            </div>

            {/* ─── Tasks ─── */}
            {tasks.map((t, idx) => {
              const labour = (parseTimeToMinutes(t.time)/60)*(parseFloat(t.rate)||0);
              const mats   = parseFloat(t.materialsCost)||0;
              const subtotal = labour + mats;
              return (
                <div key={idx} className="print-card">
                  <div className={`px-5 py-3 font-black border-b flex justify-between items-center text-lg uppercase ${job.type==='handover' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-slate-50 text-slate-800 border-slate-200'}`}>
                    <input className="flex-1 font-black bg-transparent border-none outline-none" value={t.title} onChange={e => updateTask(idx, 'title', e.target.value)}/>
                    <input className="w-20 text-sm bg-transparent border-none outline-none text-right" value={t.time} onChange={e => updateTask(idx, 'time', e.target.value)}/>
                    {showCosts && subtotal > 0 && <span className="text-sm text-emerald-700 ml-4">{fmtAUD(subtotal)}</span>}
                  </div>
                  <div className="p-6">
                    <PrintEditableDiv value={t.desc} onChange={v => updateTask(idx, 'desc', v)} placeholder="Task description" className="w-full text-[14px] text-slate-700 mb-6 border-l-4 border-slate-200 pl-4 italic font-medium bg-transparent outline-none"/>
                    <div className="grid grid-cols-2 gap-4 mb-4">
                      <div className="p-4 bg-slate-50 rounded-xl border">
                        <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Materials</label>
                        <input className="text-[12px] font-bold text-slate-600 bg-transparent border-none outline-none w-full" value={t.materials} onChange={e => updateTask(idx, 'materials', e.target.value)}/>
                      </div>
                      <div className="p-4 bg-slate-50 rounded-xl border">
                        <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">{job.type==='handover' ? 'Notes/Delays' : 'Tools Used'}</label>
                        <input className="text-[12px] font-bold text-slate-600 bg-transparent border-none outline-none w-full" value={t.tools} onChange={e => updateTask(idx, 'tools', e.target.value)}/>
                      </div>
                      {showCosts && (labour > 0 || mats > 0) && (
                        <>
                          <div className="p-4 bg-slate-50 rounded-xl border">
                            <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Labour Cost</label>
                            <span className="text-[12px] font-bold text-slate-600">{fmtAUD(labour)}{t.rate ? ` ($${t.rate}/hr)` : ''}</span>
                          </div>
                          <div className="p-4 bg-slate-50 rounded-xl border">
                            <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Materials Cost</label>
                            <span className="text-[12px] font-bold text-slate-600">{fmtAUD(mats)}</span>
                          </div>
                        </>
                      )}
                    </div>
                    {t.images?.length > 0 && (
                      <div className="print-img-container">
                        {t.images.map((img,i) => <div key={i} className="rounded-lg overflow-hidden border aspect-[4/3] shadow-sm bg-slate-100"><img src={img} className="w-full h-full object-cover"/></div>)}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}

            {/* ─── Totals ─── */}
            {showCosts && totals.total > 0 && (
              <div className="mt-6 border-2 border-slate-900 rounded-2xl p-6 flex justify-between items-end">
                <div>
                  <p className="font-black uppercase text-slate-500 text-sm">Labour: {fmtAUD(totals.labour)}</p>
                  <p className="font-black uppercase text-slate-500 text-sm">Materials: {fmtAUD(totals.mats)}</p>
                  {job.gstEnabled && (<><p className="font-black uppercase text-slate-600 text-sm mt-2 border-t border-slate-200 pt-2">Subtotal: {fmtAUD(totals.subtotal)}</p><p className="font-black uppercase text-slate-600 text-sm">GST (10%): {fmtAUD(totals.gst)}</p></>)}
                  {extraTaxRate > 0 && <p className="font-black uppercase text-purple-600 text-sm">Tax/Markup ({extraTaxRate}%): {fmtAUD(totals.extra)}</p>}
                </div>
                <div className="text-right">
                  <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">{job.type === 'handover' ? 'Total Due' : job.gstEnabled ? 'Total inc. Tax/GST' : 'Quotation Total'}</p>
                  <p className="text-4xl font-black text-slate-900">{fmtAUD(totals.total)}</p>
                  {job.gstEnabled && <p className="text-xs text-slate-400 font-bold mt-1">GST included: {fmtAUD(totals.gst)}</p>}
                </div>
              </div>
            )}

            {/* ─── Signature Box ─── */}
            {signatureEnabled && (
              <div className="mt-8 pt-6 border-t-2 border-slate-200 break-inside-avoid">
                <p className="text-sm font-black text-slate-800 uppercase tracking-widest mb-3">Client Approval / Signature</p>
                <SignaturePad onSave={(data) => setSignatureData(data)} initialData={signatureData} />
              </div>
            )}
            
          </div>
        </div>
      </div>,
      document.body
    );
  };

/* ═══════════════════════════════════════════════════════════

  /* ─── Schedule View ────────────────────────────────────────── */
  const ScheduleView = ({ appointments, jobs, googleToken, onSaveAppointment, onDeleteAppointment, isGoogleConnected, showConfirm, onScheduleFromJob, showToast }) => {
    const [weekOffset, setWeekOffset] = useState(0);
    const [apptModal, setApptModal] = useState(null);
    const [googleEvents, setGoogleEvents] = useState([]);
    const [loadingGoogle, setLoadingGoogle] = useState(false);
    const today = new Date();
    const startOfWeek = getStartOfWeek(today, 1);
    startOfWeek.setDate(startOfWeek.getDate() + (weekOffset * 7));
    startOfWeek.setHours(0,0,0,0);
    const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const days = Array.from({length:7}, (_,i) => { const d = new Date(startOfWeek); d.setDate(d.getDate()+i); return d; });
    const hours = Array.from({length:15}, (_,i) => i+6);
    
    useEffect(() => {
      if (!googleToken || !isGoogleConnected) return;
      const fetchEvents = async () => {
        setLoadingGoogle(true);
        try {
          const timeMin = new Date(startOfWeek).toISOString();
          const timeMax = new Date(days[6].getTime() + 24*3600*1000).toISOString();
          const res = await fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`, { headers: { Authorization: `Bearer ${googleToken.access_token}` } });
          if (res.status === 401) { showToast('Google session expired. Please reconnect.', 'error'); return; }
          const data = await res.json();
          setGoogleEvents(data.items || []);
        } catch (e) { console.error('Failed to fetch Google events', e); }
        finally { setLoadingGoogle(false); }
      };
      fetchEvents();
    }, [googleToken, weekOffset, isGoogleConnected]);

    const localEvents = appointments.map(a => ({ ...a, isLocal: true, start: new Date(a.start), end: new Date(a.end) }));
    const localGoogleIds = new Set(appointments.filter(a => a.googleEventId).map(a => a.googleEventId));
    const externalGoogleEvents = googleEvents.filter(ev => !localGoogleIds.has(ev.id)).map(ev => ({ id: ev.id, title: ev.summary || '(No title)', start: new Date(ev.start.dateTime || ev.start.date), end: new Date(ev.end.dateTime || ev.end.date), isGoogle: true, notes: ev.description || '' }));
    const allEvents = [...localEvents, ...externalGoogleEvents];
    
    const getEventsForSlot = (day, hour) => {
      const slotStart = new Date(day); slotStart.setHours(hour,0,0,0);
      const slotEnd = new Date(slotStart); slotEnd.setHours(hour+1,0,0,0);
      return allEvents.filter(ev => ev.start < slotEnd && ev.end > slotStart);
    };
    
    const handleSlotClick = (day, hour) => {
      const defStart = new Date(day); defStart.setHours(hour,0,0,0);
      const defEnd = new Date(defStart); defEnd.setHours(hour+1,0,0,0);
      setApptModal({ appointment: { id: null, title: '', jobId: '', start: defStart.toISOString(), end: defEnd.toISOString(), notes: '' } });
    };
    
    const handleEventClick = (event) => { if (event.isGoogle) return; setApptModal({ appointment: event }); };
    
    const handleSave = async (data) => {
      if (googleToken && isGoogleConnected && !data.googleEventId) {
        try {
          const gEvent = { summary: data.title, description: data.notes || '', start: { dateTime: new Date(data.start).toISOString(), timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }, end: { dateTime: new Date(data.end).toISOString(), timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone } };
          const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', { method: 'POST', headers: { Authorization: `Bearer ${googleToken.access_token}`, 'Content-Type': 'application/json' }, body: JSON.stringify(gEvent) });
          const created = await res.json();
          data.googleEventId = created.id;
          showToast('Saved to Google Calendar', 'success');
        } catch (e) { showToast('Google sync failed', 'error'); }
      } else { showToast('Appointment Saved', 'success'); }
      onSaveAppointment(data); setApptModal(null);
    };
    
    const handleDeleteAppointment = (id) => {
      showConfirm('Delete this appointment?', () => {
        const appt = appointments.find(a => a.id === id);
        if (appt?.googleEventId && googleToken) { fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${appt.googleEventId}`, { method: 'DELETE', headers: { Authorization: `Bearer ${googleToken.access_token}` } }).catch(e => console.error('Failed to delete Google event', e)); }
        onDeleteAppointment(id); 
        setApptModal(null);
        showToast('Appointment Deleted', 'info');
      });
    };

    return (
      <div className="max-w-6xl mx-auto p-4 animate-slide-up pb-24">
        <div className="flex justify-between items-center mb-4">
          <button onClick={() => setWeekOffset(o => o-1)} className="p-3 bg-slate-200 dark:bg-slate-800 rounded-xl"><ChevronRight size={18} className="rotate-180"/></button>
          <h2 className="text-xl font-black uppercase text-center">{days[0].toLocaleDateString('en-AU', {day:'numeric',month:'short'})} – {days[6].toLocaleDateString('en-AU', {day:'numeric',month:'short',year:'2-digit'})}</h2>
          <button onClick={() => setWeekOffset(o => o+1)} className="p-3 bg-slate-200 dark:bg-slate-800 rounded-xl"><ChevronRight size={18}/></button>
        </div>
        <div className="calendar-grid shadow-sm">
          <div className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 font-black text-[10px] uppercase text-slate-500 dark:text-slate-400 flex items-center justify-center">Time</div>
          {days.map((d,i) => (
            <div key={i} className={`bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 font-black text-[10px] uppercase text-slate-500 dark:text-slate-400 flex items-center justify-center py-2 ${d.toDateString()===today.toDateString()?'text-orange-500':''}`}>{dayNames[i]}<br/>{d.getDate()}</div>
          ))}
          {hours.map(hour => (
            <React.Fragment key={hour}>
              <div className="calendar-hour">{hour}:00</div>
              {days.map((day, di) => {
                const slotEvents = getEventsForSlot(day, hour);
                return (
                  <div key={di} className="calendar-cell" onClick={() => handleSlotClick(day, hour)}>
                    {slotEvents.map(ev => (
                      <div key={ev.id} onClick={(e) => { e.stopPropagation(); handleEventClick(ev); }}
                        className={`calendar-event ${ev.isGoogle ? 'bg-blue-200 dark:bg-blue-800 text-slate-800 dark:text-blue-200' : ev.isLocal ? 'bg-orange-100 dark:bg-orange-900/60 text-orange-800 dark:text-orange-200' : 'bg-slate-200 dark:bg-slate-600'}`}
                        style={{ top: `${(ev.start.getMinutes()/60)*100}%`, height: `${Math.min(((ev.end - ev.start)/3600000)*100, 100)}%` }}>
                        <div className="truncate text-[9px] font-black">{ev.title}</div>
                      </div>
                    ))}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>
        <div className="mt-6 bg-white dark:bg-slate-800 rounded-3xl p-5 border dark:border-slate-700 shadow-sm">
          <h3 className="font-black text-sm uppercase tracking-widest mb-3 flex items-center gap-2"><Clock size={14} className="text-orange-500"/> Upcoming Appointments</h3>
          {allEvents.filter(ev => ev.start >= new Date()).sort((a,b)=>a.start-b.start).slice(0,5).map(ev => (
            <div key={ev.id} className="flex items-center justify-between py-2 border-b dark:border-slate-700 last:border-0">
              <div><p className="font-bold text-sm">{ev.title}</p><p className="text-[10px] text-slate-400">{fmtDateTime(ev.start.toISOString())} – {fmtDateTime(ev.end.toISOString())}</p></div>
              {!ev.isGoogle && <button onClick={() => handleDeleteAppointment(ev.id)} className="text-red-400 hover:text-red-600 p-2"><Trash2 size={16}/></button>}
            </div>
          ))}
          {allEvents.length===0 && <p className="text-sm text-slate-400">No upcoming appointments.</p>}
        </div>
        {apptModal && (
          <AppointmentFormModal 
            appointment={apptModal.appointment} 
            jobs={jobs} 
            googleToken={googleToken} 
            onSave={handleSave} 
            onDelete={() => handleDeleteAppointment(apptModal.appointment.id)}
            onClose={() => setApptModal(null)} 
            showToast={showToast}
          />
        )}
      </div>
    );
  };

    }, [isDarkMode]);

    const activeJob = jobs.find(j => j.id === activeJobId);
    const getTotals = (tasks) => { const m=(tasks||[]).reduce((a,t)=>a+parseTimeToMinutes(t.time),0); return { mins:m, str:fmtMins(m) }; };

    const connectGoogleCalendar = (clientId) => {
      if (!clientId) return;
      const tokenClient = google.accounts.oauth2.initTokenClient({ client_id: clientId, scope: 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly', callback: (response) => { if (response.error) return showToast('Google sign-in failed', 'error'); setGoogleToken(response); localStorage.setItem('googleToken', JSON.stringify(response)); localStorage.setItem('googleClientId', clientId); showToast('Google Calendar Connected!', 'success'); } });
      tokenClient.requestAccessToken({ prompt: '' });
    };
    const disconnectGoogleCalendar = () => { setGoogleToken(null); localStorage.removeItem('googleToken'); };
    useEffect(() => { const savedToken = localStorage.getItem('googleToken'); if (savedToken) { try { const parsed = JSON.parse(savedToken); if (parsed && parsed.access_token) setGoogleToken(parsed); } catch {} } }, []);

    const handleSaveAppointment = (appt) => {

    };
    const handleNewJobClick = (type) => { if (!isUnlocked && jobs.length >= 3) { setShowUpgrade(true); } else { setNewJobModal(type); } };
    const handleUnlockSuccess = (keyData) => { setIsUnlocked(true); localStorage.setItem('joblog-unlocked', 'true'); if (keyData) localStorage.setItem('joblog-licence', JSON.stringify(keyData)); };
    const callGemini = async (prompt) => {
      const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${apiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { temperature: 0.3, response_mime_type: 'application/json' } }) });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
      return JSON.parse(raw.replace(/```json\n?|```/g, '').trim());
    };
    const handleGenerateDocument = async (customPrompt) => {
      if (!apiKey) { showToast('Please add your Gemini API key in Settings.', 'error'); return; }
      setIsGenerating(true);
      try {
        const job = activeJob;
        const qt = getQuoteTotals(job.tasks, job.gstEnabled, extraTaxRate);
        const docType = job.type === 'handover' ? 'Completion Invoice' : 'Quotation';

      recognitionRef.current = recognition;
      recognition.continuous = false;
      recognition.interimResults = false;

    const getMyLocation = () => {

    const atStopLimit = selectedJobs.length >= MAX_STOPS;

        if (sortBy === 'due_desc') { if (!a.dueDate) return 1; if (!b.dueDate) return -1; return new Date(b.dueDate).getTime() - new Date(a.dueDate).getTime(); }
        if (sortBy === 'az') return String(a.address || '').localeCompare(String(b.address || ''));
        return 0;
      });
    const handleShare = async () => {

      let text = `Project: ${activeJob.address}\nClient: ${activeJob.clientName || 'N/A'}\n`;

      if (navigator.share) { try { await navigator.share({ title: 'Job Summary', text }); } catch(e) {} }

    // **FIX**: Handler for updates from the PrintPreview modal
    const handleUpdateJobFromPreview = (updatedJob) => {

    // Canvas helpers
    const resetView = () => { setCanvasZoom(1); zoomRef.current=1; setCanvasPan({x:0,y:0}); panRef.current={x:0,y:0}; setCanvasMode('draw'); modeRef.current='draw'; };
    useEffect(() => {
      if (editingImageIdx !== null && canvasRef.current) {
        resetView();
        const cvs = canvasRef.current, ctx = cvs.getContext('2d'), img = new Image();
        img.src = taskData.images[editingImageIdx];
        img.onload = () => { cvs.width=img.width; cvs.height=img.height; ctx.drawImage(img,0,0,img.width,img.height); setUndoStack([cvs.toDataURL()]); };
      }
    }, [editingImageIdx, taskData.images]);
    const getCoords = (e) => { const cvs=canvasRef.current, r=cvs.getBoundingClientRect(); let cx=e.clientX, cy=e.clientY; if (e.touches?.length>0) { cx=e.touches[0].clientX; cy=e.touches[0].clientY; } return { x:(cx-r.left)*(cvs.width/r.width), y:(cy-r.top)*(cvs.height/r.height) }; };
    const startDraw = (e) => { setIsDrawing(true); drawRef.current=true; const {x,y}=getCoords(e), ctx=canvasRef.current.getContext('2d'); ctx.strokeStyle=penColor; ctx.lineWidth=Math.max(3,canvasRef.current.width/100); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(x,y); };
    const doDraw = (e) => { if (!drawRef.current) return; e.preventDefault(); const {x,y}=getCoords(e), ctx=canvasRef.current.getContext('2d'); ctx.lineTo(x,y); ctx.stroke(); };
    const stopDraw = () => { if (!drawRef.current) return; setIsDrawing(false); drawRef.current=false; setUndoStack(p=>[...p,canvasRef.current.toDataURL()]); };
    const handleUndo = () => { if (undoStack.length<=1) return; const ns=[...undoStack]; ns.pop(); const img=new Image(); img.src=ns[ns.length-1]; img.onload=()=>{ const ctx=canvasRef.current.getContext('2d'); ctx.clearRect(0,0,canvasRef.current.width,canvasRef.current.height); ctx.drawImage(img,0,0,canvasRef.current.width,canvasRef.current.height); setUndoStack(ns); }; };
    const handleClear = () => { if (undoStack.length<=1) return; const img=new Image(); img.src=undoStack[0]; img.onload=()=>{ const ctx=canvasRef.current.getContext('2d'); ctx.clearRect(0,0,canvasRef.current.width,canvasRef.current.height); ctx.drawImage(img,0,0,canvasRef.current.width,canvasRef.current.height); setUndoStack([undoStack[0]]); }; };
    const saveAnnotated = () => { if (!canvasRef.current) return; const imgs=[...taskData.images]; imgs[editingImageIdx]=canvasRef.current.toDataURL('image/webp',0.8); setTaskData(p=>({...p,images:imgs})); setEditingImageIdx(null); };
    const dist2 = (t1,t2) => Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY);
    const onTouchStart = (e) => { if (e.touches.length===2) { if (drawRef.current) { drawRef.current=false; setIsDrawing(false); setUndoStack(p=>[...p,canvasRef.current.toDataURL()]); } pinchRef.current={ dist:dist2(e.touches[0],e.touches[1]), zoom:zoomRef.current }; } else if (e.touches.length===1) { pinchRef.current=null; if (modeRef.current==='pan') { panStartRef.current={ clientX:e.touches[0].clientX, clientY:e.touches[0].clientY, panX:panRef.current.x, panY:panRef.current.y }; } else startDraw(e); } };
    const onTouchMove = (e) => { e.preventDefault(); if (e.touches.length===2 && pinchRef.current) { const nz=Math.min(Math.max(pinchRef.current.zoom*(dist2(e.touches[0],e.touches[1])/pinchRef.current.dist),1),6); setCanvasZoom(nz); zoomRef.current=nz; } else if (e.touches.length===1) { if (modeRef.current==='pan' && panStartRef.current) { const np={ x:panStartRef.current.panX+(e.touches[0].clientX-panStartRef.current.clientX), y:panStartRef.current.panY+(e.touches[0].clientY-panStartRef.current.clientY) }; setCanvasPan(np); panRef.current=np; } else if (modeRef.current==='draw') doDraw(e); } };
    const onTouchEnd = (e) => { if (e.touches.length<2) pinchRef.current=null; if (e.touches.length===0) { panStartRef.current=null; if (modeRef.current==='draw') stopDraw(); } };
    const toggleMode = () => { const n=modeRef.current==='draw'?'pan':'draw'; setCanvasMode(n); modeRef.current=n; };

    const onMMove = (e) => { if (modeRef.current==='draw') doDraw(e); else if (modeRef.current==='pan' && panStartRef.current) { const np={x:panStartRef.current.panX+(e.clientX-panStartRef.current.clientX),y:panStartRef.current.panY+(e.clientY-panStartRef.current.clientY)}; setCanvasPan(np); panRef.current=np; } };

                  {headerDraft.projectPhotos.length > 0 && (<div className="flex gap-2 overflow-x-auto pb-2 mt-2">{headerDraft.projectPhotos.map((p,i) => (<div key={i} className="relative h-16 w-16 flex-shrink-0"><img src={p} className="w-full h-full object-cover rounded-lg" alt=""/><button onClick={() => setHeaderDraft(d=>({...d,projectPhotos:d.projectPhotos.filter((_,idx)=>idx!==i)}))} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-0.5"><X size={10}/></button></div>))}</div>)}

                  </div>
                </div>
              ) : (

                    <h2 className="text-2xl font-black text-slate-900 dark:text-white leading-tight">{activeJob?.address}</h2>

                    {activeJob?.clientRef && <p className="text-slate-400 text-xs font-bold mt-1 uppercase tracking-widest">REF: {activeJob.clientRef}</p>}

                    {activeJob?.projectNotes && <p className="text-slate-500 dark:text-slate-400 italic text-sm mt-2 border-l-4 border-slate-300 pl-3 whitespace-pre-wrap">{activeJob.projectNotes}</p>}

                    <button onClick={() => cycleStatus(activeJobId)} className={`px-3 py-1.5 rounded-lg font-black text-[11px] uppercase tracking-widest transition-all border ${getStatus(activeJob?.status||'draft').cls}`}>{getStatus(activeJob?.status||'draft').label}</button>

                        <div className="bg-slate-800 dark:bg-slate-900 rounded-xl p-3"><p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Materials</p><p className="font-black text-white text-sm">{fmtAUD(qt.mats)}</p></div>

                      {extraTaxRate > 0 && (<div className={`grid mt-2 gap-2 ${activeJob.gstEnabled ? 'grid-cols-2' : 'grid-cols-2'}`}>{activeJob.gstEnabled && <div className="bg-slate-800 dark:bg-slate-900 rounded-xl p-3"><p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">GST (10%)</p><p className="font-black text-amber-400 text-sm">{fmtAUD(qt.gst)}</p></div>}<div className="bg-slate-800 dark:bg-slate-900 rounded-xl p-3"><p className="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-1">Markup ({extraTaxRate}%)</p><p className="font-black text-purple-400 text-sm">{fmtAUD(qt.extra)}</p></div><div className="bg-orange-500 rounded-xl p-3 col-span-2"><p className="text-[10px] font-black text-orange-200 uppercase tracking-widest mb-1">Total inc. Tax</p><p className="font-black text-white text-lg">{fmtAUD(qt.total)}</p></div></div>)}
                    </>
                  );
                })()}
              </div>

                const showCosts = activeJob.showCosts;
                return (
                  <div key={t.id} className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm">

                      <span className="font-black text-slate-400 dark:text-slate-500 text-[10px] tracking-widest uppercase">Entry #{i+1}</span>
                      <div className="flex gap-2">
                        <button onClick={() => { setEditingTaskId(t.id); setTaskData({rate:'',materialsCost:'',images:[],...t}); setIsTaskFormOpen(true); }} className="p-1 text-slate-400 hover:text-blue-500"><Pencil size={16}/></button>

                      </div>

                      </div>
                      <p className="text-slate-500 dark:text-slate-400 text-sm leading-relaxed mb-3 whitespace-pre-wrap">{t.desc}</p>

                          {mats>0 && <span className="text-[10px] font-black bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-300 px-2 py-1 rounded-md">Mats {fmtAUD(mats)}</span>}
