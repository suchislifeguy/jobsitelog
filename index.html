<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>JobSite Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f8fafc; -webkit-tap-highlight-color: transparent; }
      
      @media print {
        @page { margin: 10mm; size: A4; }
        body { background-color: white !important; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        
        .report-card { 
          break-inside: avoid; 
          border: 1px solid #e2e8f0; 
          margin-bottom: 15px; 
          border-radius: 12px; 
          overflow: hidden;
          page-break-inside: avoid;
        }
        
        /* Fixes photo cropping in PDF */
        .print-image {
          width: 100%;
          height: 280px;
          object-fit: contain;
          background: #f8fafc;
          border-radius: 8px;
        }
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .custom-shadow { box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.06); }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'react';
      import ReactDOM from 'react-dom/client';
      import { get, set } from 'idb-keyval';
      import { 
        Trash2, ImageIcon, Printer, Plus, X, Hammer, 
        ChevronRight, Sparkles, Pencil, Save, HardDrive, CheckCircle2, Clock, FileText, User
      } from 'lucide-react';

      const DB_KEY = 'jobsite-master-v3';

      const TEMPLATES = {
        quote: {
          painting: { title: "Surface Painting", materials: "Premium Paint, Primer, Fillers", tools: "Brushes, Rollers, Scrapers", desc: "Full surface preparation. Scrape, sand, prime and apply two finish coats." },
          drywall: { title: "Drywall Repair", materials: "Base coat, Top coat, Joint tape", tools: "Joint knives, Sanding block", desc: "Patch hole/damage, tape joints, 3-stage plastering and sand ready for paint." },
          carpentry: { title: "General Carpentry", materials: "Treated Timber, Galvanised fixings", tools: "Mitre Saw, Drill, Level", desc: "Measure, cut and install as per site requirements. Ensure structural integrity." }
        },
        handover: {
          complete: { title: "Job Completed", materials: "Waste removed", tools: "Clean site", desc: "Works finished to specification. Site cleaned and all debris removed. Handed over to client." }
        }
      };

      const compressImage = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 1000;
              let width = img.width;
              let height = img.height;
              if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
          };
        });
      };

      const App = () => {
        const [jobs, setJobs] = useState([]);
        const [activeJobId, setActiveJobId] = useState(null);
        const [viewMode, setViewMode] = useState('dashboard');
        const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
        const [editingTaskId, setEditingTaskId] = useState(null);
        const [taskData, setTaskData] = useState({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });

        useEffect(() => { loadJobs(); }, []);

        const loadJobs = async () => {
          const data = await get(DB_KEY) || [];
          setJobs(data);
        };

        const saveToDB = (newJobs) => { setJobs(newJobs); set(DB_KEY, newJobs); };

        const activeJob = jobs.find(j => j.id === activeJobId);

        const getTotals = (tasks) => {
          let totalMins = 0;
          (tasks || []).forEach(t => {
            const val = parseFloat(t.time) || 0;
            totalMins += t.time?.toLowerCase().includes('m') ? val : val * 60;
          });
          return `${Math.floor(totalMins/60)}h ${Math.round(totalMins%60)}m`;
        };

        const createJob = (type) => {
          const addr = prompt("Job Address:");
          if(!addr) return;
          const client = prompt("Client Name:");
          const newJob = { id: Date.now(), type, address: addr, clientName: client || 'Private Client', tasks: [] };
          saveToDB([...jobs, newJob]);
        };

        const handleSaveTask = () => {
          if (!taskData.title) return alert("Title Required");
          const updatedTasks = editingTaskId 
            ? activeJob.tasks.map(t => t.id === editingTaskId ? { ...taskData, id: editingTaskId } : t)
            : [...activeJob.tasks, { ...taskData, id: Date.now() }];
          saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: updatedTasks } : j));
          closeModal();
        };

        const closeModal = () => {
          setIsTaskFormOpen(false);
          setEditingTaskId(null);
          setTaskData({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });
        };

        const handleImages = async (e) => {
          const files = Array.from(e.target.files);
          const compressed = await Promise.all(files.map(f => compressImage(f)));
          setTaskData(prev => ({ ...prev, images: [...prev.images, ...compressed] }));
        };

        return (
          <div className="min-h-screen">
            {/* Header */}
            <header className="bg-slate-900 text-white p-5 no-print flex justify-between items-center sticky top-0 z-50 shadow-xl">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setViewMode('dashboard')}>
                <div className="bg-orange-500 p-2 rounded-xl"><Hammer size={20} strokeWidth={3} /></div>
                <h1 className="font-black text-xl tracking-tighter uppercase">JobSite</h1>
              </div>
              {viewMode === 'detail' && (
                <button onClick={() => window.print()} className="bg-emerald-500 hover:bg-emerald-400 text-white px-5 py-2.5 rounded-xl text-xs font-black flex items-center gap-2 uppercase transition-all shadow-lg shadow-emerald-900/20">
                  <Printer size={16} /> Print PDF
                </button>
              )}
            </header>

            {viewMode === 'dashboard' ? (
              <main className="p-6 max-w-2xl mx-auto">
                <div className="grid grid-cols-2 gap-4 mb-10">
                  <button onClick={() => createJob('quote')} className="bg-white border-2 border-slate-200 p-6 rounded-[2rem] text-xs font-black shadow-sm flex flex-col items-center gap-3 transition-all active:scale-95 text-slate-700 uppercase">
                     <FileText size={32} className="text-orange-500" /> New Report
                  </button>
                  <button onClick={() => createJob('handover')} className="bg-white border-2 border-slate-200 p-6 rounded-[2rem] text-xs font-black shadow-sm flex flex-col items-center gap-3 transition-all active:scale-95 text-slate-700 uppercase">
                     <CheckCircle2 size={32} className="text-emerald-500" /> Handover
                  </button>
                </div>

                <div className="grid gap-4">
                  {jobs.sort((a,b) => b.id - a.id).map(j => (
                    <div key={j.id} onClick={() => { setActiveJobId(j.id); setViewMode('detail'); }} className="bg-white p-6 rounded-[2rem] border-2 border-transparent hover:border-slate-200 transition-all cursor-pointer flex justify-between items-center custom-shadow">
                      <div className="flex-1 min-w-0">
                        <span className={`text-[9px] font-black px-2 py-0.5 rounded uppercase ${j.type === 'handover' ? 'bg-emerald-100 text-emerald-600' : 'bg-orange-100 text-orange-600'}`}>
                          {j.type === 'handover' ? 'Handover' : 'Site Report'}
                        </span>
                        <p className="font-black text-slate-900 text-lg truncate mt-1">{j.address}</p>
                        <p className="text-slate-400 text-[10px] font-bold uppercase tracking-widest">{j.clientName}</p>
                      </div>
                      <ChevronRight size={20} className="text-slate-300" />
                    </div>
                  ))}
                </div>
              </main>
            ) : (
              <main className="p-4 max-w-3xl mx-auto no-print mb-20">
                <div className="flex justify-between items-center mb-6">
                  <button onClick={() => setViewMode('dashboard')} className="bg-slate-200 text-slate-600 px-4 py-2 rounded-full font-black text-[10px] uppercase tracking-widest">
                    &larr; Back
                  </button>
                  <button onClick={() => { if(confirm("Delete project?")) { saveToDB(jobs.filter(x => x.id !== activeJobId)); setViewMode('dashboard'); }}} className="text-red-400 p-2"><Trash2 size={20}/></button>
                </div>
                
                <div className={`p-8 rounded-[2.5rem] shadow-xl mb-8 text-white ${activeJob?.type === 'handover' ? 'bg-emerald-600' : 'bg-slate-900'}`}>
                    <h2 className="text-3xl font-black mb-2">{activeJob?.address}</h2>
                    <div className="flex items-center gap-4 opacity-80 font-bold uppercase text-[10px] tracking-widest">
                      <span>{activeJob?.clientName}</span>
                      <span>•</span>
                      <span>{getTotals(activeJob?.tasks)}</span>
                    </div>
                </div>

                <div className="space-y-6">
                  {activeJob?.tasks.map((t, i) => (
                    <div key={t.id} className="bg-white rounded-[2rem] border border-slate-100 overflow-hidden custom-shadow">
                      <div className="p-6">
                        <div className="flex justify-between items-start mb-2">
                           <h3 className="font-black text-xl text-slate-900">{t.title}</h3>
                           <span className="bg-slate-100 px-2 py-1 rounded text-[10px] font-black">{t.time}</span>
                        </div>
                        <p className="text-slate-600 text-sm mb-6">{t.desc}</p>
                        {t.images?.length > 0 && (
                          <div className="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                            {t.images.map((img, idx) => (
                              <img key={idx} src={img} className="h-24 w-24 object-cover rounded-xl border flex-shrink-0" />
                            ))}
                          </div>
                        )}
                        <div className="mt-4 pt-4 border-t flex gap-4">
                           <button onClick={() => { setEditingTaskId(t.id); setTaskData(t); setIsTaskFormOpen(true); }} className="text-blue-500 text-xs font-black uppercase tracking-widest flex items-center gap-1"><Pencil size={14}/> Edit</button>
                           <button onClick={() => { if(confirm("Delete log?")) saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: j.tasks.filter(tk => tk.id !== t.id) } : j)); }} className="text-red-500 text-xs font-black uppercase tracking-widest flex items-center gap-1"><Trash2 size={14}/> Delete</button>
                        </div>
                      </div>
                    </div>
                  ))}
                </div>

                <button onClick={() => setIsTaskFormOpen(true)} className={`fixed bottom-8 right-8 text-white w-16 h-16 rounded-full shadow-2xl flex items-center justify-center z-40 ${activeJob?.type === 'handover' ? 'bg-emerald-500' : 'bg-orange-500'}`}>
                  <Plus size={32} strokeWidth={3} />
                </button>
              </main>
            )}

            {isTaskFormOpen && (
              <div className="fixed inset-0 z-[100] bg-slate-900/90 backdrop-blur-sm p-4 overflow-y-auto">
                <div className="bg-white rounded-[2.5rem] max-w-md mx-auto p-8 shadow-2xl mt-4">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-2xl font-black">Entry Details</h2>
                    <button onClick={closeModal} className="text-slate-400"><X size={24}/></button>
                  </div>

                  <div className="mb-6 flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                    {Object.keys(TEMPLATES[activeJob.type] || {}).map(key => (
                      <button key={key} onClick={() => setTaskData({...taskData, ...TEMPLATES[activeJob.type][key]})} className="whitespace-nowrap bg-slate-100 px-4 py-2 rounded-xl text-[10px] font-black uppercase">
                        {key}
                      </button>
                    ))}
                  </div>

                  <div className="space-y-4">
                    <input placeholder="Task Title" className="w-full p-4 bg-slate-50 rounded-xl outline-none font-bold" value={taskData.title} onChange={e => setTaskData({...taskData, title: e.target.value})} />
                    <div className="flex gap-4">
                      <input placeholder="Time (e.g. 2h)" className="w-32 p-4 bg-slate-50 rounded-xl outline-none font-bold" value={taskData.time} onChange={e => setTaskData({...taskData, time: e.target.value})} />
                      <label className="flex-1 bg-slate-100 p-4 rounded-xl cursor-pointer flex items-center justify-center font-black text-[10px] uppercase text-slate-500">
                        <ImageIcon size={18} className="mr-2" /> Add Photos
                        <input type="file" multiple accept="image/*" className="hidden" onChange={handleImages} />
                      </label>
                    </div>

                    {taskData.images.length > 0 && (
                      <div className="grid grid-cols-4 gap-2">
                        {taskData.images.map((img, i) => (
                          <div key={i} className="relative aspect-square">
                            <img src={img} className="w-full h-full object-cover rounded-lg" />
                            <button onClick={() => setTaskData(p => ({...p, images: p.images.filter((_, idx) => idx !== i)}))} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full"><X size={12}/></button>
                          </div>
                        ))}
                      </div>
                    )}
                    
                    <input placeholder="Materials" className="w-full p-4 bg-slate-50 rounded-xl outline-none text-sm font-medium" value={taskData.materials} onChange={e => setTaskData({...taskData, materials: e.target.value})} />
                    <input placeholder="Tools / Notes" className="w-full p-4 bg-slate-50 rounded-xl outline-none text-sm font-medium" value={taskData.tools} onChange={e => setTaskData({...taskData, tools: e.target.value})} />
                    <textarea placeholder="Work Details..." className="w-full p-4 bg-slate-50 rounded-xl outline-none text-sm font-medium h-24 resize-none" value={taskData.desc} onChange={e => setTaskData({...taskData, desc: e.target.value})} />
                    
                    <button onClick={handleSaveTask} className={`w-full text-white p-5 rounded-2xl font-black shadow-xl uppercase tracking-widest ${activeJob?.type === 'handover' ? 'bg-emerald-600' : 'bg-slate-900'}`}>
                      Save Entry
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* PRINT SECTION */}
            {activeJob && (
              <div className="print-only hidden font-sans">
                <div className={`border-b-[12px] pb-6 mb-8 flex justify-between items-end ${activeJob.type === 'handover' ? 'border-emerald-500' : 'border-orange-500'}`}>
                  <div>
                    <h1 className="text-4xl font-black uppercase tracking-tighter text-slate-900">
                      {activeJob.type === 'handover' ? 'Handover Record' : 'Site Field Report'}
                    </h1>
                    <p className="text-slate-500 font-bold uppercase text-xs mt-1">{new Date().toLocaleDateString('en-AU', { dateStyle: 'full' })}</p>
                  </div>
                  <div className="text-right">
                    <p className="text-xl font-black text-slate-900 uppercase">{activeJob.address}</p>
                    <p className="text-slate-500 font-black text-xs uppercase">Client: {activeJob.clientName}</p>
                  </div>
                </div>

                {activeJob.tasks.map((t, idx) => (
                  <div key={t.id} className="report-card">
                    <div className={`px-6 py-3 border-b flex justify-between items-center ${activeJob.type === 'handover' ? 'bg-emerald-50' : 'bg-orange-50'}`}>
                      <h3 className={`font-black uppercase text-sm ${activeJob.type === 'handover' ? 'text-emerald-700' : 'text-orange-700'}`}>{idx + 1}. {t.title}</h3>
                      <span className="text-xs font-black text-slate-500 uppercase">{t.time}</span>
                    </div>
                    
                    <div className="p-6">
                      <p className="text-sm text-slate-700 leading-relaxed mb-6 font-medium border-l-4 border-slate-100 pl-4 italic">"{t.desc}"</p>
                      
                      <div className="grid grid-cols-2 gap-4 mb-6">
                        <div className="p-3 bg-slate-50 rounded-lg">
                          <span className="text-[9px] font-black uppercase text-slate-400 block mb-1">Materials</span>
                          <span className="text-xs font-bold text-slate-700 uppercase">{t.materials || 'N/A'}</span>
                        </div>
                        <div className="p-3 bg-slate-50 rounded-lg">
                          <span className="text-[9px] font-black uppercase text-slate-400 block mb-1">Notes/Tools</span>
                          <span className="text-xs font-bold text-slate-700 uppercase">{t.tools || 'Standard'}</span>
                        </div>
                      </div>

                      {t.images?.length > 0 && (
                        <div className={`grid ${t.images.length === 1 ? 'grid-cols-1' : 'grid-cols-2'} gap-4`}>
                          {t.images.map((img, i) => (
                            <img key={i} src={img} className="print-image border border-slate-200" />
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                ))}
                
                <div className="text-center mt-8">
                  <p className="text-[10px] font-black text-slate-300 uppercase tracking-[0.5em]">End of Report</p>
                </div>
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
