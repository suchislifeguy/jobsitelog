<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>JobSite Log | Professional</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; }
      
      @media print {
        @page { margin: 10mm; size: A4; }
        body { background-color: white !important; -webkit-print-color-adjust: exact !important; }
        .no-print { display: none !important; }
        .print-only { display: block !important; }
        .print-card { break-inside: avoid; border: 1px solid #e2e8f0; margin-bottom: 20px; border-radius: 8px; }
      }

      .img-preview-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 8px;
        margin-top: 10px;
      }
    </style>

    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'react';
      import ReactDOM from 'react-dom/client';
      import { get, set } from 'idb-keyval';
      import { 
        Clock, Trash2, Package, Wrench, ImageIcon, Printer, 
        Plus, X, Hammer, ChevronRight, Sparkles, Layout
      } from 'lucide-react';

      const DB_KEY = 'jobsite-log-db-v2';

      const TASK_TEMPLATES = {
        marking: { title: "Mark with Highlight Paint", materials: "Highlight Paint, Chalk", tools: "Marking Wand", desc: "Site marking per plans." },
        washing: { title: "Pressure Washing", materials: "Degreaser", tools: "Pressure Washer, Turbo Nozzle", desc: "Surface preparation and cleaning." },
        fencing: { title: "Fence Installation", materials: "Panels, Posts, Concrete", tools: "Post Hole Digger, Level", desc: "Installation of boundary fencing." }
      };

      const App = () => {
        const [jobs, setJobs] = useState([]);
        const [activeJobId, setActiveJobId] = useState(null);
        const [viewMode, setViewMode] = useState('dashboard');
        const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
        const [taskData, setTaskData] = useState({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });

        useEffect(() => { get(DB_KEY).then(data => setJobs(data || [])); }, []);

        const saveToDB = (newJobs) => { setJobs(newJobs); set(DB_KEY, newJobs); };

        const activeJob = jobs.find(j => j.id === activeJobId);

        const calculateTotals = (tasks) => {
          let totalMins = 0;
          let allMats = new Set();
          let allTools = new Set();
          tasks.forEach(t => {
            const m = t.time?.match(/(\d+)/);
            if (m) totalMins += parseInt(m[1]) * (t.time.includes('h') ? 60 : 1);
            t.materials.split(',').forEach(i => i.trim() && allMats.add(i.trim()));
            t.tools.split(',').forEach(i => i.trim() && allTools.add(i.trim()));
          });
          return { 
            timeStr: `${Math.floor(totalMins/60)}h ${totalMins%60}m`,
            materials: Array.from(allMats).join(', '),
            tools: Array.from(allTools).join(', ')
          };
        };

        const handleAddTask = () => {
          const newTask = { ...taskData, id: Date.now() };
          const updated = jobs.map(j => j.id === activeJobId ? { ...j, tasks: [...j.tasks, newTask] } : j);
          saveToDB(updated);
          setIsTaskFormOpen(false);
          setTaskData({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });
        };

        const removeImage = (idx) => {
          setTaskData(prev => ({ ...prev, images: prev.images.filter((_, i) => i !== idx) }));
        };

        return (
          <div className="min-h-screen">
            <header className="bg-slate-900 text-white p-4 no-print flex justify-between items-center shadow-md sticky top-0 z-50">
              <div className="flex items-center gap-2" onClick={() => setViewMode('dashboard')}>
                <Hammer className="text-orange-500" />
                <h1 className="font-black text-lg">JOBSITE LOG</h1>
              </div>
              {viewMode === 'detail' && (
                <button onClick={() => window.print()} className="bg-orange-500 px-4 py-2 rounded-lg text-sm font-bold flex items-center gap-2">
                  <Printer size={16} /> PRINT PDF
                </button>
              )}
            </header>

            {viewMode === 'dashboard' ? (
              <div className="p-4 max-w-2xl mx-auto">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold">Active Jobs</h2>
                  <button onClick={() => {
                    const addr = prompt("Address:");
                    if(addr) saveToDB([...jobs, { id: Date.now(), address: addr, clientName: prompt("Client:"), tasks: [] }]);
                  }} className="bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-bold">+ New Job</button>
                </div>
                {jobs.map(j => (
                  <div key={j.id} onClick={() => { setActiveJobId(j.id); setViewMode('detail'); }} className="bg-white p-4 rounded-xl border mb-3 flex justify-between items-center">
                    <div><p className="font-bold">{j.address}</p><p className="text-xs text-slate-500">{j.tasks.length} tasks</p></div>
                    <ChevronRight size={18} className="text-slate-300" />
                  </div>
                ))}
              </div>
            ) : (
              <div className="p-4 max-w-2xl mx-auto no-print">
                <div className="bg-white p-6 rounded-2xl border mb-6">
                  <h2 className="text-2xl font-black">{activeJob?.address}</h2>
                  <p className="text-slate-500 mb-4">{activeJob?.clientName}</p>
                </div>

                <div className="space-y-4 mb-20">
                  {activeJob?.tasks.map((t, i) => (
                    <div key={t.id} className="bg-white rounded-xl border overflow-hidden">
                      <div className="bg-slate-50 p-3 border-b font-bold flex justify-between">
                        <span>Task {i+1}: {t.title}</span>
                        <button onClick={() => {
                          const updated = jobs.map(j => j.id === activeJobId ? { ...j, tasks: j.tasks.filter(tk => tk.id !== t.id) } : j);
                          saveToDB(updated);
                        }} className="text-red-400"><Trash2 size={16}/></button>
                      </div>
                      <div className="p-4 text-sm text-slate-600">{t.desc}</div>
                    </div>
                  ))}
                </div>

                <button onClick={() => setIsTaskFormOpen(true)} className="fixed bottom-6 right-6 bg-orange-500 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center"><Plus/></button>
              </div>
            )}

            {/* MODAL */}
            {isTaskFormOpen && (
              <div className="fixed inset-0 z-[100] bg-slate-900/90 p-4 overflow-y-auto">
                <div className="bg-white rounded-2xl max-w-md mx-auto p-6">
                  <div className="flex justify-between mb-4">
                    <h2 className="font-bold">Add Task</h2>
                    <X onClick={() => setIsTaskFormOpen(false)} />
                  </div>
                  
                  <div className="flex gap-2 mb-6 overflow-x-auto pb-2">
                    {Object.entries(TASK_TEMPLATES).map(([key, val]) => (
                      <button key={key} onClick={() => setTaskData({...taskData, ...val})} className="whitespace-nowrap bg-slate-100 px-3 py-2 rounded-lg text-xs font-bold border hover:border-orange-500 flex items-center gap-1">
                        <Sparkles size={12}/> {key.toUpperCase()}
                      </button>
                    ))}
                  </div>

                  <div className="space-y-3">
                    <input placeholder="Task Title" className="w-full p-3 bg-slate-50 rounded-lg border" value={taskData.title} onChange={e => setTaskData({...taskData, title: e.target.value})} />
                    <input placeholder="Time (e.g. 2.5h)" className="w-full p-3 bg-slate-50 rounded-lg border font-mono" value={taskData.time} onChange={e => setTaskData({...taskData, time: e.target.value})} />
                    
                    <div className="p-3 bg-slate-50 rounded-lg border">
                      <label className="text-xs font-bold block mb-2">Photos (Visible Below)</label>
                      <input type="file" multiple accept="image/*" onChange={e => {
                        const files = Array.from(e.target.files);
                        files.forEach(file => {
                          const reader = new FileReader();
                          reader.onload = (re) => setTaskData(prev => ({...prev, images: [...prev.images, re.target.result]}));
                          reader.readAsDataURL(file);
                        });
                      }} />
                      <div className="img-preview-container">
                        {taskData.images.map((img, i) => (
                          <div key={i} className="relative aspect-square">
                            <img src={img} className="w-full h-full object-cover rounded-md border" />
                            <button onClick={() => removeImage(i)} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-0.5"><X size={12}/></button>
                          </div>
                        ))}
                      </div>
                    </div>

                    <input placeholder="Materials" className="w-full p-3 bg-slate-50 rounded-lg border" value={taskData.materials} onChange={e => setTaskData({...taskData, materials: e.target.value})} />
                    <input placeholder="Tools" className="w-full p-3 bg-slate-50 rounded-lg border" value={taskData.tools} onChange={e => setTaskData({...taskData, tools: e.target.value})} />
                    <textarea placeholder="Description" className="w-full p-3 bg-slate-50 rounded-lg border h-24" value={taskData.desc} onChange={e => setTaskData({...taskData, desc: e.target.value})} />
                    
                    <button onClick={handleAddTask} className="w-full bg-orange-500 text-white p-4 rounded-xl font-bold">Save Task</button>
                  </div>
                </div>
              </div>
            )}

            {/* PRINT PDF LAYOUT */}
            {activeJob && (
              <div className="print-only hidden p-8">
                <div className="border-b-4 border-slate-900 pb-4 mb-6 flex justify-between items-end">
                  <div>
                    <h1 className="text-4xl font-black tracking-tighter">JOBSITE LOG</h1>
                    <p className="text-slate-500 font-bold">{new Date().toLocaleDateString()}</p>
                  </div>
                  <div className="text-right">
                    <p className="text-xl font-bold uppercase">{activeJob.address}</p>
                    <p className="text-slate-600">{activeJob.clientName}</p>
                  </div>
                </div>

                {/* PROJECT TOTALS SUMMARY */}
                <div className="bg-slate-900 text-white p-6 rounded-xl mb-8 grid grid-cols-3 gap-6">
                  <div>
                    <h4 className="text-[10px] uppercase text-slate-400 font-bold mb-1">Total Labor</h4>
                    <p className="text-xl font-black text-orange-400">{calculateTotals(activeJob.tasks).timeStr}</p>
                  </div>
                  <div className="col-span-2">
                    <h4 className="text-[10px] uppercase text-slate-400 font-bold mb-1">Materials & Tools Summary</h4>
                    <p className="text-xs leading-relaxed opacity-90">
                      <strong>Mats:</strong> {calculateTotals(activeJob.tasks).materials || 'N/A'}<br/>
                      <strong>Tools:</strong> {calculateTotals(activeJob.tasks).tools || 'N/A'}
                    </p>
                  </div>
                </div>

                {activeJob.tasks.map((t, idx) => (
                  <div key={t.id} className="print-card">
                    <div className="bg-slate-100 p-3 font-bold border-b text-sm">
                      {idx + 1}. {t.title.toUpperCase()}
                    </div>
                    <div className="p-4">
                      {t.desc && <p className="text-sm mb-4 leading-relaxed">{t.desc}</p>}
                      
                      <div className="grid grid-cols-3 gap-4 mb-4">
                        <div className="p-3 bg-slate-50 rounded border">
                          <label className="text-[9px] font-black uppercase text-slate-400 block mb-1">Labor Time</label>
                          <span className="font-bold text-slate-800">{t.time || 'N/A'}</span>
                        </div>
                        <div className="p-3 bg-slate-50 rounded border">
                          <label className="text-[9px] font-black uppercase text-slate-400 block mb-1">Materials Used</label>
                          <span className="text-[11px] text-slate-700">{t.materials || 'None'}</span>
                        </div>
                        <div className="p-3 bg-slate-50 rounded border">
                          <label className="text-[9px] font-black uppercase text-slate-400 block mb-1">Tools Required</label>
                          <span className="text-[11px] text-slate-700">{t.tools || 'None'}</span>
                        </div>
                      </div>

                      <div className="grid grid-cols-2 gap-2">
                        {t.images.map((img, i) => (
                          <img key={i} src={img} className="rounded-lg border h-60 w-full object-cover" />
                        ))}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
