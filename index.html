<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>JobSite Master | Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
      @media print {
        @page { margin: 8mm; size: A4; }
        body { background-color: white !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .no-print, button, .action-btns, .fixed { display: none !important; }
        .print-only { display: block !important; }
        .print-card { break-inside: avoid; border: 2px solid #0f172a !important; margin-bottom: 15px; border-radius: 10px; overflow: hidden; page-break-inside: avoid; }
        .print-img-container { break-inside: avoid; page-break-inside: avoid; }
        img { max-width: 100% !important; height: auto !important; }
      }
      .img-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; margin-top: 10px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel" data-type="module">
  import React, { useState, useEffect, useRef } from 'react';
  import ReactDOM from 'react-dom/client';
  import { get, set } from 'idb-keyval';
  import { 
    Trash2, ImageIcon, Printer, Plus, X, Hammer, 
    ChevronRight, Sparkles, Pencil, Save, HardDrive, CheckCircle2, Clock,
    Download, Upload
  } from 'lucide-react';

  const DB_KEY = 'jobsite-master-v3';

  // Templates grouped by Job Type
  const TEMPLATES = {
    quote: {
      painting_interior: { title: "Interior Painting", materials: "Paint, Primer, Drop Sheets, Painter's Tape, Filler", tools: "Brushes, Rollers, Extension Poles, Sandpaper", desc: "Surface prep, fill holes, prime and 2 finish coats" },
      painting_exterior: { title: "Exterior Painting", materials: "Exterior Paint, Primer, Weatherproof Filler, Drop Sheets", tools: "Pressure Washer, Scrapers, Brushes, Rollers, Ladders", desc: "Pressure wash, scrape, repair, prime and 2 coats" },
      drywall_repair: { title: "Drywall/Gyprock Repair", materials: "Plasterboard, Joint Compound, Mesh Tape, Sandpaper, Paint", tools: "Utility Knife, Trowels, Sanding Block, Drywall Saw", desc: "Cut damaged section, install new board, tape, compound, sand and paint" },
      deck_build: { title: "Deck Construction", materials: "Treated Pine/Hardwood Decking, Joists, Posts, Concrete, Screws", tools: "Circular Saw, Drill, Level, Post Hole Digger, String Line", desc: "Site prep, post installation, frame build, decking installation" },
      laminate_flooring: { title: "Laminate/Vinyl Flooring", materials: "Laminate/Vinyl Planks, Underlay, Skirting Boards, Adhesive", tools: "Jigsaw, Spacers, Tapping Block, Pull Bar, Measuring Tape", desc: "Remove old flooring, level subfloor, install underlay and planks" },
      fencing: { title: "Fence Installation", materials: "Timber Palings/Colorbond, Steel/Timber Posts, Concrete, Rails, Screws", tools: "Post Hole Digger, Level, String Line, Power Drill, Saw", desc: "Mark line, dig holes, set posts in concrete, install rails and palings" },
      pressure_washing: { title: "Pressure Washing", materials: "Industrial Degreaser, Surface Cleaner Solution", tools: "Petrol Pressure Washer, Turbo Nozzle, Surface Cleaner", desc: "Deep clean driveways, paths, decks, exteriors, remove mould" },
      general_repairs: { title: "General Repairs", materials: "Various (depends on scope)", tools: "Basic Hand Tools, Power Tools as Required", desc: "Multiple small tasks - adjustments, hole filling, minor fixes" }
    },
    handover: {
      painting_interior: { title: "Interior Painting", materials: "N/A", tools: "No delays", desc: "All surfaces painted to specification. Touch-up paint provided to client." },
      deck_build: { title: "Deck Construction", materials: "N/A", tools: "No delays", desc: "Deck construction complete. All safety checks passed. Client briefed on maintenance." },
      pressure_washing: { title: "Pressure Washing", materials: "N/A", tools: "No delays", desc: "All surfaces cleaned. Water run-off managed. Area left clean and dry." },
      general_repairs: { title: "General Repairs", materials: "N/A", tools: "No delays", desc: "All repair items completed as per quote. Work area cleaned." },
      cleanup: { title: "Site Cleanup", materials: "Cleaning supplies", tools: "Minor weather delay", desc: "Site cleaned of all debris. Surfaces wiped down. Client access restored." }
    }
  };

  // Improved Compression: Using WebP and lower max-width to dramatically reduce size
  const compressImage = (file) => {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600; // Reduced to 600 for better PDF sizing
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          // Switched to WebP format, 60% quality - significantly smaller than JPEG
          resolve(canvas.toDataURL('image/webp', 0.6));
        };
      };
    });
  };

  const App = () => {
    const [jobs, setJobs] = useState([]);
    const [activeJobId, setActiveJobId] = useState(null);
    const [viewMode, setViewMode] = useState('dashboard');
    const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
    const [editingTaskId, setEditingTaskId] = useState(null);
    const [dbSize, setDbSize] = useState('0 MB');
    const [taskData, setTaskData] = useState({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });
    const fileInputRef = useRef(null);

    useEffect(() => { loadJobs(); }, []);

    const loadJobs = async () => {
      const data = await get(DB_KEY) || [];
      setJobs(data);
      updateStorageMetric(data);
    };

    const updateStorageMetric = (data) => {
      const string = JSON.stringify(data);
      const size = (new TextEncoder().encode(string).length / 1024 / 1024).toFixed(2);
      setDbSize(`${size} MB`);
    };

    const saveToDB = (newJobs) => { setJobs(newJobs); set(DB_KEY, newJobs); updateStorageMetric(newJobs); };

    const activeJob = jobs.find(j => j.id === activeJobId);

    const getAggregatedTotals = (tasks) => {
      let totalMins = 0;
      tasks.forEach(t => {
        const timeVal = parseFloat(t.time) || 0;
        if (t.time?.toLowerCase().includes('m')) totalMins += timeVal;
        else totalMins += timeVal * 60;
      });
      const h = Math.floor(totalMins / 60);
      const m = Math.round(totalMins % 60);
      return { h, m, string: `${h}h ${m}m` };
    };

    const createNewJob = (type) => {
      const label = type === 'handover' ? 'Completed Works' : 'Field Report';
      const addr = prompt(`${label.toUpperCase()} - Job Address:`);
      if(!addr) return;
      const client = prompt("Client Name:");
      const newJob = { id: Date.now(), date: new Date().toISOString(), type, address: addr, clientName: client, tasks: [] };
      saveToDB([...jobs, newJob]);
    };

    const handleSaveTask = () => {
      if (!taskData.title) return alert("Title Required");
      const updatedTasks = editingTaskId 
        ? activeJob.tasks.map(t => t.id === editingTaskId ? { ...taskData, id: editingTaskId } : t)
        : [...activeJob.tasks, { ...taskData, id: Date.now() }];
      saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: updatedTasks } : j));
      closeTaskModal();
    };

    const closeTaskModal = () => {
      setIsTaskFormOpen(false);
      setEditingTaskId(null);
      setTaskData({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });
    };

    const handleImageUpload = async (e) => {
      const files = Array.from(e.target.files);
      const compressedStrings = await Promise.all(files.map(file => compressImage(file)));
      setTaskData(prev => ({ ...prev, images: [...prev.images, ...compressedStrings] }));
    };

    // Data Management Functions
    const exportData = () => {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(jobs));
      const downloadAnchorNode = document.createElement('a');
      downloadAnchorNode.setAttribute("href", dataStr);
      downloadAnchorNode.setAttribute("download", `jobsite_backup_${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchorNode);
      downloadAnchorNode.click();
      downloadAnchorNode.remove();
    };

    const importData = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const importedJobs = JSON.parse(e.target.result);
          if (Array.isArray(importedJobs)) {
            saveToDB(importedJobs);
            alert("Backup restored successfully!");
          } else {
            alert("Invalid backup file format.");
          }
        } catch (err) {
          alert("Error reading file.");
        }
      };
      reader.readAsText(file);
    };

    return (
      <div className="min-h-screen">
        <header className="bg-slate-900 text-white p-4 no-print flex justify-between items-center shadow-lg sticky top-0 z-50">
          <div className="flex items-center gap-2 cursor-pointer" onClick={() => setViewMode('dashboard')}>
            <div className="bg-orange-500 p-2 rounded-xl text-white shadow-inner"><Hammer size={22} /></div>
            <h1 className="font-black text-xl tracking-tight uppercase">Jobsite</h1>
          </div>
          <div className="flex items-center gap-4">
            {viewMode === 'dashboard' && (
              <div className="flex items-center gap-3">
                <button onClick={() => fileInputRef.current.click()} className="text-slate-400 hover:text-white transition-colors" title="Import Backup"><Upload size={18} /></button>
                <input type="file" ref={fileInputRef} onChange={importData} accept=".json" className="hidden" />
                <button onClick={exportData} className="text-slate-400 hover:text-white transition-colors" title="Export Backup"><Download size={18} /></button>
              </div>
            )}
            <div className="flex items-center gap-1 text-slate-500 text-[10px] font-black uppercase tracking-widest bg-slate-800 px-2 py-1 rounded-lg border border-slate-700">
              <HardDrive size={12} className={parseFloat(dbSize) > 4 ? "text-red-400" : "text-emerald-400"}/> {dbSize}
            </div>
            {viewMode === 'detail' && (
              <button onClick={() => window.print()} className="bg-white text-slate-900 px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 uppercase shadow-sm active:scale-95">
                <Printer size={16} /> Print
              </button>
            )}
          </div>
        </header>

        {viewMode === 'dashboard' ? (
          <main className="p-4 max-w-2xl mx-auto">
            <div className="mb-8">
              <h2 className="text-2xl font-black text-slate-800 tracking-tight mb-4 uppercase">Projects</h2>
              <div className="grid grid-cols-2 gap-3">
                <button onClick={() => createNewJob('quote')} className="bg-white border-2 border-slate-200 text-slate-900 p-4 rounded-3xl text-xs font-black shadow-sm flex flex-col items-center gap-2 active:scale-95 transition-all uppercase">
                   <Plus size={24} className="text-orange-500" /> New Quote
                </button>
                <button onClick={() => createNewJob('handover')} className="bg-slate-900 text-white p-4 rounded-3xl text-xs font-black shadow-lg flex flex-col items-center gap-2 active:scale-95 transition-all uppercase">
                   <CheckCircle2 size={24} className="text-emerald-400" /> Completed Job
                </button>
              </div>
            </div>

            <div className="grid gap-4">
              {jobs.sort((a,b) => b.id - a.id).map(j => (
                <div key={j.id} onClick={() => { setActiveJobId(j.id); setViewMode('detail'); }} className={`bg-white p-6 rounded-[2rem] border-2 transition-all cursor-pointer flex justify-between items-center shadow-sm ${j.type === 'handover' ? 'border-emerald-100 hover:border-emerald-500' : 'border-slate-100 hover:border-orange-500'}`}>
                  <div className="flex-1">
                    <span className={`text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-widest ${j.type === 'handover' ? 'bg-emerald-100 text-emerald-600' : 'bg-orange-100 text-orange-600'}`}>
                      {j.type === 'handover' ? 'Completed Works' : 'Field Report'}
                    </span>
                    <p className="font-black text-slate-900 text-lg mt-1 truncate max-w-[200px]">{j.address}</p>
                    <p className="text-slate-400 text-xs font-medium mt-1">{j.date ? new Date(j.date).toLocaleDateString() : 'No date'}</p>
                  </div>
                  <div className="text-right flex items-center gap-4">
                    <div className="flex flex-col items-end">
                        <span className="text-[10px] font-black text-slate-400 uppercase">Total Hours</span>
                        <span className="font-black text-slate-900">{getAggregatedTotals(j.tasks).string}</span>
                    </div>
                    <ChevronRight size={20} className="text-slate-300" />
                  </div>
                </div>
              ))}
              {jobs.length === 0 && <div className="text-center py-10 text-slate-400 text-sm font-bold uppercase tracking-widest">No Projects Found</div>}
            </div>
          </main>
        ) : (
          <main className="p-4 max-w-2xl mx-auto no-print">
            <div className="flex justify-between items-center mb-6">
              <button onClick={() => setViewMode('dashboard')} className="text-slate-400 font-bold text-xs flex items-center gap-1 uppercase tracking-widest">
                <ChevronRight size={14} className="rotate-180" /> Dashboard
              </button>
              <button onClick={() => { if(confirm("Permanently delete project?")) { saveToDB(jobs.filter(x => x.id !== activeJobId)); setViewMode('dashboard'); }}} className="text-red-400 hover:text-red-600 flex items-center gap-1 text-[10px] font-black uppercase">
                <Trash2 size={14}/> Delete
              </button>
            </div>
            
            <div className={`p-8 rounded-[2.5rem] border shadow-sm mb-8 relative overflow-hidden bg-white ${activeJob?.type === 'handover' ? 'border-emerald-200' : 'border-slate-200'}`}>
              <div className="flex justify-between items-start relative z-10">
                <div>
                  <h2 className="text-3xl font-black text-slate-900 leading-tight">{activeJob?.address}</h2>
                  <p className="text-slate-500 font-bold uppercase tracking-widest text-sm">{activeJob?.clientName}</p>
                </div>
                <div className="bg-slate-900 text-white p-4 rounded-2xl flex flex-col items-center min-w-[100px] shadow-lg border-b-4 border-orange-500">
                    <Clock size={16} className="mb-1 text-orange-500"/>
                    <span className="text-[10px] font-black uppercase text-slate-400">Total Hours</span>
                    <span className="text-xl font-black">{getAggregatedTotals(activeJob?.tasks || []).string}</span>
                </div>
              </div>
            </div>

            <div className="space-y-6 mb-32">
              {activeJob?.tasks.map((t, i) => (
                <div key={t.id} className="bg-white rounded-3xl border border-slate-200 overflow-hidden shadow-sm">
                  <div className="bg-slate-50 p-4 border-b flex justify-between items-center px-6">
                    <span className="font-black text-slate-400 text-[10px] tracking-widest uppercase">Entry #{i+1}</span>
                    <div className="flex gap-2">
                       <button onClick={() => { setEditingTaskId(t.id); setTaskData(t); setIsTaskFormOpen(true); }} className="p-2 text-slate-400 hover:text-blue-500"><Pencil size={18}/></button>
                       <button onClick={() => { if(confirm("Delete log?")) saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: j.tasks.filter(tk => tk.id !== t.id) } : j)); }} className="p-2 text-slate-400 hover:text-red-500"><Trash2 size={18}/></button>
                    </div>
                  </div>
                  <div className="p-6">
                    <div className="flex justify-between items-start mb-2">
                       <h3 className="font-black text-xl text-slate-900">{t.title}</h3>
                       <span className="bg-orange-100 text-orange-700 px-3 py-1 rounded-full text-xs font-black">{t.time}</span>
                    </div>
                    <p className="text-slate-500 text-sm leading-relaxed mb-4">{t.desc}</p>
                    {t.images?.length > 0 && (
                      <div className="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                        {t.images.map((img, idx) => (
                          <div key={idx} className="h-24 w-32 flex-shrink-0">
                             <img src={img} className="w-full h-full object-cover rounded-xl border shadow-sm aspect-[4/3]" />
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              ))}
              {activeJob?.tasks.length === 0 && <div className="text-center py-20 text-slate-300 font-black uppercase tracking-widest">No Log Entries Yet</div>}
            </div>

            <button onClick={() => setIsTaskFormOpen(true)} className={`fixed bottom-8 right-8 text-white w-20 h-20 rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-all z-40 border-4 border-white ${activeJob?.type === 'handover' ? 'bg-emerald-600' : 'bg-slate-900'}`}>
              <Plus size={40} />
            </button>
          </main>
        )}

        {isTaskFormOpen && (
          <div className="fixed inset-0 z-[100] bg-slate-900/90 backdrop-blur-md p-4 overflow-y-auto">
            <div className="bg-white rounded-[3rem] max-w-md mx-auto p-8 shadow-2xl mt-4">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-2xl font-black text-slate-900">{editingTaskId ? 'Edit' : 'New'} {activeJob?.type === 'handover' ? 'Works Record' : 'Report Entry'}</h2>
                <button onClick={closeTaskModal} className="bg-slate-100 p-2 rounded-full text-slate-400"><X size={20}/></button>
              </div>

              <div className="mb-6">
                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Quick Templates</label>
                <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                  {Object.keys(TEMPLATES[activeJob.type] || {}).map(key => (
                    <button key={key} onClick={() => setTaskData({...taskData, ...TEMPLATES[activeJob.type][key]})} className="whitespace-nowrap bg-white border-2 border-slate-100 px-4 py-2 rounded-2xl text-[12px] font-black text-slate-700 uppercase tracking-widest hover:border-orange-500 transition-all">
                      <Sparkles size={14} className="inline mr-1 text-orange-500"/> {key.replace('_', ' ')}
                    </button>
                  ))}
                </div>
              </div>

              <div className="space-y-4">
                <input placeholder="Task / Item Title" className="w-full p-4 bg-slate-50 rounded-2xl outline-none font-bold" value={taskData.title} onChange={e => setTaskData({...taskData, title: e.target.value})} />
                
                <div className="flex gap-4">
                  <input placeholder="Hours (e.g. 2h)" className="w-32 p-4 bg-slate-50 rounded-2xl outline-none font-black text-center" value={taskData.time} onChange={e => setTaskData({...taskData, time: e.target.value})} />
                  <label className="flex-1 bg-slate-100 p-4 rounded-2xl cursor-pointer flex items-center justify-center hover:bg-slate-200 transition-colors">
                    <ImageIcon className="text-slate-600 mr-2" />
                    <span className="text-xs font-black text-slate-500 uppercase">Photos</span>
                    <input type="file" multiple accept="image/*" capture="environment" className="hidden" onChange={handleImageUpload} />
                  </label>
                </div>

                {taskData.images.length > 0 && (
                  <div className="img-preview-grid">
                    {taskData.images.map((img, i) => (
                      <div key={i} className="relative w-full aspect-[4/3]">
                        <img src={img} className="w-full h-full object-cover rounded-xl border shadow-sm" />
                        <button onClick={() => setTaskData(p => ({...p, images: p.images.filter((_, idx) => idx !== i)}))} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md hover:scale-110 transition-transform"><X size={12}/></button>
                      </div>
                    ))}
                  </div>
                )}
                
                <input placeholder="Materials Used" className="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm font-medium" value={taskData.materials} onChange={e => setTaskData({...taskData, materials: e.target.value})} />
                
                <input 
                  placeholder={activeJob?.type === 'handover' ? "Notes / Delays" : "Tools Used"} 
                  className="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm font-medium border-l-4 border-slate-300" 
                  value={taskData.tools} 
                  onChange={e => setTaskData({...taskData, tools: e.target.value})} 
                />

                <textarea 
                  placeholder="Full details..." 
                  className="w-full p-4 bg-slate-50 rounded-2xl outline-none text-sm font-medium h-28 resize-none" 
                  value={taskData.desc} 
                  onChange={e => setTaskData({...taskData, desc: e.target.value})} 
                />
                
                <button onClick={handleSaveTask} className={`w-full text-white p-5 rounded-[2rem] font-black text-lg shadow-xl flex items-center justify-center gap-2 transition-all hover:scale-[1.02] ${activeJob?.type === 'handover' ? 'bg-emerald-600' : 'bg-slate-900'}`}>
                  <Save size={20} /> SAVE ENTRY
                </button>
              </div>
            </div>
          </div>
        )}

        {/* --- REFINED PRINT SECTION --- */}
        {activeJob && (
          <div className="print-only hidden p-4">
            <div className={`border-b-[8px] pb-4 mb-4 flex justify-between items-end ${activeJob.type === 'handover' ? 'border-emerald-600' : 'border-slate-900'}`}>
              <div>
                <h1 className="text-4xl font-black tracking-tighter uppercase leading-none">
                  {activeJob.type === 'handover' ? 'Completed Works' : 'Field Report'}
                </h1>
                <p className="text-slate-400 font-black text-xs uppercase tracking-widest mt-2">
                  {activeJob.date ? new Date(activeJob.date).toLocaleDateString('en-AU', { dateStyle: 'full' }) : new Date().toLocaleDateString('en-AU', { dateStyle: 'full' })}
                </p>
              </div>
              <div className="text-right">
                <p className="text-2xl font-black text-slate-900 uppercase">{activeJob.address}</p>
                <p className="text-slate-500 font-bold text-sm">TOTAL TIME: {getAggregatedTotals(activeJob.tasks).string}</p>
              </div>
            </div>

            {activeJob.tasks.map((t, idx) => (
              <div key={t.id} className="print-card">
                <div className={`px-5 py-3 font-black border-b flex justify-between items-center text-lg uppercase ${activeJob.type === 'handover' ? 'bg-emerald-50 text-emerald-800' : 'bg-slate-50 text-slate-800'}`}>
                  <span>{idx + 1}. {t.title}</span>
                  <span className="text-sm">{t.time}</span>
                </div>
                <div className="p-6">
                  <p className="text-[14px] text-slate-700 mb-6 leading-relaxed border-l-4 border-slate-200 pl-4 italic font-medium">"{t.desc}"</p>
                  <div className="grid grid-cols-2 gap-4 mb-4">
                    <div className="p-4 bg-slate-50 rounded-xl border">
                      <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Materials</label>
                      <span className="text-[12px] font-bold text-slate-600 uppercase leading-tight">{t.materials || 'None'}</span>
                    </div>
                    <div className="p-4 bg-slate-50 rounded-xl border">
                      <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">
                        {activeJob.type === 'handover' ? 'Notes/Delays' : 'Tools Used'}
                      </label>
                      <span className="text-[12px] font-bold text-slate-600 uppercase leading-tight">{t.tools || 'None'}</span>
                    </div>
                  </div>
                  
                  {/* Cropped 3-Column Image Grid for cleaner PDFs */}
                  {t.images?.length > 0 && (
                    <div className="grid grid-cols-3 gap-3 print-img-container">
                      {t.images.map((img, i) => (
                        <div key={i} className="rounded-lg overflow-hidden border aspect-[4/3] shadow-sm bg-slate-100">
                          <img src={img} className="w-full h-full object-cover" />
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
