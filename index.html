    <script type="text/babel" data-type="module">
  import React, { useState, useEffect, useRef, Component } from 'react';
  import ReactDOM from 'react-dom/client';
  import { createPortal } from 'react-dom';
  import { get, set } from 'idb-keyval';
  import {
    Trash2, ImageIcon, Printer, Plus, X, Hammer, ChevronRight, ChevronDown, Sparkles,
    Pencil, Save, HardDrive, CheckCircle2, Clock, Moon, Sun, Edit3, Undo,
    RefreshCcw, Move, ZoomIn, Check, Search, DollarSign, Tag, Share2, Map,
    MapPinned, Navigation, LocateFixed, AlertTriangle, Receipt, Home, Info,
    Download, Upload, Settings, FileText, Bot, Mic, ShieldAlert,
    Bookmark, Package, PlusCircle, Calendar, Building2, CalendarPlus
  } from 'lucide-react';

  /* ─── Constants ─────────────────────────────────────────────── */
  const DB_KEY_JOBS      = 'jobsite-master-v4';
  const DB_KEY_TEMPL     = 'joblog-templates';
  const DB_KEY_MATS      = 'joblog-materials';
  const DB_KEY_APPOINTMENTS = 'joblog-appointments';
  const BIZA_KEY         = 'joblog-business';
  const MAX_STOPS        = 12;
  const GST_RATE         = 0.1;

  /* ─── Helpers ────────────────────────────────────────────────── */
  const parseTimeToMinutes = (str) => {
    if (!str) return 0;
    const s = str.toLowerCase().trim();
    const hM = s.match(/(\d+\.?\d*)\s*h/);
    const mM = s.match(/(\d+\.?\d*)\s*m(?:in(?:utes?)?)?(?:\b|$)/);
    if (!hM && !mM) { const n = parseFloat(s); return isNaN(n) ? 0 : n * 60; }
    return (hM ? parseFloat(hM[1]) * 60 : 0) + (mM ? parseFloat(mM[1]) : 0);
  };
  const fmtMins = (m) => { const h = Math.floor(m/60), r = Math.round(m%60); if (!h) return `${r}m`; if (!r) return `${h}h`; return `${h}h ${r}m`; };
  const fmtAUD  = (n) => `$${Number(n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2})}`;
  const fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-AU') : '';
  const fmtDateShort = (iso) => iso ? new Date(iso).toLocaleDateString('en-AU', {day:'numeric',month:'short',year:'2-digit'}) : '';
  const fmtDateTime = (iso) => iso ? new Date(iso).toLocaleString('en-AU', {day:'numeric',month:'short',hour:'numeric',minute:'2-digit'}) : '';

  const getQuoteTotals = (tasks, gstEnabled) => {
    let labour = 0, mats = 0;
    (tasks||[]).forEach(t => {
      labour += (parseTimeToMinutes(t.time)/60) * (parseFloat(t.rate)||0);
      mats   += parseFloat(t.materialsCost)||0;
    });
    const subtotal = labour + mats;
    const gst      = gstEnabled ? subtotal * GST_RATE : 0;
    const total    = subtotal + gst;
    return { labour, mats, subtotal, gst, total };
  };

  const compressImage = (file) => new Promise((res, rej) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onerror = () => rej(new Error(`FileReader failed: ${file.name}`));
    reader.onload = (ev) => {
      const img = new Image(); img.src = ev.target.result;
      img.onerror = () => rej(new Error(`Decode failed: ${file.name}`));
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          const MAX = 1200; let w = img.width, h = img.height;
          if (w > MAX) { h *= MAX/w; w = MAX; }
          if (h > MAX) { w *= MAX/h; h = MAX; }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          res(c.toDataURL('image/webp', 0.75));
        } catch(e) { rej(e); }
      };
    };
  });

  const compressLogo = (file) => new Promise((res, rej) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onerror = () => rej(new Error('Logo read failed'));
    reader.onload = (ev) => {
      const img = new Image(); img.src = ev.target.result;
      img.onerror = () => rej(new Error('Logo decode failed'));
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          const MAX = 320; let w = img.width, h = img.height;
          if (w > MAX) { h *= MAX/w; w = MAX; }
          if (h > MAX) { w *= MAX/h; h = MAX; }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          res(c.toDataURL('image/webp', 0.88));
        } catch(e) { rej(e); }
      };
    };
  });

  /* ─── Preset templates ───────────────────────────────────────── */
  const TEMPLATES = {
    quote: {
      painting_interior: { title:"Interior Painting", materials:"Paint, Primer, Drop Sheets, Painter's Tape, Filler", tools:"Brushes, Rollers, Extension Poles, Sandpaper", desc:"Surface prep, fill holes, prime and 2 finish coats" },
      painting_exterior: { title:"Exterior Painting", materials:"Exterior Paint, Primer, Weatherproof Filler, Drop Sheets", tools:"Pressure Washer, Scrapers, Brushes, Rollers, Ladders", desc:"Pressure wash, scrape, repair, prime and 2 coats" },
      drywall_repair:    { title:"Drywall/Gyprock Repair", materials:"Plasterboard, Joint Compound, Mesh Tape, Sandpaper, Paint", tools:"Utility Knife, Trowels, Sanding Block, Drywall Saw", desc:"Cut damaged section, install new board, tape, compound, sand and paint" },
      deck_build:        { title:"Deck Construction", materials:"Treated Pine/Hardwood Decking, Joists, Posts, Concrete, Screws", tools:"Circular Saw, Drill, Level, Post Hole Digger, String Line", desc:"Site prep, post installation, frame build, decking installation" },
      laminate_flooring: { title:"Laminate/Vinyl Flooring", materials:"Laminate/Vinyl Planks, Underlay, Skirting Boards, Adhesive", tools:"Jigsaw, Spacers, Tapping Block, Pull Bar, Measuring Tape", desc:"Remove old flooring, level subfloor, install underlay and planks" },
      fencing:           { title:"Fence Installation", materials:"Timber Palings/Colorbond, Steel/Timber Posts, Concrete, Rails, Screws", tools:"Post Hole Digger, Level, String Line, Power Drill, Saw", desc:"Mark line, dig holes, set posts in concrete, install rails and palings" },
      pressure_washing:  { title:"Pressure Washing", materials:"Industrial Degreaser, Surface Cleaner Solution", tools:"Petrol Pressure Washer, Turbo Nozzle, Surface Cleaner", desc:"Deep clean driveways, paths, decks, exteriors, remove mould" },
      general_repairs:   { title:"General Repairs", materials:"Various (depends on scope)", tools:"Basic Hand Tools, Power Tools as Required", desc:"Multiple small tasks - adjustments, hole filling, minor fixes" }
    },
    handover: {
      painting_interior: { title:"Interior Painting", materials:"N/A", tools:"No delays", desc:"All surfaces painted to specification. Touch-up paint provided to client." },
      deck_build:        { title:"Deck Construction", materials:"N/A", tools:"No delays", desc:"Deck construction complete. All safety checks passed. Client briefed on maintenance." },
      pressure_washing:  { title:"Pressure Washing", materials:"N/A", tools:"No delays", desc:"All surfaces cleaned. Water run-off managed. Area left clean and dry." },
      general_repairs:   { title:"General Repairs", materials:"N/A", tools:"No delays", desc:"All repair items completed as per quote. Work area cleaned." },
      cleanup:           { title:"Site Cleanup", materials:"Cleaning supplies", tools:"Minor weather delay", desc:"Site cleaned of all debris. Surfaces wiped down. Client access restored." }
    }
  };

  const STATUSES = [
    { key:'draft',    label:'Draft',    cls:'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700' },
    { key:'sent',     label:'Sent',     cls:'bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 border-blue-200 dark:border-blue-800' },
    { key:'approved', label:'Approved', cls:'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800' },
    { key:'invoiced', label:'Invoiced', cls:'bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-300 border-purple-200 dark:border-purple-800' },
  ];
  const getStatus = (k) => STATUSES.find(s => s.key===k) || STATUSES[0];

  const getStartOfWeek = (date, weekStartsOn = 1) => {
    const d = new Date(date);
    const day = d.getDay() || 7;
    const diff = d.getDate() - day + weekStartsOn;
    return new Date(d.setDate(diff));
  };

  /* ─── Error Boundary ─────────────────────────────────────────── */
  class ErrorBoundary extends Component {
    constructor(props) { super(props); this.state = { hasError: false, error: null }; }
    static getDerivedStateFromError(error) { return { hasError: true, error }; }
    render() {
      if (this.state.hasError) return (
        <div className="min-h-screen flex items-center justify-center p-8 bg-slate-100 dark:bg-slate-950">
          <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] p-8 max-w-sm w-full text-center border dark:border-slate-800 shadow-xl">
            <div className="bg-red-100 dark:bg-red-900/30 p-4 rounded-2xl mb-4 inline-flex"><AlertTriangle size={32} className="text-red-500"/></div>
            <h2 className="text-xl font-black text-slate-900 dark:text-white mb-2">Something went wrong</h2>
            <p className="text-slate-500 dark:text-slate-400 text-sm mb-6">{this.state.error?.message || 'Unexpected error'}</p>
            <button onClick={() => window.location.reload()} className="bg-orange-500 hover:bg-orange-400 text-white font-black px-6 py-3 rounded-2xl w-full active:scale-95 transition-all">Reload App</button>
          </div>
        </div>
      );
      return this.props.children;
    }
  }

  /* ─── Toast System ───────────────────────────────────────────── */
  const ToastMessage = ({ message, type, onClose }) => {
    useEffect(() => { const timer = setTimeout(onClose, 3500); return () => clearTimeout(timer); }, [onClose]);
    const icons = {
      success: <CheckCircle2 size={18} className="text-emerald-500"/>,
      error: <AlertTriangle size={18} className="text-red-500"/>,
      info: <Info size={18} className="text-blue-500"/>
    };
    return (
      <div className="fixed top-4 left-1/2 -translate-x-1/2 z-[9999] w-[90%] max-w-sm animate-slide-down">
        <div className="bg-slate-900 dark:bg-slate-800 text-white rounded-2xl shadow-2xl p-4 flex items-center gap-3 border border-slate-700">
          {icons[type]}
          <p className="text-sm font-bold flex-1">{message}</p>
          <button onClick={onClose} className="text-slate-400 hover:text-white"><X size={16}/></button>
        </div>
      </div>
    );
  };

  /* ─── ConfirmDialog ──────────────────────────────────────────── */
  const ConfirmDialog = ({ message, confirmLabel = 'Delete', onConfirm, onCancel, danger = true }) => (
    <div className="fixed inset-0 z-[350] bg-slate-900/80 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4">
      <div className="bg-white dark:bg-slate-900 rounded-t-[2.5rem] sm:rounded-[2.5rem] p-8 w-full max-w-sm shadow-2xl border dark:border-slate-800 pb-safe animate-slide-up sm:animate-none">
        <p className="font-bold text-slate-800 dark:text-white text-center mb-6 leading-relaxed text-lg">{message}</p>
        <div className="flex gap-3">
          <button onClick={onCancel} className="flex-1 py-4 rounded-2xl bg-slate-100 dark:bg-slate-800 font-black text-sm text-slate-600 dark:text-slate-300 active:scale-95 transition-all">Cancel</button>
          <button onClick={onConfirm} className={`flex-1 py-4 rounded-2xl font-black text-sm text-white active:scale-95 transition-all ${danger ? 'bg-red-500 hover:bg-red-400' : 'bg-orange-500 hover:bg-orange-400'}`}>{confirmLabel}</button>
        </div>
      </div>
    </div>
  );

  /* ─── BusinessProfileEditor ──────────────────────────────────── */
  const BusinessProfileEditor = ({ profile, onSave, onClose, showToast }) => {
    const [form, setForm] = useState({
      name:        profile.name        || '',
      tradingName: profile.tradingName || '',
      abn:         profile.abn         || '',
      phone:       profile.phone       || '',
      email:       profile.email       || '',
      address:     profile.address     || '',
      logo:        profile.logo        || '',
    });

    const handleLogoUpload = async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const logoData = await compressLogo(file);
        setForm(f => ({ ...f, logo: logoData }));
      } catch {
        showToast('Logo could not be processed.', 'error');
      }
    };

    return (
      <div className="fixed inset-0 z-[190] bg-slate-900/80 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4">
        <div className="bg-white dark:bg-slate-900 rounded-t-[2.5rem] sm:rounded-[2.5rem] w-full max-w-md p-6 shadow-2xl border dark:border-slate-800 max-h-[90vh] overflow-y-auto animate-slide-up sm:animate-none pb-safe">
          <div className="flex justify-between items-center mb-5 sticky top-0 bg-white/90 dark:bg-slate-900/90 backdrop-blur py-2 z-10">

            <div>
              <p className="font-black text-sm mb-0.5">Business Logo</p>
              <p className="text-[10px] text-slate-400 mb-2 font-medium">Appears on all printed reports</p>

                <Upload size={11}/> Upload
                <input type="file" accept="image/*" className="hidden" onChange={handleLogoUpload}/>
              </label>
              {form.logo && <button onClick={() => setForm(f=>({...f,logo:''}))} className="text-[10px] text-red-400 font-bold mt-1 ml-2 hover:text-red-600">Remove</button>}
            </div>
          </div>
          <div className="space-y-3">
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Business Name *</label>
              <input className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl font-bold outline-none focus:ring-2 focus:ring-orange-400 dark:text-white" placeholder="e.g. Smith Building Services" value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}/>
            </div>
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Trading Name</label>
              <input className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-orange-400 dark:text-white dark:placeholder-slate-500" placeholder="T/A name (if different)" value={form.tradingName} onChange={e=>setForm(f=>({...f,tradingName:e.target.value}))}/>
            </div>
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">ABN</label>
              <input className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl font-mono outline-none focus:ring-2 focus:ring-orange-400 dark:text-white dark:placeholder-slate-500" placeholder="e.g. 12 345 678 901" value={form.abn} onChange={e=>setForm(f=>({...f,abn:e.target.value}))}/>
            </div>
            <div className="grid grid-cols-2 gap-3">
              <div>
                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Phone</label>
                <input className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-orange-400 dark:text-white dark:placeholder-slate-500" placeholder="04xx xxx xxx" value={form.phone} onChange={e=>setForm(f=>({...f,phone:e.target.value}))}/>
              </div>
              <div>
                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Email</label>
                <input className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-orange-400 dark:text-white dark:placeholder-slate-500" placeholder="you@example.com" value={form.email} onChange={e=>setForm(f=>({...f,email:e.target.value}))}/>
              </div>
            </div>
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-1">Business Address</label>
              <input className="w-full p-3 bg-slate-50 dark:bg-slate-800 rounded-xl outline-none focus:ring-2 focus:ring-orange-400 dark:text-white dark:placeholder-slate-500" placeholder="123 Example St, Sydney NSW 2000" value={form.address} onChange={e=>setForm(f=>({...f,address:e.target.value}))}/>
            </div>
          </div>

  const NewJobModal = ({ type, onSave, onClose, apiKey, geminiModel, showToast }) => {
    const [addr, setAddr] = useState('');
    const [client, setClient] = useState('');
    const [additionalText, setAdditionalText] = useState('');
    const [dueDate, setDueDate] = useState('');
    const [files, setFiles] = useState([]);
    const [isImporting, setIsImporting] = useState(false);
    const fileInputRef = useRef(null);

    const handleFiles = (e) => { setFiles(prev => [...prev, ...Array.from(e.target.files)]); e.target.value = ''; };
    const removeFile = (index) => setFiles(prev => prev.filter((_,i) => i!==index));
    const createManual = () => { if (!addr.trim()) return showToast('Address is required', 'error'); onSave(addr.trim(), client.trim(), [], dueDate); };

    const createWithAI = async () => {
      if (!apiKey) { showToast('Please save a Gemini API key in Settings first.', 'error'); return; }
      setIsImporting(true);
      try {
        const fileParts = [];
        for (const file of files) {
          if (file.type === 'application/pdf' || file.type.startsWith('image/')) {
            const base64Data = await new Promise((resolve, reject) => {
              const reader = new FileReader();
              reader.onload = () => resolve(reader.result.split(',')[1]);
              reader.onerror = reject;
              reader.readAsDataURL(file);
            });
            fileParts.push({ inlineData: { mimeType: file.type || 'application/pdf', data: base64Data } });
          }
        }
        const textPrompt = `Extract the following from the provided document(s) and additional text.
          Return ONLY a valid JSON object with keys:
          "address" (job site address),
          "clientName" (client or customer name),
          "dueDate" (ISO date string YYYY-MM-DD if a due date or completion date is mentioned, otherwise empty string),
          "tasks" (array of objects with: "title", "time" (e.g. "2h 30m"), "rate" (string, e.g. "85"), "materialsCost" (string, e.g. "320"), "materials" (comma-separated string), "tools" (comma-separated string), "desc" (short factual description, avoid fluff)).
          Additional text: ${additionalText || 'None'}`;
        const res = await fetch(
          `https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${apiKey}`,
          { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contents:[{parts:[{text:textPrompt},...fileParts]}], generationConfig:{temperature:0,response_mime_type:'application/json'} }) }
        );
        if (!res.ok) throw new Error(`API error ${res.status}`);
        const data = await res.json();
        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const json = JSON.parse(raw.replace(/```json\n?|```/g, '').trim());
        const tasks = (json.tasks || []).map(t => ({ title: t.title||'', time: t.time||'', rate: String(t.rate||''), materialsCost: String(t.materialsCost||''), materials: String(t.materials||''), tools: String(t.tools||''), desc: t.desc||'', images:[] }));
        onSave(json.address || addr, json.clientName || client, tasks, json.dueDate || dueDate);
        showToast('Successfully imported via AI!', 'success');
      } catch (err) { showToast(`AI import failed: ${err.message}`, 'error'); }
      finally { setIsImporting(false); }
    };

    const isHandover = type === 'handover';

  /* ─── Schedule View (week calendar with Google sync) ───────── */
  const ScheduleView = ({ appointments, jobs, googleToken, onSaveAppointment, onDeleteAppointment, isGoogleConnected, showConfirm, onScheduleFromJob, showToast }) => {
    const [weekOffset, setWeekOffset] = useState(0);
    const [apptModal, setApptModal] = useState(null);
    const [googleEvents, setGoogleEvents] = useState([]);
    const [loadingGoogle, setLoadingGoogle] = useState(false);

    const today = new Date();
    const startOfWeek = getStartOfWeek(today, 1);
    startOfWeek.setDate(startOfWeek.getDate() + (weekOffset * 7));
    startOfWeek.setHours(0,0,0,0);
    const dayNames = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const days = Array.from({length:7}, (_,i) => {
      const d = new Date(startOfWeek);
      d.setDate(d.getDate()+i);
      return d;
    });
    const hours = Array.from({length:15}, (_,i) => i+6);

    useEffect(() => {
      if (!googleToken || !isGoogleConnected) return;
      const fetchEvents = async () => {
        setLoadingGoogle(true);
        try {
          const timeMin = new Date(startOfWeek).toISOString();
          const timeMax = new Date(days[6].getTime() + 24*3600*1000).toISOString();
          const res = await fetch(
            `https://www.googleapis.com/calendar/v3/calendars/primary/events?timeMin=${timeMin}&timeMax=${timeMax}&singleEvents=true&orderBy=startTime`,
            { headers: { Authorization: `Bearer ${googleToken.access_token}` } }
          );
          if (res.status === 401) {
             showToast('Google session expired. Please reconnect.', 'error');
             return;
          }
          const data = await res.json();
          setGoogleEvents(data.items || []);
        } catch (e) { console.error('Failed to fetch Google events', e); }
        finally { setLoadingGoogle(false); }
      };
      fetchEvents();
    }, [googleToken, weekOffset, isGoogleConnected]);

    const localEvents = appointments.map(a => ({
      ...a,
      isLocal: true,
      start: new Date(a.start),
      end: new Date(a.end)
    }));
    const localGoogleIds = new Set(appointments.filter(a => a.googleEventId).map(a => a.googleEventId));
    const externalGoogleEvents = googleEvents
      .filter(ev => !localGoogleIds.has(ev.id))
      .map(ev => ({
        id: ev.id,
        title: ev.summary || '(No title)',
        start: new Date(ev.start.dateTime || ev.start.date),
        end: new Date(ev.end.dateTime || ev.end.date),
        isGoogle: true,
        notes: ev.description || ''
      }));
    const allEvents = [...localEvents, ...externalGoogleEvents];

    const getEventsForSlot = (day, hour) => {
      const slotStart = new Date(day);
      slotStart.setHours(hour,0,0,0);
      const slotEnd = new Date(slotStart);
      slotEnd.setHours(hour+1,0,0,0);
      return allEvents.filter(ev => ev.start < slotEnd && ev.end > slotStart);
    };

    const handleSlotClick = (day, hour) => {
      const defStart = new Date(day);
      defStart.setHours(hour,0,0,0);
      const defEnd = new Date(defStart);
      defEnd.setHours(hour+1,0,0,0);
      setApptModal({ appointment: { id: null, title: '', jobId: '', start: defStart.toISOString().slice(0,16), end: defEnd.toISOString().slice(0,16), notes: '' }, defaultStart: defStart.toISOString().slice(0,16) });
    };

    const handleEventClick = (event) => {
      if (event.isGoogle) return;
      setApptModal({ appointment: event });
    };

    const handleSave = async (data) => {
      if (googleToken && isGoogleConnected && !data.googleEventId) {
        try {
          const gEvent = {
            summary: data.title,
            description: data.notes || '',
            start: { dateTime: new Date(data.start).toISOString(), timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone },
            end: { dateTime: new Date(data.end).toISOString(), timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone }
          };
          const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
            method: 'POST',
            headers: { Authorization: `Bearer ${googleToken.access_token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify(gEvent)
          });
          const created = await res.json();
          data.googleEventId = created.id;
          showToast('Saved to Google Calendar', 'success');
        } catch (e) { showToast('Google sync failed', 'error'); }
      } else {
        showToast('Appointment Saved', 'success');
      }
      onSaveAppointment(data);
      setApptModal(null);
    };

    const handleDeleteAppointment = (id) => {
      showConfirm('Delete this appointment?', () => {
        const appt = appointments.find(a => a.id === id);
        if (appt?.googleEventId && googleToken) {
          fetch(`https://www.googleapis.com/calendar/v3/calendars/primary/events/${appt.googleEventId}`, {
            method: 'DELETE',
            headers: { Authorization: `Bearer ${googleToken.access_token}` }
          }).catch(e => console.error('Failed to delete Google event', e));
        }
        onDeleteAppointment(id);
        showToast('Appointment Deleted', 'info');
      });
    };

    return (
      <div className="max-w-6xl mx-auto p-4 animate-slide-up pb-24">
        <div className="flex justify-between items-center mb-4">
          <button onClick={() => setWeekOffset(o => o-1)} className="p-3 bg-slate-200 dark:bg-slate-800 rounded-xl"><ChevronRight size={18} className="rotate-180"/></button>
          <h2 className="text-xl font-black uppercase text-center">
            {days[0].toLocaleDateString('en-AU', {day:'numeric',month:'short'})} – {days[6].toLocaleDateString('en-AU', {day:'numeric',month:'short',year:'2-digit'})}
          </h2>
          <button onClick={() => setWeekOffset(o => o+1)} className="p-3 bg-slate-200 dark:bg-slate-800 rounded-xl"><ChevronRight size={18}/></button>
        </div>

        <div className="calendar-grid shadow-sm">
          <div className="bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 font-black text-[10px] uppercase text-slate-500 dark:text-slate-400 flex items-center justify-center">Time</div>
          {days.map((d,i) => (
            <div key={i} className={`bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 font-black text-[10px] uppercase text-slate-500 dark:text-slate-400 flex items-center justify-center py-2 ${d.toDateString()===today.toDateString()?'text-orange-500':''}`}>
              {dayNames[i]}<br/>{d.getDate()}
            </div>
          ))}
          {hours.map(hour => (
            <React.Fragment key={hour}>
              <div className="calendar-hour">{hour}:00</div>
              {days.map((day, di) => {
                const slotEvents = getEventsForSlot(day, hour);
                return (
                  <div key={di} className="calendar-cell" onClick={() => handleSlotClick(day, hour)}>
                    {slotEvents.map(ev => (
                      <div
                        key={ev.id}
                        onClick={(e) => { e.stopPropagation(); handleEventClick(ev); }}
                        className={`calendar-event ${ev.isGoogle ? 'bg-blue-200 dark:bg-blue-800 text-slate-800 dark:text-blue-200' : ev.isLocal ? 'bg-orange-100 dark:bg-orange-900/60 text-orange-800 dark:text-orange-200' : 'bg-slate-200 dark:bg-slate-600'}`}
                        style={{ top: `${(ev.start.getMinutes()/60)*100}%`, height: `${Math.min(((ev.end - ev.start)/3600000)*100, 100)}%` }}
                      >
                        <div className="truncate text-[9px] font-black">{ev.title}</div>
                      </div>
                    ))}
                  </div>
                );
              })}
            </React.Fragment>
          ))}
        </div>

        <div className="mt-6 bg-white dark:bg-slate-800 rounded-3xl p-5 border dark:border-slate-700 shadow-sm">
          <h3 className="font-black text-sm uppercase tracking-widest mb-3 flex items-center gap-2"><Clock size={14} className="text-orange-500"/> Upcoming Appointments</h3>
          {allEvents.filter(ev => ev.start >= new Date()).sort((a,b)=>a.start-b.start).slice(0,5).map(ev => (
            <div key={ev.id} className="flex items-center justify-between py-2 border-b dark:border-slate-700 last:border-0">
              <div>
                <p className="font-bold text-sm">{ev.title}</p>
                <p className="text-[10px] text-slate-400">{fmtDateTime(ev.start.toISOString())} – {fmtDateTime(ev.end.toISOString())}</p>
              </div>
              {!ev.isGoogle && (
                <button onClick={() => handleDeleteAppointment(ev.id)} className="text-red-400 hover:text-red-600 p-2"><Trash2 size={16}/></button>
              )}
            </div>
          ))}
          {allEvents.length===0 && <p className="text-sm text-slate-400">No upcoming appointments.</p>}
        </div>

        {apptModal && (
          <AppointmentFormModal
            appointment={apptModal.appointment}
            jobs={jobs}
            googleToken={googleToken}
            onSave={handleSave}
            onClose={() => setApptModal(null)}
            showToast={showToast}
          />
        )}
      </div>
    );
  };

  /* ═══════════════════════════════════════════════════════════
     APP
  ═══════════════════════════════════════════════════════════ */
  const App = () => {
    const [jobs, setJobs] = useState([]);
    const [userTemplates, setUserTemplates] = useState([]);
    const [userMaterials, setUserMaterials] = useState([]);
    const [appointments, setAppointments] = useState([]);
    const [businessProfile, setBusinessProfile] = useState(() => {
      try { return JSON.parse(localStorage.getItem(BIZA_KEY) || '{}'); } catch { return {}; }
    });

    // UI State
    const [viewMode, setViewMode] = useState('dashboard');
    const [activeJobId, setActiveJobId] = useState(null);
    const [selectionMode, setSelectionMode] = useState(false);
    const [showSettings, setShowSettings] = useState(false);
    const [toast, setToast] = useState(null);

    const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
    const [editingTaskId, setEditingTaskId] = useState(null);
    const [dbSize, setDbSize] = useState('0 MB');
    const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');
    const [newJobModal, setNewJobModal] = useState(null);
    const [searchQ, setSearchQ] = useState('');
    const [filterType, setFilterType] = useState('all');
    const [sortBy, setSortBy] = useState('created_desc');
    const [isEditingHeader, setIsEditingHeader] = useState(false);
    const [headerDraft, setHeaderDraft] = useState({ address:'', clientName:'', clientRef:'', dueDate:'', projectNotes:'', projectPhotos:[] });
    const [isLoading, setIsLoading] = useState(true);
    const [isListening, setIsListening] = useState(false);
    const recognitionRef = useRef(null);
    const [apiKey, setApiKey] = useState(() => localStorage.getItem('geminiApiKey') || '');
    const [geminiModel, setGeminiModel] = useState(() => localStorage.getItem('geminiModel') || 'gemini-2.5-flash');
    const [googleClientId, setGoogleClientId] = useState(() => localStorage.getItem('googleClientId') || '');
    const [googleToken, setGoogleToken] = useState(null);
    const [confirmDialog, setConfirmDialog] = useState(null);
    const [printPreviewJob, setPrintPreviewJob] = useState(null);
    const [selectedJobs, setSelectedJobs] = useState([]);
    const [useMyLocation, setUseMyLocation] = useState(true);
    const [locStatus, setLocStatus] = useState('idle');
    const [currentCoords, setCurrentCoords] = useState(null);

    const [appointmentFromJob, setAppointmentFromJob] = useState(null);

    const EMPTY_TASK = { title:'', time:'', rate:'', materialsCost:'', materials:'', tools:'', desc:'', images:[] };
    const [taskData, setTaskData] = useState(EMPTY_TASK);
    const [rateError, setRateError] = useState(false);
    const [matError, setMatError] = useState(false);

    const [editingImageIdx, setEditingImageIdx] = useState(null);
    const canvasRef    = useRef(null);
    const [isDrawing, setIsDrawing]   = useState(false);
    const [penColor, setPenColor]     = useState('#ef4444');
    const [undoStack, setUndoStack]   = useState([]);
    const [canvasZoom, setCanvasZoom] = useState(1);
    const [canvasPan, setCanvasPan]   = useState({ x:0, y:0 });
    const [canvasMode, setCanvasMode] = useState('draw');
    const zoomRef     = useRef(1);
    const panRef      = useRef({ x:0, y:0 });
    const modeRef     = useRef('draw');
    const drawRef     = useRef(false);
    const pinchRef    = useRef(null);
    const panStartRef = useRef(null);
    const COLORS = [
      { hex:'#ef4444', name:'Red' }, { hex:'#22c55e', name:'Green' },
      { hex:'#eab308', name:'Yellow' }, { hex:'#ffffff', name:'White' },
      { hex:'#000000', name:'Black' }
    ];

    const [showTemplatePop, setShowTemplatePop] = useState(false);
    const [showMaterialPop, setShowMaterialPop] = useState(false);

    // Toast helper
    const showToast = (message, type = 'info') => { setToast({ message, type }); };

    /* ── DB helpers ── */
    const loadJobs = async () => {
      const d = await get(DB_KEY_JOBS) || [];
      const migrated = d.map(j => {
        const mj = { ...j };
        if (mj.type === 'handover' && mj.showCosts === undefined) mj.showCosts = false;
        if (!mj.createdAt) mj.createdAt = mj.date ? new Date(mj.date).getTime() : Date.now();
        return mj;
      });
      setJobs(migrated);
      updMetric(migrated);
      setIsLoading(false);
    };
    const loadTemplates = async () => setUserTemplates(await get(DB_KEY_TEMPL) || []);
    const loadMaterials = async () => setUserMaterials(await get(DB_KEY_MATS) || []);
    const loadAppointments = async () => setAppointments(await get(DB_KEY_APPOINTMENTS) || []);
    useEffect(() => { loadJobs(); loadTemplates(); loadMaterials(); loadAppointments(); }, []);

    const updMetric = (d) => setDbSize(`${(new TextEncoder().encode(JSON.stringify(d)).length/1024/1024).toFixed(2)} MB`);
    const saveToDB = async (nj) => {
      setJobs(nj);
      try { await set(DB_KEY_JOBS, nj); } catch(e) { showToast('Warning: Data could not be saved (Storage limit).', 'error'); }
      updMetric(nj);
    };
    const saveUserTemplates = async (arr) => { setUserTemplates(arr); await set(DB_KEY_TEMPL, arr); };
    const saveUserMaterials = async (arr) => { setUserMaterials(arr); await set(DB_KEY_MATS, arr); };
    const saveAppointments = async (arr) => { setAppointments(arr); await set(DB_KEY_APPOINTMENTS, arr); };
    const saveBusinessProfile = (profile) => { setBusinessProfile(profile); localStorage.setItem(BIZA_KEY, JSON.stringify(profile)); };

    useEffect(() => {
      const root = document.documentElement;
      if (isDarkMode) { root.classList.add('dark'); document.getElementById('theme-color-meta').setAttribute('content','#020617'); localStorage.setItem('theme','dark'); }
      else { root.classList.remove('dark'); document.getElementById('theme-color-meta').setAttribute('content','#ffffff'); localStorage.setItem('theme','light'); }
    }, [isDarkMode]);

    const activeJob   = jobs.find(j => j.id === activeJobId);
    const getTotals   = (tasks) => { const m=(tasks||[]).reduce((a,t)=>a+parseTimeToMinutes(t.time),0); return { mins:m, str:fmtMins(m) }; };
    const quoteTotals = activeJob?.type==='quote' ? getQuoteTotals(activeJob.tasks, activeJob.gstEnabled) : null;

    const connectGoogleCalendar = (clientId) => {
      if (!clientId) return;
      const tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: clientId,
        scope: 'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/calendar.readonly',
        callback: (response) => {
          if (response.error) return showToast('Google sign-in failed', 'error');
          setGoogleToken(response);
          localStorage.setItem('googleToken', JSON.stringify(response));
          localStorage.setItem('googleClientId', clientId);
          showToast('Google Calendar Connected!', 'success');
        },
      });
      tokenClient.requestAccessToken({ prompt: '' });
    };
    const disconnectGoogleCalendar = () => {
      setGoogleToken(null);
      localStorage.removeItem('googleToken');
    };

    useEffect(() => {
      const savedToken = localStorage.getItem('googleToken');
      if (savedToken) {
        try {
          const parsed = JSON.parse(savedToken);
          if (parsed && parsed.access_token) setGoogleToken(parsed);
        } catch {}
      }
    }, []);

    const handleSaveAppointment = (appt) => {
      let updated;
      if (appointments.find(a => a.id === appt.id)) {
        updated = appointments.map(a => a.id === appt.id ? appt : a);
      } else {
        updated = [...appointments, appt];
      }
      saveAppointments(updated);
      setAppointmentFromJob(null);
    };
    const handleDeleteAppointment = (id) => {
      saveAppointments(appointments.filter(a => a.id !== id));
    };

    const showConfirm = (message, onConfirm, confirmLabel = 'Delete', danger = true) => setConfirmDialog({ message, onConfirm, confirmLabel, danger });
    const dismissConfirm = () => setConfirmDialog(null);

    const openAppointmentForJob = (jobId) => {
      const job = jobs.find(j => j.id === jobId);
      if (!job) return;
      setAppointmentFromJob({
        id: null,
        title: `Work: ${job.address}`,
        jobId: jobId,
        start: new Date().toISOString().slice(0,16),
        end: new Date(Date.now()+2*3600*1000).toISOString().slice(0,16),
        notes: '',
        googleEventId: null
      });
    };

    // Voice
    const toggleVoice = () => {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return showToast('Voice dictation not supported in this browser.', 'error');
      if (isListening) { recognitionRef.current?.stop(); recognitionRef.current = null; setIsListening(false); return; }
      const recognition = new SpeechRecognition();
      recognitionRef.current = recognition;
      recognition.continuous = false; recognition.interimResults = false;
      recognition.onstart = () => setIsListening(true);
      recognition.onresult = (e) => { const t = e.results[0][0].transcript; setTaskData(p => ({ ...p, desc: p.desc ? p.desc + ' ' + t : t })); };
      recognition.onerror = () => { setIsListening(false); recognitionRef.current = null; };
      recognition.onend = () => { setIsListening(false); recognitionRef.current = null; };
      recognition.start();
    };

    const [isAiSuggesting, setIsAiSuggesting] = useState(false);
    const handleAiSuggest = async () => {
      if (!taskData.title.trim() && !taskData.desc.trim()) { showToast('Enter at least a title or description first.', 'error'); return; }
      if (!apiKey) { showToast('Please add your Gemini API key in Settings first.', 'error'); return; }
      setIsAiSuggesting(true);
      const prompt = `You are a construction trade assistant. Based on the following task, return ONLY a valid JSON object (no extra text) with keys: "title", "time" (e.g. "2h 30m"), "rate" (AUD per hour, e.g. "85"), "materialsCost" (e.g. "45"), "materials" (comma-separated string), "tools" (comma-separated string), "desc" (short factual description, avoid fluff). Use typical Australian rates. Task: Title: ${taskData.title || 'Not provided'}, Description: ${taskData.desc || 'Not provided'}`;
      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${geminiModel}:generateContent?key=${apiKey}`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ contents:[{parts:[{text:prompt}]}], generationConfig:{temperature:0.3,response_mime_type:'application/json'} }) });
        if (!res.ok) throw new Error('AI request failed');
        const data = await res.json();
        const raw = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';
        const json = JSON.parse(raw.replace(/```json\n?|```/g, '').trim());
        setTaskData(prev => ({ ...prev, title: json.title||prev.title, time: json.time||prev.time, rate: json.rate||prev.rate, materialsCost: json.materialsCost||prev.materialsCost, materials: json.materials||prev.materials, tools: json.tools||prev.tools, desc: json.desc||prev.desc }));
        showToast('Suggestions applied!', 'success');
      } catch (err) { showToast(`AI suggest failed: ${err.message}`, 'error'); }
      finally { setIsAiSuggesting(false); }
    };

    const [saveTemplateName, setSaveTemplateName] = useState('');
    const [isNamingTemplate, setIsNamingTemplate] = useState(false);
    const handleSaveAsTemplate = () => { if (!taskData.title) return showToast('Task title is required.', 'error'); setIsNamingTemplate(true); setSaveTemplateName(''); };
    const confirmSaveTemplate = () => {
      if (!saveTemplateName.trim()) return;
      const tpl = { name: saveTemplateName.trim(), type: activeJob?.type || 'quote', data: { title: taskData.title, time: taskData.time, rate: taskData.rate, materialsCost: taskData.materialsCost, materials: taskData.materials, tools: taskData.tools, desc: taskData.desc } };
      saveUserTemplates([...userTemplates, tpl]);
      setIsNamingTemplate(false);
      showToast('Template Saved!', 'success');
    };

    const handleSaveMaterial = () => {
      const matName = String(taskData.materials || '').trim();
      const matCost = String(taskData.materialsCost || '').trim();
      if (!matName || !matCost) return;
      if (userMaterials.find(m => String(m.name)===matName && String(m.price)===matCost)) return;
      saveUserMaterials([...userMaterials, { name: matName, price: matCost }]);
      showToast('Material Saved!', 'success');
    };

    const exportData = () => {
      const blob = new Blob([JSON.stringify(jobs, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = `joblog-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
      URL.revokeObjectURL(url);
    };
    const importData = (e) => {
      const file = e.target.files[0]; if (!file) return; e.target.value = '';
      const reader = new FileReader();
      reader.onload = async (ev) => {
        try {
          const imported = JSON.parse(ev.target.result);
          if (!Array.isArray(imported)) throw new Error('Invalid format');
          showConfirm(`Found ${imported.length} project(s). This will replace ALL current data. Are you sure?`, async () => {
            const migrated = imported.map(j => { const mj={...j}; if (mj.type==='handover' && mj.showCosts===undefined) mj.showCosts=false; if (!mj.createdAt) mj.createdAt = mj.date?new Date(mj.date).getTime():Date.now(); return mj; });
            await saveToDB(migrated); window.location.reload();
          }, 'Replace All');
        } catch { showToast('Invalid backup file.', 'error'); }
      };
      reader.readAsText(file);
    };

    const handleCreateJob = (address, clientName, tasks = [], dueDate = '') => {
      const now = Date.now();
      const newJob = {
        id: (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : now,
        date: new Date(now).toISOString(),
        createdAt: now,
        type: newJobModal,
        address, clientName,
        clientRef: '', dueDate: dueDate || '',
        projectNotes: '', projectPhotos: [],
        tasks: tasks.map(t => ({ ...t, id: Date.now() + Math.random() })),
        status: 'draft',
        gstEnabled: false,
        showCosts: newJobModal === 'handover' ? false : true,
      };
      saveToDB([...jobs, newJob]);
      setNewJobModal(null);
      showToast('Project Created', 'success');
    };

    const cycleStatus = (id) => {
      const j = jobs.find(x=>x.id===id), idx = STATUSES.findIndex(s=>s.key===(j.status||'draft'));
      saveToDB(jobs.map(x=>x.id===id?{...x,status:STATUSES[(idx+1)%STATUSES.length].key}:x));
    };
    const toggleGST   = (id) => saveToDB(jobs.map(j=>j.id===id?{...j,gstEnabled:!j.gstEnabled}:j));
    const toggleCosts  = (id) => saveToDB(jobs.map(j=>j.id===id&&j.type==='handover'?{...j,showCosts:!j.showCosts}:j));

    const startEditHeader = () => {
      setHeaderDraft({ address: activeJob.address, clientName: activeJob.clientName, clientRef: activeJob.clientRef||'', dueDate: activeJob.dueDate||'', projectNotes: activeJob.projectNotes||'', projectPhotos: activeJob.projectPhotos||[] });
      setIsEditingHeader(true);
    };
    const saveHeaderEdit = () => {
      if (!headerDraft.address.trim()) return;
      saveToDB(jobs.map(j => j.id===activeJobId ? { ...j, address:headerDraft.address.trim(), clientName:headerDraft.clientName, clientRef:headerDraft.clientRef, dueDate:headerDraft.dueDate, projectNotes:headerDraft.projectNotes, projectPhotos:headerDraft.projectPhotos } : j));
      setIsEditingHeader(false);
      showToast('Details Updated', 'success');
    };
    const handleProjectPhotoUpload = async (e) => {
      try { const c = await Promise.all(Array.from(e.target.files).map(compressImage)); setHeaderDraft(d => ({...d,projectPhotos:[...d.projectPhotos,...c]})); }
      catch { showToast('One or more images could not be processed.', 'error'); }
    };

    const handleSaveTask = () => {
      if (!taskData.title) return showToast('Task title is required.', 'error');
      if (!activeJob) return;
      const updated = editingTaskId
        ? activeJob.tasks.map(t => t.id===editingTaskId ? { ...taskData, id:editingTaskId } : t)
        : [...activeJob.tasks, { ...taskData, id: Date.now() }];
      saveToDB(jobs.map(j => j.id===activeJobId ? { ...j, tasks:updated } : j));
      closeModal();
      showToast('Entry Saved', 'success');
    };
    const closeModal = () => {
      recognitionRef.current?.stop(); recognitionRef.current = null;
      setIsListening(false); setIsTaskFormOpen(false); setEditingTaskId(null);
      setTaskData(EMPTY_TASK); setRateError(false); setMatError(false);
      setIsNamingTemplate(false);
    };
    const handleImageUpload = async (e) => {
      try { const c = await Promise.all(Array.from(e.target.files).map(compressImage)); setTaskData(p=>({...p,images:[...p.images,...c]})); }
      catch { showToast('One or more images could not be processed.', 'error'); }
    };
    const validateRate = (val) => { const n = parseFloat(val); setRateError(val !== '' && isNaN(n)); };
    const validateMat  = (val) => { const n = parseFloat(val); setMatError(val !== ''  && isNaN(n)); };

    const toggleJobSelection = (id) => setSelectedJobs(prev => prev.includes(id) ? prev.filter(x=>x!==id) : prev.length>=MAX_STOPS ? prev : [...prev,id]);
    const clearSelection = () => setSelectedJobs([]);
    const selectAllVisible = () => setSelectedJobs(prev => { const e=new Set(prev); return [...prev,...filteredJobs.map(j=>j.id).filter(id=>!e.has(id))].slice(0,MAX_STOPS); });
    const getMyLocation = () => {
      if (!navigator.geolocation) { setLocStatus('denied'); return; }
      setLocStatus('loading');
      navigator.geolocation.getCurrentPosition(
        (pos) => { setCurrentCoords({lat:pos.coords.latitude,lng:pos.coords.longitude}); setLocStatus('ok'); },
        () => { setLocStatus('denied'); setUseMyLocation(false); }
      );
    };
    const handleLocToggle = () => { const next=!useMyLocation; setUseMyLocation(next); if (next && locStatus==='idle') getMyLocation(); };
    const openGoogleMaps = () => {
      const ordered = selectedJobs.map(id=>jobs.find(j=>j.id===id)).filter(Boolean);
      if (!ordered.length) return;
      let origin, stops;
      if (useMyLocation && currentCoords) { origin=`${currentCoords.lat},${currentCoords.lng}`; stops=ordered; }
      else { origin=encodeURIComponent(ordered[0].address); stops=ordered.slice(1); }
      const dest = stops.length>0 ? encodeURIComponent(stops[stops.length-1].address) : origin;
      const wps = stops.slice(0,-1).map(j=>encodeURIComponent(j.address)).join('|');
      let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving`;
      if (wps) url += `&waypoints=${wps}`;
      window.open(url, '_blank', 'noopener');
    };
    const atStopLimit = selectedJobs.length >= MAX_STOPS;

    const filteredJobs = jobs
      .filter(j => filterType==='all' || j.type===filterType)
      .filter(j => !searchQ.trim() || (j.address || '').toLowerCase().includes(searchQ.toLowerCase()) || (j.clientName||'').toLowerCase().includes(searchQ.toLowerCase()))
      .sort((a,b) => {
        if (sortBy === 'created_desc') return (b.createdAt || 0) - (a.createdAt || 0);
        if (sortBy === 'created_asc') return (a.createdAt || 0) - (b.createdAt || 0);
        if (sortBy === 'due_asc') {
          if (!a.dueDate) return 1;
          if (!b.dueDate) return -1;
          return new Date(a.dueDate).getTime() - new Date(b.dueDate).getTime();
        }
        if (sortBy === 'due_desc') {
          if (!a.dueDate) return 1;
          if (!b.dueDate) return -1;
          return new Date(b.dueDate).getTime() - new Date(a.dueDate).getTime();
        }
        if (sortBy === 'az') return String(a.address || '').localeCompare(String(b.address || ''));
        return 0;
      });

    // Share Detail View
    const handleShare = async () => {
      if (!activeJob) return;
      const qt = activeJob.type === 'quote' ? getQuoteTotals(activeJob.tasks, activeJob.gstEnabled) : null;
      let text = `Project: ${activeJob.address}\nClient: ${activeJob.clientName || 'N/A'}\n`;
      if (qt && qt.total > 0) text += `Total Est: ${fmtAUD(qt.total)}\n`;
      text += `\nSummary of Works:\n` + activeJob.tasks.map(t => `- ${t.title} (${t.time})`).join('\n');

      if (navigator.share) {
         try { await navigator.share({ title: 'Job Summary', text }); } catch(e) {}
      } else {
         navigator.clipboard.writeText(text);
         showToast('Summary copied to clipboard!', 'success');
      }
    };

    // Canvas helpers
    const resetView = () => { setCanvasZoom(1); zoomRef.current=1; setCanvasPan({x:0,y:0}); panRef.current={x:0,y:0}; setCanvasMode('draw'); modeRef.current='draw'; };
    useEffect(() => {
      if (editingImageIdx !== null && canvasRef.current) {
        resetView();
        const cvs = canvasRef.current, ctx = cvs.getContext('2d'), img = new Image();
        img.src = taskData.images[editingImageIdx];
        img.onload = () => { cvs.width=img.width; cvs.height=img.height; ctx.drawImage(img,0,0,img.width,img.height); setUndoStack([cvs.toDataURL()]); };
      }
    }, [editingImageIdx, taskData.images]);

    const getCoords = (e) => {
      const cvs=canvasRef.current, r=cvs.getBoundingClientRect();
      let cx=e.clientX, cy=e.clientY;
      if (e.touches?.length>0) { cx=e.touches[0].clientX; cy=e.touches[0].clientY; }
      return { x:(cx-r.left)*(cvs.width/r.width), y:(cy-r.top)*(cvs.height/r.height) };
    };
    const startDraw = (e) => {
      setIsDrawing(true); drawRef.current=true;
      const {x,y}=getCoords(e), ctx=canvasRef.current.getContext('2d');
      ctx.strokeStyle=penColor; ctx.lineWidth=Math.max(3,canvasRef.current.width/100);
      ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(x,y);
    };
    const doDraw = (e) => {
      if (!drawRef.current) return; e.preventDefault();
      const {x,y}=getCoords(e), ctx=canvasRef.current.getContext('2d');
      ctx.lineTo(x,y); ctx.stroke();
    };
    const stopDraw = () => {
      if (!drawRef.current) return;
      setIsDrawing(false); drawRef.current=false;
      setUndoStack(p=>[...p,canvasRef.current.toDataURL()]);
    };
    const handleUndo = () => {
      if (undoStack.length<=1) return;
      const ns=[...undoStack]; ns.pop();
      const img=new Image(); img.src=ns[ns.length-1];
      img.onload=()=>{ const ctx=canvasRef.current.getContext('2d'); ctx.clearRect(0,0,canvasRef.current.width,canvasRef.current.height); ctx.drawImage(img,0,0,canvasRef.current.width,canvasRef.current.height); setUndoStack(ns); };
    };
    const handleClear = () => {
      if (undoStack.length<=1) return;
      const img=new Image(); img.src=undoStack[0];
      img.onload=()=>{ const ctx=canvasRef.current.getContext('2d'); ctx.clearRect(0,0,canvasRef.current.width,canvasRef.current.height); ctx.drawImage(img,0,0,canvasRef.current.width,canvasRef.current.height); setUndoStack([undoStack[0]]); };
    };
    const saveAnnotated = () => {
      if (!canvasRef.current) return;
      const imgs=[...taskData.images]; imgs[editingImageIdx]=canvasRef.current.toDataURL('image/webp',0.8);
      setTaskData(p=>({...p,images:imgs})); setEditingImageIdx(null);
    };
    const dist2 = (t1,t2) => Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY);
    const onTouchStart = (e) => {
      if (e.touches.length===2) {
        if (drawRef.current) { drawRef.current=false; setIsDrawing(false); setUndoStack(p=>[...p,canvasRef.current.toDataURL()]); }
        pinchRef.current={ dist:dist2(e.touches[0],e.touches[1]), zoom:zoomRef.current };
      } else if (e.touches.length===1) {
        pinchRef.current=null;
        if (modeRef.current==='pan') { panStartRef.current={ clientX:e.touches[0].clientX, clientY:e.touches[0].clientY, panX:panRef.current.x, panY:panRef.current.y }; }
        else startDraw(e);
      }
    };
    const onTouchMove = (e) => {
      e.preventDefault();
      if (e.touches.length===2 && pinchRef.current) {
        const nz=Math.min(Math.max(pinchRef.current.zoom*(dist2(e.touches[0],e.touches[1])/pinchRef.current.dist),1),6);
        setCanvasZoom(nz); zoomRef.current=nz;
      } else if (e.touches.length===1) {
        if (modeRef.current==='pan' && panStartRef.current) {
          const np={ x:panStartRef.current.panX+(e.touches[0].clientX-panStartRef.current.clientX), y:panStartRef.current.panY+(e.touches[0].clientY-panStartRef.current.clientY) };
          setCanvasPan(np); panRef.current=np;
        } else if (modeRef.current==='draw') doDraw(e);
      }
    };
    const onTouchEnd = (e) => {
      if (e.touches.length<2) pinchRef.current=null;
      if (e.touches.length===0) { panStartRef.current=null; if (modeRef.current==='draw') stopDraw(); }
    };
    const toggleMode = () => { const n=modeRef.current==='draw'?'pan':'draw'; setCanvasMode(n); modeRef.current=n; };
    const onMDown = (e) => { if (modeRef.current==='draw') startDraw(e); else panStartRef.current={clientX:e.clientX,clientY:e.clientY,panX:panRef.current.x,panY:panRef.current.y}; };
    const onMMove = (e) => {
      if (modeRef.current==='draw') doDraw(e);
      else if (modeRef.current==='pan' && panStartRef.current) {
        const np={x:panStartRef.current.panX+(e.clientX-panStartRef.current.clientX),y:panStartRef.current.panY+(e.clientY-panStartRef.current.clientY)};
        setCanvasPan(np); panRef.current=np;
      }
    };
    const onMUp = () => { panStartRef.current=null; stopDraw(); };

    if (isLoading) {
      return (
        <div className="min-h-screen flex items-center justify-center bg-slate-100 dark:bg-slate-950">
          <div className="flex flex-col items-center gap-4">

                    className={`bg-white dark:bg-slate-800 rounded-[2rem] border-2 transition-all cursor-pointer shadow-sm
                      ${selectionMode?(isSelected?'border-blue-500 ring-2 ring-blue-500/30':canSelect?'border-slate-200 dark:border-slate-700 hover:border-blue-400':'border-slate-200 dark:border-slate-700 opacity-40 cursor-not-allowed')

                      <div className="flex items-start gap-3 flex-1 min-w-0">
                        {selectionMode && (

            </div>

        {/* DETAIL VIEW */}

            <div className="flex items-center justify-between px-4 py-2 bg-slate-900/80 border-b border-slate-800/50 flex-shrink-0">
              <div className="flex items-center gap-2">
                <div className={`flex items-center gap-1.5 text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-full ${canvasMode==='draw'?'bg-orange-500/20 text-orange-400 border border-orange-500/40':'bg-blue-500/20 text-blue-400 border border-blue-500/40'}`}>
                  {canvasMode==='draw'?<Pencil size={11}/>:<Move size={11}/>}
                  {canvasMode==='draw'?'Draw mode':'Pan mode'}
                </div>
                {canvasZoom>1 && <div className="text-[10px] font-black text-slate-500 uppercase">{canvasZoom.toFixed(1)}×</div>}
              </div>
              <div className="text-[10px] font-black text-slate-600 uppercase tracking-widest">Pinch to zoom · 2 fingers</div>
            </div>
            <div className="flex-1 overflow-hidden relative flex items-center justify-center bg-slate-950 canvas-editor-area">
              <div style={{transform:`translate(${canvasPan.x}px,${canvasPan.y}px) scale(${canvasZoom})`,transformOrigin:'center center',willChange:'transform'}}>
                <canvas ref={canvasRef} onMouseDown={onMDown} onMouseMove={onMMove} onMouseUp={onMUp} onMouseLeave={onMUp} onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd} className="max-w-full max-h-full object-contain shadow-2xl" style={{cursor:canvasMode==='draw'?'crosshair':'grab',display:'block'}}/>
              </div>
            </div>
            <div className="bg-slate-900 border-t border-slate-800 p-4 z-10 flex-shrink-0">
              <div className="flex justify-between items-center">
                <div className="flex gap-3 items-center">
                  {COLORS.map(c => <button key={c.name} onClick={() => setPenColor(c.hex)} className={`w-8 h-8 rounded-full shadow-inner transition-transform ${penColor===c.hex?'scale-125 ring-2 ring-white ring-offset-1 ring-offset-slate-900':'opacity-70 hover:opacity-100'}`} style={{backgroundColor:c.hex}}/>)}
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={toggleMode} className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase transition-colors px-3 py-2 rounded-xl ${canvasMode==='pan'?'bg-blue-500/20 text-blue-400':'text-slate-400 hover:text-white'}`}>
                    {canvasMode==='draw'?<Move size={20}/>:<Pencil size={20}/>} {canvasMode==='draw'?'Pan':'Draw'}
                  </button>
                  {canvasZoom>1 && <button onClick={() => {setCanvasZoom(1);zoomRef.current=1;setCanvasPan({x:0,y:0});panRef.current={x:0,y:0};}} className="flex flex-col items-center gap-1 text-[10px] font-black uppercase text-slate-400 hover:text-white"><ZoomIn size={20}/>Reset</button>}
                  <button onClick={handleUndo} disabled={undoStack.length<=1} className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase ${undoStack.length<=1?'text-slate-700':'text-slate-300 hover:text-white'}`}><Undo size={20}/>Undo</button>
                  <button onClick={handleClear} disabled={undoStack.length<=1} className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase ${undoStack.length<=1?'text-slate-700':'text-red-400 hover:text-red-300'}`}><RefreshCcw size={20}/>Clear</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* Print preview */}
        {printPreviewJob && (
          <PrintPreview job={printPreviewJob} businessProfile={businessProfile} onClose={() => setPrintPreviewJob(null)}/>
        )}

        {/* Appointment from job form */}
        {appointmentFromJob && (
          <AppointmentFormModal
            appointment={appointmentFromJob}
            jobs={jobs}
            googleToken={googleToken}
            onSave={handleSaveAppointment}
            onClose={() => setAppointmentFromJob(null)}
            showToast={showToast}
          />
        )}
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(
    <ErrorBoundary><App /></ErrorBoundary>
  );
    </script>
  </body>
</html>
