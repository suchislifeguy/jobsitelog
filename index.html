<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" id="theme-color-meta" />
    <title>JobSite Master | Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: { sans: ['Inter', 'sans-serif'] },
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <style>
      body { -webkit-tap-highlight-color: transparent; transition: background-color 0.3s; }

      @media print {
        @page { margin: 8mm; size: A4; }
        html, body {
          background-color: white !important;
          color: black !important;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        .no-print, button, .action-btns, .fixed { display: none !important; }
        .print-only { display: block !important; }
        .print-card {
          break-inside: avoid;
          border: 2px solid #cbd5e1 !important;
          margin-bottom: 15px;
          border-radius: 10px;
          overflow: hidden;
          page-break-inside: avoid;
          background: white !important;
        }
        .print-img-container { break-inside: avoid; page-break-inside: avoid; }
        img { max-width: 100% !important; height: auto !important; }
      }

      .img-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; margin-top: 10px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .touch-none { touch-action: none; }

      /* Canvas editor — prevent scroll bleed while pinching/drawing */
      .canvas-editor-area { touch-action: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
      }
    }
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="text/babel" data-type="module">
  import React, { useState, useEffect, useRef, useCallback } from 'react';
  import ReactDOM from 'react-dom/client';
  import { get, set } from 'idb-keyval';
  import {
    Trash2, ImageIcon, Printer, Plus, X, Hammer,
    ChevronRight, Sparkles, Pencil, Save, HardDrive, CheckCircle2, Clock,
    Moon, Sun, Edit3, Undo, RefreshCcw, Move, ZoomIn, Check
  } from 'lucide-react';

  const DB_KEY = 'jobsite-master-v3';

  // ─── Time Parsing Utilities ────────────────────────────────────────────────
  // Accepts: "2h 30m", "2h30m", "2.5h", "2.5", "90m", "90 min", "2", "1h"
  const parseTimeToMinutes = (str) => {
    if (!str) return 0;
    const s = str.toLowerCase().trim();
    const hMatch = s.match(/(\d+\.?\d*)\s*h/);
    const mMatch = s.match(/(\d+\.?\d*)\s*m/);
    if (!hMatch && !mMatch) {
      // bare number → assume hours
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n * 60;
    }
    return (hMatch ? parseFloat(hMatch[1]) * 60 : 0) + (mMatch ? parseFloat(mMatch[1]) : 0);
  };

  const formatMinutes = (totalMins) => {
    const h = Math.floor(totalMins / 60);
    const m = Math.round(totalMins % 60);
    if (h === 0) return `${m}m`;
    if (m === 0) return `${h}h`;
    return `${h}h ${m}m`;
  };
  // ──────────────────────────────────────────────────────────────────────────

  const TEMPLATES = {
    quote: {
      painting_interior: { title: "Interior Painting", materials: "Paint, Primer, Drop Sheets, Painter's Tape, Filler", tools: "Brushes, Rollers, Extension Poles, Sandpaper", desc: "Surface prep, fill holes, prime and 2 finish coats" },
      painting_exterior: { title: "Exterior Painting", materials: "Exterior Paint, Primer, Weatherproof Filler, Drop Sheets", tools: "Pressure Washer, Scrapers, Brushes, Rollers, Ladders", desc: "Pressure wash, scrape, repair, prime and 2 coats" },
      drywall_repair: { title: "Drywall/Gyprock Repair", materials: "Plasterboard, Joint Compound, Mesh Tape, Sandpaper, Paint", tools: "Utility Knife, Trowels, Sanding Block, Drywall Saw", desc: "Cut damaged section, install new board, tape, compound, sand and paint" },
      deck_build: { title: "Deck Construction", materials: "Treated Pine/Hardwood Decking, Joists, Posts, Concrete, Screws", tools: "Circular Saw, Drill, Level, Post Hole Digger, String Line", desc: "Site prep, post installation, frame build, decking installation" },
      laminate_flooring: { title: "Laminate/Vinyl Flooring", materials: "Laminate/Vinyl Planks, Underlay, Skirting Boards, Adhesive", tools: "Jigsaw, Spacers, Tapping Block, Pull Bar, Measuring Tape", desc: "Remove old flooring, level subfloor, install underlay and planks" },
      fencing: { title: "Fence Installation", materials: "Timber Palings/Colorbond, Steel/Timber Posts, Concrete, Rails, Screws", tools: "Post Hole Digger, Level, String Line, Power Drill, Saw", desc: "Mark line, dig holes, set posts in concrete, install rails and palings" },
      pressure_washing: { title: "Pressure Washing", materials: "Industrial Degreaser, Surface Cleaner Solution", tools: "Petrol Pressure Washer, Turbo Nozzle, Surface Cleaner", desc: "Deep clean driveways, paths, decks, exteriors, remove mould" },
      general_repairs: { title: "General Repairs", materials: "Various (depends on scope)", tools: "Basic Hand Tools, Power Tools as Required", desc: "Multiple small tasks - adjustments, hole filling, minor fixes" }
    },
    handover: {
      painting_interior: { title: "Interior Painting", materials: "N/A", tools: "No delays", desc: "All surfaces painted to specification. Touch-up paint provided to client." },
      deck_build: { title: "Deck Construction", materials: "N/A", tools: "No delays", desc: "Deck construction complete. All safety checks passed. Client briefed on maintenance." },
      pressure_washing: { title: "Pressure Washing", materials: "N/A", tools: "No delays", desc: "All surfaces cleaned. Water run-off managed. Area left clean and dry." },
      general_repairs: { title: "General Repairs", materials: "N/A", tools: "No delays", desc: "All repair items completed as per quote. Work area cleaned." },
      cleanup: { title: "Site Cleanup", materials: "Cleaning supplies", tools: "Minor weather delay", desc: "Site cleaned of all debris. Surfaces wiped down. Client access restored." }
    }
  };

  const compressImage = (file) => {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (event) => {
        const img = new Image();
        img.src = event.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 600;
          let width = img.width;
          let height = img.height;
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/webp', 0.6));
        };
      };
    });
  };

  const App = () => {
    const [jobs, setJobs] = useState([]);
    const [activeJobId, setActiveJobId] = useState(null);
    const [viewMode, setViewMode] = useState('dashboard');
    const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
    const [editingTaskId, setEditingTaskId] = useState(null);
    const [dbSize, setDbSize] = useState('0 MB');
    const [taskData, setTaskData] = useState({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });
    const [isDarkMode, setIsDarkMode] = useState(() => localStorage.getItem('theme') === 'dark');

    // ── Editable Header State ────────────────────────────────────────────────
    const [isEditingHeader, setIsEditingHeader] = useState(false);
    const [headerDraft, setHeaderDraft] = useState({ address: '', clientName: '' });
    // ────────────────────────────────────────────────────────────────────────

    // ── Canvas Editor State ──────────────────────────────────────────────────
    const [editingImageIdx, setEditingImageIdx] = useState(null);
    const canvasRef = useRef(null);
    const [isDrawing, setIsDrawing] = useState(false);
    const [penColor, setPenColor] = useState('#ef4444');
    const [undoStack, setUndoStack] = useState([]);

    // Pinch-zoom / pan state
    const [canvasZoom, setCanvasZoom] = useState(1);
    const [canvasPan, setCanvasPan] = useState({ x: 0, y: 0 });
    const [canvasMode, setCanvasMode] = useState('draw'); // 'draw' | 'pan'
    // Refs keep latest values accessible inside event handlers without stale closures
    const zoomRef = useRef(1);
    const panRef = useRef({ x: 0, y: 0 });
    const canvasModeRef = useRef('draw');
    const isDrawingRef = useRef(false);
    const pinchRef = useRef(null);   // { dist, zoom, panX, panY }
    const panStartRef = useRef(null); // { clientX, clientY, panX, panY }
    // ────────────────────────────────────────────────────────────────────────

    const colors = [
      { hex: '#ef4444', name: 'Red' },
      { hex: '#22c55e', name: 'Green' },
      { hex: '#eab308', name: 'Yellow' },
      { hex: '#ffffff', name: 'White' },
      { hex: '#000000', name: 'Black' }
    ];

    useEffect(() => { loadJobs(); }, []);

    useEffect(() => {
      const root = document.documentElement;
      if (isDarkMode) {
        root.classList.add('dark');
        document.getElementById('theme-color-meta').setAttribute('content', '#020617');
        localStorage.setItem('theme', 'dark');
      } else {
        root.classList.remove('dark');
        document.getElementById('theme-color-meta').setAttribute('content', '#0f172a');
        localStorage.setItem('theme', 'light');
      }
    }, [isDarkMode]);

    // Keep zoom/pan/mode refs in sync with state
    useEffect(() => { zoomRef.current = canvasZoom; }, [canvasZoom]);
    useEffect(() => { panRef.current = canvasPan; }, [canvasPan]);
    useEffect(() => { canvasModeRef.current = canvasMode; }, [canvasMode]);
    useEffect(() => { isDrawingRef.current = isDrawing; }, [isDrawing]);

    const loadJobs = async () => {
      const data = await get(DB_KEY) || [];
      setJobs(data);
      updateStorageMetric(data);
    };

    const updateStorageMetric = (data) => {
      const string = JSON.stringify(data);
      const size = (new TextEncoder().encode(string).length / 1024 / 1024).toFixed(2);
      setDbSize(`${size} MB`);
    };

    const saveToDB = (newJobs) => { setJobs(newJobs); set(DB_KEY, newJobs); updateStorageMetric(newJobs); };

    const activeJob = jobs.find(j => j.id === activeJobId);

    // ── Fixed aggregation using robust parser ────────────────────────────────
    const getAggregatedTotals = (tasks) => {
      const totalMins = (tasks || []).reduce((acc, t) => acc + parseTimeToMinutes(t.time), 0);
      return { totalMins, string: formatMinutes(totalMins) };
    };
    // ────────────────────────────────────────────────────────────────────────

    const createNewJob = (type) => {
      const label = type === 'handover' ? 'Completed Works' : 'Field Report';
      const addr = prompt(`${label.toUpperCase()} - Job Address:`);
      if (!addr) return;
      const client = prompt("Client Name:");
      const newJob = { id: Date.now(), date: new Date().toISOString(), type, address: addr, clientName: client, tasks: [] };
      saveToDB([...jobs, newJob]);
    };

    // ── Editable Header Handlers ─────────────────────────────────────────────
    const startEditingHeader = () => {
      setHeaderDraft({ address: activeJob.address, clientName: activeJob.clientName });
      setIsEditingHeader(true);
    };

    const saveHeaderEdit = () => {
      if (!headerDraft.address.trim()) return;
      saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, address: headerDraft.address.trim(), clientName: headerDraft.clientName } : j));
      setIsEditingHeader(false);
    };

    const cancelHeaderEdit = () => {
      setIsEditingHeader(false);
    };
    // ────────────────────────────────────────────────────────────────────────

    const handleSaveTask = () => {
      if (!taskData.title) return alert("Title Required");
      const updatedTasks = editingTaskId
        ? activeJob.tasks.map(t => t.id === editingTaskId ? { ...taskData, id: editingTaskId } : t)
        : [...activeJob.tasks, { ...taskData, id: Date.now() }];
      saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: updatedTasks } : j));
      closeTaskModal();
    };

    const closeTaskModal = () => {
      setIsTaskFormOpen(false);
      setEditingTaskId(null);
      setTaskData({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });
    };

    const handleImageUpload = async (e) => {
      const files = Array.from(e.target.files);
      const compressedStrings = await Promise.all(files.map(file => compressImage(file)));
      setTaskData(prev => ({ ...prev, images: [...prev.images, ...compressedStrings] }));
    };

    // ── Canvas setup on image open ───────────────────────────────────────────
    const resetCanvasView = () => {
      setCanvasZoom(1); zoomRef.current = 1;
      setCanvasPan({ x: 0, y: 0 }); panRef.current = { x: 0, y: 0 };
      setCanvasMode('draw'); canvasModeRef.current = 'draw';
    };

    useEffect(() => {
      if (editingImageIdx !== null && canvasRef.current) {
        resetCanvasView();
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.src = taskData.images[editingImageIdx];
        img.onload = () => {
          canvas.width = img.width;
          canvas.height = img.height;
          ctx.drawImage(img, 0, 0, img.width, img.height);
          setUndoStack([canvas.toDataURL()]);
        };
      }
    }, [editingImageIdx]);
    // ────────────────────────────────────────────────────────────────────────

    // ── Drawing helpers (work in canvas pixel space via getBoundingClientRect) ─
    const getDrawingCoords = (e) => {
      const canvas = canvasRef.current;
      const rect = canvas.getBoundingClientRect();
      // getBoundingClientRect accounts for any CSS transform on the canvas wrapper
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      let clientX = e.clientX;
      let clientY = e.clientY;
      if (e.touches && e.touches.length > 0) {
        clientX = e.touches[0].clientX;
        clientY = e.touches[0].clientY;
      }
      return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
    };

    const startDrawing = (e) => {
      setIsDrawing(true);
      isDrawingRef.current = true;
      const { x, y } = getDrawingCoords(e);
      const ctx = canvasRef.current.getContext('2d');
      ctx.strokeStyle = penColor;
      ctx.lineWidth = Math.max(3, canvasRef.current.width / 100);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(x, y);
    };

    const draw = (e) => {
      if (!isDrawingRef.current) return;
      e.preventDefault();
      const { x, y } = getDrawingCoords(e);
      const ctx = canvasRef.current.getContext('2d');
      ctx.lineTo(x, y);
      ctx.stroke();
    };

    const stopDrawing = () => {
      if (!isDrawingRef.current) return;
      setIsDrawing(false);
      isDrawingRef.current = false;
      setUndoStack(prev => [...prev, canvasRef.current.toDataURL()]);
    };

    const handleUndo = () => {
      if (undoStack.length <= 1) return;
      const newStack = [...undoStack];
      newStack.pop();
      const previousState = newStack[newStack.length - 1];
      const img = new Image();
      img.src = previousState;
      img.onload = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        setUndoStack(newStack);
      };
    };

    const handleClearCanvas = () => {
      if (undoStack.length <= 1) return;
      const baseImage = undoStack[0];
      const img = new Image();
      img.src = baseImage;
      img.onload = () => {
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        setUndoStack([baseImage]);
      };
    };

    const saveAnnotatedImage = () => {
      const updatedImage = canvasRef.current.toDataURL('image/webp', 0.8);
      const newImages = [...taskData.images];
      newImages[editingImageIdx] = updatedImage;
      setTaskData(prev => ({ ...prev, images: newImages }));
      setEditingImageIdx(null);
    };
    // ────────────────────────────────────────────────────────────────────────

    // ── Pinch-zoom / Pan touch handlers ─────────────────────────────────────
    const getTouchDist = (t1, t2) => {
      const dx = t1.clientX - t2.clientX;
      const dy = t1.clientY - t2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    };

    const handleCanvasTouchStart = (e) => {
      if (e.touches.length === 2) {
        // Abort any active draw stroke
        if (isDrawingRef.current) {
          isDrawingRef.current = false;
          setIsDrawing(false);
          // save undo state before stopping
          setUndoStack(prev => [...prev, canvasRef.current.toDataURL()]);
        }
        const dist = getTouchDist(e.touches[0], e.touches[1]);
        pinchRef.current = {
          dist,
          zoom: zoomRef.current,
          panX: panRef.current.x,
          panY: panRef.current.y,
          midX: (e.touches[0].clientX + e.touches[1].clientX) / 2,
          midY: (e.touches[0].clientY + e.touches[1].clientY) / 2,
        };
      } else if (e.touches.length === 1) {
        pinchRef.current = null;
        if (canvasModeRef.current === 'pan') {
          panStartRef.current = {
            clientX: e.touches[0].clientX,
            clientY: e.touches[0].clientY,
            panX: panRef.current.x,
            panY: panRef.current.y,
          };
        } else {
          startDrawing(e);
        }
      }
    };

    const handleCanvasTouchMove = (e) => {
      e.preventDefault();
      if (e.touches.length === 2 && pinchRef.current) {
        // ── Pinch zoom ──
        const newDist = getTouchDist(e.touches[0], e.touches[1]);
        const ratio = newDist / pinchRef.current.dist;
        const newZoom = Math.min(Math.max(pinchRef.current.zoom * ratio, 1), 6);
        setCanvasZoom(newZoom);
        zoomRef.current = newZoom;
      } else if (e.touches.length === 1) {
        if (canvasModeRef.current === 'pan' && panStartRef.current) {
          // ── Pan ──
          const dx = (e.touches[0].clientX - panStartRef.current.clientX) / zoomRef.current;
          const dy = (e.touches[0].clientY - panStartRef.current.clientY) / zoomRef.current;
          const newPan = {
            x: panStartRef.current.panX + dx,
            y: panStartRef.current.panY + dy,
          };
          setCanvasPan(newPan);
          panRef.current = newPan;
        } else if (canvasModeRef.current === 'draw') {
          // ── Draw ──
          draw(e);
        }
      }
    };

    const handleCanvasTouchEnd = (e) => {
      if (e.touches.length < 2) pinchRef.current = null;
      if (e.touches.length === 0) {
        panStartRef.current = null;
        if (canvasModeRef.current === 'draw') stopDrawing();
      }
    };

    const toggleCanvasMode = () => {
      const next = canvasModeRef.current === 'draw' ? 'pan' : 'draw';
      setCanvasMode(next);
      canvasModeRef.current = next;
    };

    const handleResetZoom = () => {
      setCanvasZoom(1); zoomRef.current = 1;
      setCanvasPan({ x: 0, y: 0 }); panRef.current = { x: 0, y: 0 };
    };
    // ────────────────────────────────────────────────────────────────────────

    // Mouse handlers for desktop — only draw, no pan complexity needed there
    const handleMouseDown = (e) => { if (canvasMode === 'draw') startDrawing(e); };
    const handleMouseMove = (e) => { if (canvasMode === 'draw') draw(e); };

    return (
      <div className="min-h-screen pb-6">
        <header className="bg-slate-900 dark:bg-slate-950 text-white p-4 no-print flex justify-between items-center shadow-lg sticky top-0 z-50 border-b border-slate-800">
          <div className="flex items-center gap-2 cursor-pointer" onClick={() => { setViewMode('dashboard'); setIsEditingHeader(false); }}>
            <div className="bg-orange-500 p-2 rounded-xl text-white shadow-inner"><Hammer size={22} /></div>
            <h1 className="font-black text-xl tracking-tight uppercase">Jobsite</h1>
          </div>
          <div className="flex items-center gap-4">
            <button onClick={() => setIsDarkMode(!isDarkMode)} className="text-slate-400 hover:text-white transition-colors">
              {isDarkMode ? <Sun size={18} /> : <Moon size={18} />}
            </button>
            <div className="flex items-center gap-1 text-slate-500 text-[10px] font-black uppercase tracking-widest bg-slate-800 dark:bg-slate-900 px-2 py-1 rounded-lg border border-slate-700">
              <HardDrive size={12} className={parseFloat(dbSize) > 4 ? "text-red-400" : "text-emerald-400"} /> {dbSize}
            </div>
            {viewMode === 'detail' && (
              <button onClick={() => window.print()} className="bg-white dark:bg-slate-800 text-slate-900 dark:text-white px-4 py-2 rounded-xl text-xs font-black flex items-center gap-2 uppercase shadow-sm active:scale-95">
                <Printer size={16} /> Print
              </button>
            )}
          </div>
        </header>

        {viewMode === 'dashboard' ? (
          <main className="p-4 max-w-2xl mx-auto">
            <div className="mb-8">
              <h2 className="text-2xl font-black text-slate-800 dark:text-slate-100 tracking-tight mb-4 uppercase">Projects</h2>
              <div className="grid grid-cols-2 gap-3">
                <button onClick={() => createNewJob('quote')} className="bg-white dark:bg-slate-800 border-2 border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white p-4 rounded-3xl text-xs font-black shadow-sm flex flex-col items-center gap-2 active:scale-95 transition-all uppercase hover:border-orange-500 dark:hover:border-orange-500">
                  <Plus size={24} className="text-orange-500" /> New Quote
                </button>
                <button onClick={() => createNewJob('handover')} className="bg-slate-900 dark:bg-emerald-950 text-white p-4 rounded-3xl text-xs font-black shadow-lg flex flex-col items-center gap-2 active:scale-95 transition-all uppercase border-2 border-slate-900 dark:border-emerald-900 hover:border-emerald-400">
                  <CheckCircle2 size={24} className="text-emerald-400" /> Completed Job
                </button>
              </div>
            </div>

            <div className="grid gap-4">
              {jobs.sort((a, b) => b.id - a.id).map(j => (
                <div key={j.id} onClick={() => { setActiveJobId(j.id); setViewMode('detail'); setIsEditingHeader(false); }} className={`bg-white dark:bg-slate-800 p-6 rounded-[2rem] border-2 transition-all cursor-pointer flex justify-between items-center shadow-sm ${j.type === 'handover' ? 'border-emerald-100 dark:border-emerald-900/30 hover:border-emerald-500' : 'border-slate-100 dark:border-slate-700 hover:border-orange-500'}`}>
                  <div className="flex-1">
                    <span className={`text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-widest ${j.type === 'handover' ? 'bg-emerald-100 dark:bg-emerald-900 text-emerald-600 dark:text-emerald-300' : 'bg-orange-100 dark:bg-orange-900 text-orange-600 dark:text-orange-300'}`}>
                      {j.type === 'handover' ? 'Completed Works' : 'Field Report'}
                    </span>
                    <p className="font-black text-slate-900 dark:text-white text-lg mt-1 truncate max-w-[200px]">{j.address}</p>
                    <p className="text-slate-400 dark:text-slate-500 text-xs font-medium mt-1">{j.date ? new Date(j.date).toLocaleDateString() : 'No date'}</p>
                  </div>
                  <div className="text-right flex items-center gap-4">
                    <div className="flex flex-col items-end">
                      <span className="text-[10px] font-black text-slate-400 uppercase">Total Hours</span>
                      <span className="font-black text-slate-900 dark:text-slate-200">{getAggregatedTotals(j.tasks).string}</span>
                    </div>
                    <ChevronRight size={20} className="text-slate-300 dark:text-slate-600" />
                  </div>
                </div>
              ))}
              {jobs.length === 0 && <div className="text-center py-10 text-slate-400 text-sm font-bold uppercase tracking-widest">No Projects Found</div>}
            </div>
          </main>
        ) : (
          <main className="p-4 max-w-2xl mx-auto no-print">
            <div className="flex justify-between items-center mb-6">
              <button onClick={() => { setViewMode('dashboard'); setIsEditingHeader(false); }} className="text-slate-400 dark:text-slate-500 font-bold text-xs flex items-center gap-1 uppercase tracking-widest hover:text-slate-600 dark:hover:text-slate-300">
                <ChevronRight size={14} className="rotate-180" /> Dashboard
              </button>
              <button onClick={() => { if (confirm("Permanently delete project?")) { saveToDB(jobs.filter(x => x.id !== activeJobId)); setViewMode('dashboard'); } }} className="text-red-400 hover:text-red-600 flex items-center gap-1 text-[10px] font-black uppercase">
                <Trash2 size={14} /> Delete
              </button>
            </div>

            {/* ── Editable Job Header Card ───────────────────────────────── */}
            <div className={`p-8 rounded-[2.5rem] border shadow-sm mb-8 relative overflow-hidden bg-white dark:bg-slate-800 ${activeJob?.type === 'handover' ? 'border-emerald-200 dark:border-emerald-900/50' : 'border-slate-200 dark:border-slate-700'}`}>
              {isEditingHeader ? (
                <div className="relative z-10">
                  <div className="flex items-center gap-2 mb-3">
                    <Edit3 size={14} className="text-orange-500" />
                    <span className="text-[10px] font-black text-orange-500 uppercase tracking-widest">Editing Job Details</span>
                  </div>
                  <input
                    className="w-full text-2xl font-black bg-slate-50 dark:bg-slate-700 rounded-2xl px-4 py-3 mb-3 outline-none focus:ring-2 focus:ring-orange-400 dark:text-white"
                    placeholder="Job Address"
                    value={headerDraft.address}
                    onChange={e => setHeaderDraft(d => ({ ...d, address: e.target.value }))}
                  />
                  <input
                    className="w-full font-bold bg-slate-50 dark:bg-slate-700 rounded-2xl px-4 py-3 mb-4 outline-none focus:ring-2 focus:ring-orange-400 dark:text-white text-slate-600 dark:text-slate-300"
                    placeholder="Client Name"
                    value={headerDraft.clientName}
                    onChange={e => setHeaderDraft(d => ({ ...d, clientName: e.target.value }))}
                  />
                  <div className="flex gap-3">
                    <button onClick={saveHeaderEdit} className="flex-1 bg-orange-500 hover:bg-orange-400 text-white py-3 rounded-2xl font-black text-sm flex items-center justify-center gap-2 transition-colors">
                      <Check size={16} /> Save Changes
                    </button>
                    <button onClick={cancelHeaderEdit} className="px-6 bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-300 py-3 rounded-2xl font-black text-sm transition-colors">
                      Cancel
                    </button>
                  </div>
                </div>
              ) : (
                <div className="flex justify-between items-start relative z-10">
                  <div className="flex-1 min-w-0 mr-4">
                    <h2 className="text-3xl font-black text-slate-900 dark:text-white leading-tight truncate">{activeJob?.address}</h2>
                    <p className="text-slate-500 dark:text-slate-400 font-bold uppercase tracking-widest text-sm mt-1">{activeJob?.clientName}</p>
                    {/* Tap to edit hint */}
                    <button
                      onClick={startEditingHeader}
                      className="mt-3 flex items-center gap-1.5 text-[10px] font-black text-slate-400 hover:text-orange-500 dark:hover:text-orange-400 uppercase tracking-widest transition-colors group"
                    >
                      <Pencil size={11} className="group-hover:text-orange-500 transition-colors" />
                      Edit Details
                    </button>
                  </div>
                  <div className="bg-slate-900 dark:bg-slate-950 text-white p-4 rounded-2xl flex flex-col items-center min-w-[100px] shadow-lg border-b-4 border-orange-500 flex-shrink-0">
                    <Clock size={16} className="mb-1 text-orange-500" />
                    <span className="text-[10px] font-black uppercase text-slate-400">Total Hours</span>
                    <span className="text-xl font-black">{getAggregatedTotals(activeJob?.tasks || []).string}</span>
                  </div>
                </div>
              )}
            </div>
            {/* ─────────────────────────────────────────────────────────── */}

            <div className="space-y-6 mb-32">
              {activeJob?.tasks.map((t, i) => (
                <div key={t.id} className="bg-white dark:bg-slate-800 rounded-3xl border border-slate-200 dark:border-slate-700 overflow-hidden shadow-sm">
                  <div className="bg-slate-50 dark:bg-slate-800/50 p-4 border-b dark:border-slate-700 flex justify-between items-center px-6">
                    <span className="font-black text-slate-400 dark:text-slate-500 text-[10px] tracking-widest uppercase">Entry #{i + 1}</span>
                    <div className="flex gap-2">
                      <button onClick={() => { setEditingTaskId(t.id); setTaskData(t); setIsTaskFormOpen(true); }} className="p-2 text-slate-400 hover:text-blue-500"><Pencil size={18} /></button>
                      <button onClick={() => { if (confirm("Delete log?")) saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: j.tasks.filter(tk => tk.id !== t.id) } : j)); }} className="p-2 text-slate-400 hover:text-red-500"><Trash2 size={18} /></button>
                    </div>
                  </div>
                  <div className="p-6">
                    <div className="flex justify-between items-start mb-2">
                      <h3 className="font-black text-xl text-slate-900 dark:text-white">{t.title}</h3>
                      <span className="bg-orange-100 dark:bg-orange-900/40 text-orange-700 dark:text-orange-400 px-3 py-1 rounded-full text-xs font-black ml-2 flex-shrink-0">{t.time}</span>
                    </div>
                    <p className="text-slate-500 dark:text-slate-400 text-sm leading-relaxed mb-4">{t.desc}</p>
                    {t.images?.length > 0 && (
                      <div className="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                        {t.images.map((img, idx) => (
                          <div key={idx} className="h-24 w-32 flex-shrink-0">
                            <img src={img} className="w-full h-full object-cover rounded-xl border dark:border-slate-600 shadow-sm aspect-[4/3]" />
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>
              ))}
              {activeJob?.tasks.length === 0 && <div className="text-center py-20 text-slate-300 dark:text-slate-700 font-black uppercase tracking-widest">No Log Entries Yet</div>}
            </div>

            <button onClick={() => setIsTaskFormOpen(true)} className={`fixed bottom-8 right-8 text-white w-20 h-20 rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-all z-40 border-4 border-white dark:border-slate-800 ${activeJob?.type === 'handover' ? 'bg-emerald-600' : 'bg-slate-900 dark:bg-slate-700'}`}>
              <Plus size={40} />
            </button>
          </main>
        )}

        {/* ── Task Form Modal ─────────────────────────────────────────────── */}
        {isTaskFormOpen && (
          <div className="fixed inset-0 z-[100] bg-slate-900/90 dark:bg-slate-950/95 backdrop-blur-md p-4 overflow-y-auto">
            <div className="bg-white dark:bg-slate-900 rounded-[3rem] max-w-md mx-auto p-8 shadow-2xl mt-4 border dark:border-slate-800">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-2xl font-black text-slate-900 dark:text-white">{editingTaskId ? 'Edit' : 'New'} {activeJob?.type === 'handover' ? 'Works Record' : 'Report Entry'}</h2>
                <button onClick={closeTaskModal} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-white transition-colors"><X size={20} /></button>
              </div>

              <div className="mb-6">
                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Quick Templates</label>
                <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                  {Object.keys(TEMPLATES[activeJob.type] || {}).map(key => (
                    <button key={key} onClick={() => setTaskData({ ...taskData, ...TEMPLATES[activeJob.type][key] })} className="whitespace-nowrap bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 px-4 py-2 rounded-2xl text-[12px] font-black text-slate-700 dark:text-slate-300 uppercase tracking-widest hover:border-orange-500 dark:hover:border-orange-500 transition-all">
                      <Sparkles size={14} className="inline mr-1 text-orange-500" /> {key.replace('_', ' ')}
                    </button>
                  ))}
                </div>
              </div>

              <div className="space-y-4">
                <input placeholder="Task / Item Title" className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none font-bold dark:text-white dark:placeholder-slate-500" value={taskData.title} onChange={e => setTaskData({ ...taskData, title: e.target.value })} />

                <div className="flex gap-4">
                  <div className="w-32 relative">
                    <input
                      placeholder="e.g. 2h 30m"
                      className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none font-black text-center dark:text-white dark:placeholder-slate-500 text-sm"
                      value={taskData.time}
                      onChange={e => setTaskData({ ...taskData, time: e.target.value })}
                    />
                    {/* Live parse preview */}
                    {taskData.time ? (
                      <div className="absolute -bottom-5 left-0 right-0 text-center text-[9px] text-orange-500 font-black">
                        = {formatMinutes(parseTimeToMinutes(taskData.time))}
                      </div>
                    ) : null}
                  </div>
                  <label className="flex-1 bg-slate-100 dark:bg-slate-800 p-4 rounded-2xl cursor-pointer flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                    <ImageIcon className="text-slate-600 dark:text-slate-400 mr-2" />
                    <span className="text-xs font-black text-slate-500 dark:text-slate-300 uppercase">Photos</span>
                    <input type="file" multiple accept="image/*" capture="environment" className="hidden" onChange={handleImageUpload} />
                  </label>
                </div>

                {taskData.images.length > 0 && (
                  <div className="mt-6 img-preview-grid">
                    {taskData.images.map((img, i) => (
                      <div key={i} className="relative w-full aspect-[4/3] group cursor-pointer" onClick={() => setEditingImageIdx(i)}>
                        <img src={img} className="w-full h-full object-cover rounded-xl border dark:border-slate-700 shadow-sm" />
                        <div className="absolute inset-0 bg-slate-900/50 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                          <Edit3 className="text-white drop-shadow-md" size={24} />
                        </div>
                        <button onClick={(e) => { e.stopPropagation(); setTaskData(p => ({ ...p, images: p.images.filter((_, idx) => idx !== i) })); }} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md hover:scale-110 transition-transform z-10"><X size={12} /></button>
                      </div>
                    ))}
                    <div className="col-span-full text-[10px] text-center text-slate-400 font-bold uppercase mt-1">Tap photo to annotate</div>
                  </div>
                )}

                <input placeholder="Materials Used" className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none text-sm font-medium dark:text-white dark:placeholder-slate-500 mt-2" value={taskData.materials} onChange={e => setTaskData({ ...taskData, materials: e.target.value })} />

                <input
                  placeholder={activeJob?.type === 'handover' ? "Notes / Delays" : "Tools Used"}
                  className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none text-sm font-medium border-l-4 border-slate-300 dark:border-slate-600 dark:text-white dark:placeholder-slate-500"
                  value={taskData.tools}
                  onChange={e => setTaskData({ ...taskData, tools: e.target.value })}
                />

                <textarea
                  placeholder="Full details..."
                  className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none text-sm font-medium h-28 resize-none dark:text-white dark:placeholder-slate-500"
                  value={taskData.desc}
                  onChange={e => setTaskData({ ...taskData, desc: e.target.value })}
                />

                <button onClick={handleSaveTask} className={`w-full text-white p-5 rounded-[2rem] font-black text-lg shadow-xl flex items-center justify-center gap-2 transition-all hover:scale-[1.02] ${activeJob?.type === 'handover' ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600'}`}>
                  <Save size={20} /> SAVE ENTRY
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ── Fullscreen Canvas Editor ────────────────────────────────────── */}
        {editingImageIdx !== null && (
          <div className="fixed inset-0 z-[200] bg-slate-950 flex flex-col">
            {/* Top Bar */}
            <div className="flex justify-between items-center p-4 bg-slate-900 border-b border-slate-800 shadow-md z-10 flex-shrink-0">
              <button onClick={() => setEditingImageIdx(null)} className="text-slate-300 hover:text-white font-bold text-sm px-4 py-2">CANCEL</button>
              <div className="flex items-center gap-2 text-white text-xs font-black uppercase tracking-widest">
                <Edit3 size={14} className="text-orange-500" /> Mark Defects
              </div>
              <button onClick={saveAnnotatedImage} className="bg-orange-500 text-white font-bold text-sm px-4 py-2 rounded-xl shadow-sm">SAVE</button>
            </div>

            {/* Mode + Zoom indicators */}
            <div className="flex items-center justify-between px-4 py-2 bg-slate-900/80 border-b border-slate-800/50 flex-shrink-0">
              <div className="flex items-center gap-2">
                <div className={`flex items-center gap-1.5 text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-full ${canvasMode === 'draw' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/40' : 'bg-blue-500/20 text-blue-400 border border-blue-500/40'}`}>
                  {canvasMode === 'draw' ? <Pencil size={11} /> : <Move size={11} />}
                  {canvasMode === 'draw' ? 'Draw mode' : 'Pan mode'}
                </div>
                {canvasZoom > 1 && (
                  <div className="text-[10px] font-black text-slate-500 uppercase">
                    {canvasZoom.toFixed(1)}×
                  </div>
                )}
              </div>
              <div className="text-[10px] font-black text-slate-600 uppercase tracking-widest">
                Pinch to zoom · 2 fingers
              </div>
            </div>

            {/* Canvas Area — overflow hidden so zoomed canvas clips cleanly */}
            <div className="flex-1 overflow-hidden relative flex items-center justify-center bg-slate-950 canvas-editor-area">
              {/* Transform wrapper — getBoundingClientRect on canvas accounts for this automatically */}
              <div
                style={{
                  transform: `translate(${canvasPan.x}px, ${canvasPan.y}px) scale(${canvasZoom})`,
                  transformOrigin: 'center center',
                  transition: 'none',
                  willChange: 'transform',
                }}
              >
                <canvas
                  ref={canvasRef}
                  onMouseDown={handleMouseDown}
                  onMouseMove={handleMouseMove}
                  onMouseUp={stopDrawing}
                  onMouseLeave={stopDrawing}
                  onTouchStart={handleCanvasTouchStart}
                  onTouchMove={handleCanvasTouchMove}
                  onTouchEnd={handleCanvasTouchEnd}
                  className="max-w-full max-h-full object-contain shadow-2xl"
                  style={{ cursor: canvasMode === 'draw' ? 'crosshair' : 'grab', display: 'block' }}
                />
              </div>
            </div>

            {/* Bottom Toolbar */}
            <div className="bg-slate-900 border-t border-slate-800 p-4 z-10 flex-shrink-0">
              <div className="flex justify-between items-center">
                {/* Color picker */}
                <div className="flex gap-3 items-center">
                  {colors.map(c => (
                    <button
                      key={c.name}
                      onClick={() => setPenColor(c.hex)}
                      className={`w-8 h-8 rounded-full shadow-inner transition-transform ${penColor === c.hex ? 'scale-125 ring-2 ring-white ring-offset-1 ring-offset-slate-900' : 'opacity-70 hover:opacity-100'}`}
                      style={{ backgroundColor: c.hex }}
                      title={c.name}
                    />
                  ))}
                </div>

                {/* Right side controls */}
                <div className="flex items-center gap-3">
                  {/* Draw / Pan toggle */}
                  <button
                    onClick={toggleCanvasMode}
                    className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase transition-colors px-3 py-2 rounded-xl ${canvasMode === 'pan' ? 'bg-blue-500/20 text-blue-400' : 'text-slate-400 hover:text-white'}`}
                  >
                    {canvasMode === 'draw' ? <Move size={20} /> : <Pencil size={20} />}
                    {canvasMode === 'draw' ? 'Pan' : 'Draw'}
                  </button>

                  {/* Reset Zoom */}
                  {canvasZoom > 1 && (
                    <button
                      onClick={handleResetZoom}
                      className="flex flex-col items-center gap-1 text-[10px] font-black uppercase text-slate-400 hover:text-white transition-colors"
                    >
                      <ZoomIn size={20} />
                      Reset
                    </button>
                  )}

                  {/* Undo */}
                  <button
                    onClick={handleUndo}
                    disabled={undoStack.length <= 1}
                    className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase ${undoStack.length <= 1 ? 'text-slate-700' : 'text-slate-300 hover:text-white'}`}
                  >
                    <Undo size={20} /> Undo
                  </button>

                  {/* Clear */}
                  <button
                    onClick={handleClearCanvas}
                    disabled={undoStack.length <= 1}
                    className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase ${undoStack.length <= 1 ? 'text-slate-700' : 'text-red-400 hover:text-red-300'}`}
                  >
                    <RefreshCcw size={20} /> Clear
                  </button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ── Print View ──────────────────────────────────────────────────── */}
        {activeJob && (
          <div className="print-only hidden p-4">
            <div className={`border-b-[8px] pb-4 mb-4 flex justify-between items-end ${activeJob.type === 'handover' ? 'border-emerald-500 print:border-emerald-500' : 'border-orange-500 print:border-orange-500'}`}>
              <div>
                <h1 className="text-4xl font-black tracking-tighter uppercase leading-none">
                  {activeJob.type === 'handover' ? 'Completed Works' : 'Field Report'}
                </h1>
                <p className="text-slate-400 font-black text-xs uppercase tracking-widest mt-2">
                  {activeJob.date ? new Date(activeJob.date).toLocaleDateString('en-AU', { dateStyle: 'full' }) : new Date().toLocaleDateString('en-AU', { dateStyle: 'full' })}
                </p>
              </div>
              <div className="text-right">
                <p className="text-2xl font-black text-slate-900 uppercase">{activeJob.address}</p>
                <p className="text-slate-500 font-bold text-sm">CLIENT: {activeJob.clientName}</p>
                <p className="text-slate-500 font-bold text-sm">TOTAL TIME: {getAggregatedTotals(activeJob.tasks).string}</p>
              </div>
            </div>

            {activeJob.tasks.map((t, idx) => (
              <div key={t.id} className="print-card">
                <div className={`px-5 py-3 font-black border-b flex justify-between items-center text-lg uppercase ${activeJob.type === 'handover' ? 'bg-emerald-50 text-emerald-800 border-emerald-200' : 'bg-slate-50 text-slate-800 border-slate-200'}`}>
                  <span>{idx + 1}. {t.title}</span>
                  <span className="text-sm">{t.time}</span>
                </div>
                <div className="p-6">
                  <p className="text-[14px] text-slate-700 mb-6 leading-relaxed border-l-4 border-slate-200 pl-4 italic font-medium">"{t.desc}"</p>
                  <div className="grid grid-cols-2 gap-4 mb-4">
                    <div className="p-4 bg-slate-50 rounded-xl border">
                      <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Materials</label>
                      <span className="text-[12px] font-bold text-slate-600 uppercase leading-tight">{t.materials || 'None'}</span>
                    </div>
                    <div className="p-4 bg-slate-50 rounded-xl border">
                      <label className="text-[10px] font-black uppercase text-slate-400 block mb-1">
                        {activeJob.type === 'handover' ? 'Notes/Delays' : 'Tools Used'}
                      </label>
                      <span className="text-[12px] font-bold text-slate-600 uppercase leading-tight">{t.tools || 'None'}</span>
                    </div>
                  </div>
                  {t.images?.length > 0 && (
                    <div className="grid grid-cols-3 gap-3 print-img-container">
                      {t.images.map((img, i) => (
                        <div key={i} className="rounded-lg overflow-hidden border aspect-[4/3] shadow-sm bg-slate-100">
                          <img src={img} className="w-full h-full object-cover" />
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
