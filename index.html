<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Professional JobSite Log & Estimate Creator" />
    
    <!-- Favicon -->
    <link rel="icon" href="https://cdn.jsdelivr.net/npm/lucide-static@0.344.0/icons/hammer.svg" type="image/svg+xml">

    <!-- iOS / PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JobSite Log" />

    <title>JobSite Log | Estimator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>

    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f1f5f9;
        overscroll-behavior-y: none;
      }
      /* Hide scrollbar for clean UI */
      .custom-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .custom-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* --- PRINT STYLING --- */
      @media print {
        @page {
          margin: 10mm;
          size: A4;
        }
        body {
          background-color: white;
          color: black;
          -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important;
        }
        
        /* Hide UI Elements */
        .no-print, header, .print-hidden { 
          display: none !important; 
        }
        
        /* Show Print Elements */
        .print-only { 
          display: block !important; 
        }
        
        /* Ensure cards don't get cut in half */
        .task-card { 
          break-inside: avoid; 
          page-break-inside: avoid;
          border: 1px solid #ccc !important;
          box-shadow: none !important;
          margin-bottom: 20px !important;
        }

        /* Ensure images print clearly */
        img {
          print-color-adjust: exact;
        }
      }
    </style>

    <!-- Import Map -->
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- MAIN APP CODE -->
    <script type="text/babel" data-type="module">
      import React, { useState, useEffect, useRef, useMemo } from 'react';
      import ReactDOM from 'react-dom/client';
      import { 
        Clock, Trash2, Package, Wrench, ImageIcon, 
        Download, Printer, FileText, 
        Plus, X, Save, Hammer, Clipboard, ArrowLeft, MapPin, HardHat, AlertTriangle, 
        Calendar, ChevronRight, ClipboardList, Pencil, SaveAll, UploadCloud
      } from 'lucide-react';

      // --- HELPERS ---
      const calculateStats = (tasks) => {
        let totalMinutes = 0;
        const allMaterials = [];
        const toolsSet = new Set();

        tasks.forEach(t => {
          // Time
          if (t.estimatedTime) {
            const timeStr = t.estimatedTime.toLowerCase().trim();
            let minutes = 0;
            const hoursMatch = timeStr.match(/(\d+(\.\d+)?)\s*(h|hr|hour)/);
            const minsMatch = timeStr.match(/(\d+)\s*(m|min)/);

            if (hoursMatch) minutes += parseFloat(hoursMatch[1]) * 60;
            if (minsMatch) minutes += parseInt(minsMatch[1], 10);
            if (!hoursMatch && !minsMatch) {
              const val = parseFloat(timeStr);
              if (!isNaN(val)) minutes += val * 60;
            }
            totalMinutes += minutes;
          }
          // Materials (allow duplicates)
          t.materials.forEach(m => allMaterials.push(m));
          // Tools (unique)
          t.tools.forEach(tool => toolsSet.add(tool));
        });

        return {
          totalMinutes,
          allMaterials: allMaterials.sort(),
          allTools: Array.from(toolsSet).sort()
        };
      };

      const formatTime = (minutes) => {
        if (minutes === 0) return "TBD";
        const h = Math.floor(minutes / 60);
        const m = Math.round(minutes % 60);
        if (h > 0 && m > 0) return `${h}h ${m}m`;
        if (h > 0) return `${h}h`;
        return `${m}m`;
      };

      // --- COMPONENTS ---

      // 1. TaskCard
      const TaskCard = ({ task, index, onDelete, onEdit }) => {
        const images = task.imageUrls || [];

        const handleDelete = (e) => { e.stopPropagation(); onDelete(task.id); };
        const handleEdit = (e) => { e.stopPropagation(); onEdit(task); };

        return (
          <div className="task-card group bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden transition-all duration-200 hover:border-orange-300 hover:shadow-md">
            {images.length > 0 && (
              <div className={`w-full bg-slate-100 border-b border-slate-100 relative overflow-hidden ${images.length > 1 ? 'grid grid-cols-2 gap-0.5' : ''}`}>
                  {images.map((url, idx) => (
                    <div key={idx} className={`relative ${images.length === 1 ? 'h-64 w-full' : images.length === 2 ? 'h-48 w-full' : images.length === 3 && idx === 0 ? 'h-48 col-span-2' : 'h-40 w-full'}`}>
                      <img src={url} alt={`Photo ${idx + 1}`} className="w-full h-full object-cover"/>
                    </div>
                  ))}
              </div>
            )}
            <div className="p-5">
              <div className="flex items-start justify-between mb-3 gap-3">
                <div className="flex items-start gap-3 flex-1">
                  <div className="mt-1 flex-shrink-0 h-8 w-8 rounded-lg bg-slate-900 text-white flex items-center justify-center font-bold text-sm print:bg-black print:text-white print:border print:border-black">#{index + 1}</div>
                  <div className="flex-1 min-w-0">
                    <h3 className="font-bold text-lg leading-tight text-slate-900 print:text-black">{task.title}</h3>
                    {task.estimatedTime && (
                      <div className="flex items-center gap-1 bg-slate-100 px-2 py-0.5 rounded text-xs font-medium w-fit mt-1 print:bg-white print:border print:border-gray-300">
                        <Clock size={12} /><span>Est: {task.estimatedTime}</span>
                      </div>
                    )}
                  </div>
                </div>
                <div className="flex items-center gap-2 opacity-100 sm:opacity-0 group-hover:opacity-100 transition-opacity no-print">
                  <button onClick={handleEdit} className="text-white bg-blue-500 p-2 rounded-lg hover:bg-blue-600 shadow-sm"><Pencil size={18} /></button>
                  <button onClick={handleDelete} className="text-white bg-red-500 p-2 rounded-lg hover:bg-red-600 shadow-sm"><Trash2 size={18} /></button>
                </div>
              </div>
              {task.description && <p className="text-slate-600 text-sm mb-4 whitespace-pre-wrap print:text-black">{task.description}</p>}
              {(task.materials.length > 0 || task.tools.length > 0) && (
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 pt-3 border-t border-slate-100 print:grid-cols-2 print:border-gray-200">
                  {task.materials.length > 0 && (
                    <div>
                      <div className="flex items-center gap-1.5 mb-1.5 text-xs font-bold text-slate-500 uppercase tracking-wider print:text-black"><Package size={12} /><span>Materials</span></div>
                      <ul className="list-disc list-inside text-sm text-slate-700 leading-relaxed print:text-black">{task.materials.map((item, idx) => <li key={idx} className="truncate marker:text-orange-300 print:marker:text-black">{item}</li>)}</ul>
                    </div>
                  )}
                  {task.tools.length > 0 && (
                    <div>
                      <div className="flex items-center gap-1.5 mb-1.5 text-xs font-bold text-slate-500 uppercase tracking-wider print:text-black"><Wrench size={12} /><span>Tools</span></div>
                      <ul className="list-disc list-inside text-sm text-slate-700 leading-relaxed print:text-black">{task.tools.map((item, idx) => <li key={idx} className="truncate marker:text-blue-300 print:marker:text-black">{item}</li>)}</ul>
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      };

      // 2. JobProjectCard
      const JobProjectCard = ({ job, onClick, onDelete }) => {
        const totalTasks = job.tasks.length;
        return (
          <div onClick={() => onClick(job.id)} className="group bg-white rounded-xl shadow-sm border border-slate-200 hover:border-orange-400 hover:shadow-md transition-all duration-200 cursor-pointer relative overflow-hidden">
            <div className="p-6">
              <div className="flex justify-between items-start mb-4">
                <div className="flex items-start gap-3">
                  <div className="bg-slate-100 p-3 rounded-lg group-hover:bg-orange-50 transition-colors">
                    <MapPin className="text-slate-600 group-hover:text-orange-600" size={24} />
                  </div>
                  <div>
                    <h3 className="font-bold text-lg text-slate-900 leading-tight group-hover:text-orange-600 transition-colors">{job.address}</h3>
                    {job.clientName && <p className="text-sm text-slate-500">{job.clientName}</p>}
                    <div className="flex items-center gap-2 mt-2 text-xs text-slate-400">
                      <Calendar size={12} /><span>{new Date(job.updatedAt).toLocaleDateString()}</span>
                    </div>
                  </div>
                </div>
                <button onClick={(e) => onDelete(job.id, e)} className="text-slate-400 hover:text-red-600 p-2 hover:bg-red-50 rounded-full transition-colors z-10"><Trash2 size={20} /></button>
              </div>
              <div className="flex items-center gap-2 text-slate-500 bg-slate-50 px-3 py-2 rounded-md w-fit">
                <ClipboardList size={16} /><span className="font-medium text-sm">{totalTasks} {totalTasks === 1 ? 'Item' : 'Items'} Recorded</span>
              </div>
            </div>
            <div className="bg-slate-50 px-6 py-3 border-t border-slate-100 flex justify-between items-center text-sm font-medium text-slate-600 group-hover:text-slate-900 group-hover:bg-orange-50/30 transition-colors">
              <span>Open Job Details</span><ChevronRight size={16} />
            </div>
          </div>
        );
      };

      // 3. SummarySidebar
      const SummarySidebar = ({ tasks, jobAddress, clientName }) => {
        const { totalMinutes, allMaterials, allTools } = useMemo(() => calculateStats(tasks), [tasks]);
        const handlePrint = () => window.print();

        if (tasks.length === 0) return null;

        return (
          <div className="bg-white rounded-xl border border-slate-200 shadow-sm p-6 sticky top-6 no-print">
            <h2 className="text-lg font-bold mb-6 flex items-center gap-2 text-slate-800 border-b border-slate-100 pb-3">
              <FileText className="text-orange-600" size={20} /> Job Summary
            </h2>
            <div className="space-y-3">
              <button onClick={handlePrint} className="w-full py-3 px-4 bg-slate-900 text-white text-sm font-bold rounded-lg hover:bg-slate-800 transition-colors flex items-center justify-center gap-2 shadow-sm">
                <Printer size={18} /> Print / Save as PDF
              </button>
            </div>
            <div className="mt-8 pt-6 border-t border-slate-100 space-y-6">
              <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider">Job Totals</h3>
              <div className="flex items-center justify-between bg-slate-50 p-3 rounded-lg border border-slate-100">
                <div className="flex items-center gap-2 text-sm font-semibold text-slate-700">
                   <Clock size={16} className="text-orange-500" /><span>Total Est. Time</span>
                </div>
                <span className="font-bold text-slate-900">{formatTime(totalMinutes)}</span>
              </div>
              <div>
                <div className="flex items-center justify-between mb-2">
                  <div className="flex items-center gap-2 text-sm font-semibold text-slate-700"><Package size={16} className="text-slate-400" /><span>Material List</span></div>
                  <span className="text-xs text-slate-400 font-medium">{allMaterials.length} items</span>
                </div>
                {allMaterials.length > 0 ? (
                  <ul className="space-y-1 max-h-60 overflow-y-auto pr-1 custom-scrollbar">
                    {allMaterials.map((m, i) => (
                      <li key={i} className="text-xs text-slate-600 flex items-start gap-2">
                        <span className="mt-1 w-1.5 h-1.5 rounded-full bg-orange-400 flex-shrink-0"></span><span className="leading-tight">{m}</span>
                      </li>
                    ))}
                  </ul>
                ) : <p className="text-xs text-slate-400 italic">None recorded.</p>}
              </div>
            </div>
          </div>
        );
      };

      // 4. Print Header
      const PrintHeader = ({ job }) => {
        if (!job) return null;
        return (
          <div className="print-only mb-8 pb-4 border-b-2 border-black">
             <div className="flex justify-between items-start">
               <div>
                  <div className="flex items-center gap-2 text-black mb-4">
                    <Hammer size={28} className="text-black" />
                    <span className="text-2xl font-extrabold tracking-tight">JobSite Log</span>
                  </div>
                  <h1 className="text-xl font-bold mb-1">Project Estimate</h1>
                  <p className="text-sm text-gray-600">Generated: {new Date().toLocaleDateString()}</p>
               </div>
               <div className="text-right">
                  <div className="mb-2">
                    <span className="block text-xs uppercase font-bold text-gray-500">Project Location</span>
                    <span className="block text-lg font-bold">{job.address}</span>
                  </div>
                  {job.clientName && (
                    <div>
                      <span className="block text-xs uppercase font-bold text-gray-500">Client</span>
                      <span className="block text-lg">{job.clientName}</span>
                    </div>
                  )}
               </div>
             </div>
          </div>
        );
      };

      // 5. Print Footer Summary
      const PrintJobSummary = ({ tasks }) => {
        const { totalMinutes, allMaterials, allTools } = useMemo(() => calculateStats(tasks), [tasks]);
        
        if (tasks.length === 0) return null;

        return (
          <div className="print-only mt-6" style={{ breakInside: 'avoid' }}>
             <div className="border-t-2 border-black pt-4 mb-8">
                <h3 className="text-lg font-bold uppercase mb-4">Requirements Summary</h3>
                <div className="grid grid-cols-2 gap-8">
                   <div className="p-4 border border-gray-300 rounded bg-gray-50">
                      <h4 className="font-bold text-sm mb-3 border-b border-gray-300 pb-1 flex justify-between">
                         <span>MATERIALS</span>
                         <span>{allMaterials.length} Items</span>
                      </h4>
                      {allMaterials.length > 0 ? (
                        <div className="columns-2 gap-4">
                          <ul className="list-none">
                             {allMaterials.map((m, i) => <li key={i} className="text-xs mb-1 flex gap-2"><div className="w-3 h-3 border border-gray-400 mr-1 inline-block"></div> {m}</li>)}
                          </ul>
                        </div>
                      ) : <span className="text-xs italic text-gray-500">None required.</span>}
                   </div>

                   <div className="p-4 border border-gray-300 rounded bg-gray-50">
                      <h4 className="font-bold text-sm mb-3 border-b border-gray-300 pb-1 flex justify-between">
                         <span>TOOLS & TIME</span>
                         <span>{formatTime(totalMinutes)}</span>
                      </h4>
                      {allTools.length > 0 ? (
                         <div className="mb-4">
                            <span className="text-xs font-bold text-gray-500 block mb-1">TOOLS CHECKLIST</span>
                            <div className="flex flex-wrap gap-2">
                               {allTools.map((t, i) => <span key={i} className="text-xs border border-gray-300 px-1 py-0.5 bg-white rounded">{t}</span>)}
                            </div>
                         </div>
                      ) : null}
                      <div className="mt-4 pt-2 border-t border-gray-200">
                         <div className="flex justify-between items-end">
                            <span className="text-sm font-bold">Estimated Labor:</span>
                            <span className="text-xl font-mono font-bold">{formatTime(totalMinutes)}</span>
                         </div>
                      </div>
                   </div>
                </div>
             </div>
          </div>
        );
      };

      // --- MAIN APP COMPONENT ---
      const App = () => {
        const [jobs, setJobs] = useState([]);
        const [activeJobId, setActiveJobId] = useState(null);
        const [viewMode, setViewMode] = useState('dashboard');
        const [storageError, setStorageError] = useState(null);
        
        // Task Form State
        const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
        const [editingTaskId, setEditingTaskId] = useState(null);
        const [taskTitle, setTaskTitle] = useState('');
        const [taskTime, setTaskTime] = useState('');
        const [taskMaterials, setTaskMaterials] = useState('');
        const [taskTools, setTaskTools] = useState('');
        const [taskDescription, setTaskDescription] = useState('');
        const [imagePreviews, setImagePreviews] = useState([]);
        const [isProcessingImages, setIsProcessingImages] = useState(false);
        
        const fileInputRef = useRef(null);
        const fileImportRef = useRef(null);

        // Job Form State
        const [isJobFormOpen, setIsJobFormOpen] = useState(false);
        const [newJobAddress, setNewJobAddress] = useState('');
        const [newJobClient, setNewJobClient] = useState('');

        // Init Load
        useEffect(() => {
          const savedJobs = localStorage.getItem('jobsite-log-jobs');
          if (savedJobs) {
            try {
              const parsedJobs = JSON.parse(savedJobs);
              // Migration helper
              const migratedJobs = parsedJobs.map(job => ({
                ...job,
                tasks: job.tasks.map(task => ({
                  ...task,
                  imageUrls: task.imageUrls || (task.imageUrl ? [task.imageUrl] : [])
                }))
              }));
              setJobs(migratedJobs);
            } catch (e) { setJobs([]); }
          }
        }, []);

        // Save on Change
        useEffect(() => {
          try {
            localStorage.setItem('jobsite-log-jobs', JSON.stringify(jobs));
            setStorageError(null);
          } catch (e) {
            setStorageError("Storage full! Delete some photos or old jobs.");
          }
        }, [jobs]);

        const backupData = () => {
          const dataStr = JSON.stringify(jobs, null, 2);
          const blob = new Blob([dataStr], { type: "application/json" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `JobSite_Backup_${new Date().toISOString().slice(0,10)}.json`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        };

        const handleImportData = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
             try {
                const imported = JSON.parse(event.target.result);
                if (Array.isArray(imported)) {
                    if(window.confirm(`Found ${imported.length} jobs in backup. Replace current data?`)) {
                        setJobs(imported);
                    }
                } else { alert("Invalid backup file."); }
             } catch(err) { alert("Error reading file."); }
          };
          reader.readAsText(file);
          e.target.value = null;
        };

        const compressImage = (file) => {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (event) => {
              const img = new Image();
              img.src = event.target.result;
              img.onload = () => {
                const canvas = document.createElement('canvas');
                // Optimization: Reduced max size slightly to 900 to save space, plenty for PDF
                const MAX_SIZE = 900; 
                let width = img.width;
                let height = img.height;
                if (width > height) {
                  if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; }
                } else {
                  if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; }
                }
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                // Optimization: JPEG quality 0.6 is good balance for storage vs print quality
                resolve(canvas.toDataURL('image/jpeg', 0.6));
              };
              img.onerror = () => resolve(event.target.result);
            };
          });
        };

        const handleImageUpload = async (e) => {
          const files = e.target.files;
          if (files && files.length > 0) {
            setIsProcessingImages(true);
            const processedImages = [];
            try {
              for (let i = 0; i < files.length; i++) {
                const base64 = await compressImage(files[i]);
                processedImages.push(base64);
              }
              setImagePreviews(prev => [...prev, ...processedImages]);
            } catch (err) { alert("Could not process images."); }
            finally { setIsProcessingImages(false); }
          }
        };

        const resetTaskForm = () => {
          setTaskTitle(''); setTaskTime(''); setTaskMaterials(''); setTaskTools('');
          setTaskDescription(''); setImagePreviews([]); setIsTaskFormOpen(false);
          setEditingTaskId(null);
          if (fileInputRef.current) fileInputRef.current.value = '';
        };

        const handleEditTask = (task) => {
          setTaskTitle(task.title); setTaskTime(task.estimatedTime || '');
          setTaskDescription(task.description || '');
          setTaskMaterials(task.materials.join(', '));
          setTaskTools(task.tools.join(', '));
          setImagePreviews(task.imageUrls || []);
          setEditingTaskId(task.id); setIsTaskFormOpen(true);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const handleSaveTask = (e) => {
          e.preventDefault();
          if (!taskTitle.trim() || !activeJobId) return;
          const taskData = {
            title: taskTitle,
            estimatedTime: taskTime,
            description: taskDescription,
            materials: taskMaterials.split(',').map(s => s.trim()).filter(Boolean),
            tools: taskTools.split(',').map(s => s.trim()).filter(Boolean),
            imageUrls: imagePreviews,
            id: editingTaskId || crypto.randomUUID(),
            createdAt: editingTaskId ? undefined : Date.now(),
          };
          setJobs(prev => prev.map(job => {
            if (job.id === activeJobId) {
              const newTasks = editingTaskId 
                ? job.tasks.map(t => t.id === editingTaskId ? { ...t, ...taskData } : t)
                : [{ ...taskData }, ...job.tasks];
              return { ...job, tasks: newTasks, updatedAt: Date.now() };
            }
            return job;
          }));
          resetTaskForm();
        };

        const deleteTask = (taskId) => {
          if (window.confirm('Delete this entry?')) {
            setJobs(prev => prev.map(job => job.id === activeJobId ? { ...job, tasks: job.tasks.filter(t => t.id !== taskId) } : job));
            if (editingTaskId === taskId) resetTaskForm();
          }
        };

        const activeJob = jobs.find(j => j.id === activeJobId);

        return (
          <div className="min-h-screen bg-slate-50 text-slate-900 pb-20 font-sans print:bg-white print:pb-0 print:h-auto print:overflow-visible">
            {storageError && (
              <div className="bg-red-600 text-white p-2 text-center text-sm font-bold no-print sticky top-0 z-50">
                <div className="flex items-center justify-center gap-2"><AlertTriangle size={16} />{storageError}</div>
              </div>
            )}

            <header className="bg-slate-900 text-white shadow-md sticky top-0 z-20 no-print">
              <div className="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  {viewMode === 'job-detail' ? (
                     <button onClick={() => { setActiveJobId(null); setViewMode('dashboard'); setIsTaskFormOpen(false); }} className="p-2 -ml-2 rounded-full hover:bg-slate-800 transition-colors flex items-center gap-2">
                       <ArrowLeft size={20} /><span className="text-sm font-semibold text-slate-300">Back to Jobs</span>
                     </button>
                  ) : (
                    <div className="flex items-center gap-3">
                      <div className="bg-orange-600 p-1.5 rounded-lg"><Hammer className="text-white h-5 w-5" /></div>
                      <div><h1 className="text-xl font-bold tracking-tight">JobSite Log</h1></div>
                    </div>
                  )}
                </div>

                {viewMode === 'dashboard' ? (
                  <div className="flex items-center gap-3">
                    <button onClick={backupData} className="p-2 text-slate-400 hover:text-white" title="Backup"><SaveAll size={20} /></button>
                    <button onClick={() => fileImportRef.current?.click()} className="p-2 text-slate-400 hover:text-white" title="Restore"><UploadCloud size={20} /></button>
                    <input type="file" ref={fileImportRef} className="hidden" accept=".json" onChange={handleImportData} />
                    {jobs.length > 0 && (
                      <button onClick={() => setIsJobFormOpen(true)} className="flex items-center gap-2 px-4 py-2 bg-orange-600 hover:bg-orange-500 text-white rounded-full font-medium shadow-lg ml-2 text-sm">
                        <Plus size={18} /><span className="hidden sm:inline">New Job</span>
                      </button>
                    )}
                  </div>
                ) : (
                  <div className="flex items-center gap-2">
                     <button onClick={() => window.print()} className="flex items-center gap-2 px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-full font-medium text-sm mr-2">
                       <Printer size={18} /><span className="hidden sm:inline">Print / PDF</span>
                     </button>
                     <button onClick={() => { isTaskFormOpen ? resetTaskForm() : setIsTaskFormOpen(true); }} className={`flex items-center gap-2 px-4 py-2 rounded-full font-medium text-sm ${isTaskFormOpen ? 'bg-slate-700' : 'bg-orange-600 hover:bg-orange-500 shadow-lg'} text-white`}>
                      {isTaskFormOpen ? <X size={18} /> : <Plus size={18} />}<span className="hidden sm:inline">{isTaskFormOpen ? 'Cancel' : 'Add Item'}</span>
                    </button>
                  </div>
                )}
              </div>
              {viewMode === 'job-detail' && activeJob && (
                <div className="border-t border-slate-800 bg-slate-900 pb-4 pt-1 px-4">
                   <div className="max-w-5xl mx-auto">
                      <h2 className="text-2xl font-bold text-white flex items-center gap-2"><MapPin className="text-orange-500" size={24} />{activeJob.address}</h2>
                      {activeJob.clientName && <p className="text-slate-400 text-sm ml-8">{activeJob.clientName}</p>}
                   </div>
                </div>
              )}
            </header>

            <main className="max-w-5xl mx-auto px-4 sm:px-6 py-8 print:px-0 print:py-0 print:max-w-full">
              {viewMode === 'dashboard' && (
                <>
                  {isJobFormOpen && (
                     <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4 no-print">
                       <div className="bg-white rounded-xl shadow-2xl w-full max-w-md overflow-hidden">
                          <div className="bg-slate-50 px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                            <h3 className="font-bold text-lg">Add New Job</h3>
                            <button onClick={() => setIsJobFormOpen(false)}><X size={20} className="text-slate-400 hover:text-slate-600"/></button>
                          </div>
                          <form onSubmit={(e) => {
                             e.preventDefault(); if(!newJobAddress.trim()) return;
                             setJobs(p => [{ id: crypto.randomUUID(), address: newJobAddress, clientName: newJobClient, tasks: [], createdAt: Date.now(), updatedAt: Date.now() }, ...p]);
                             setNewJobAddress(''); setNewJobClient(''); setIsJobFormOpen(false);
                          }} className="p-6 space-y-4">
                            <div><label className="block text-sm font-medium mb-1">Job Address *</label><input autoFocus required type="text" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500" value={newJobAddress} onChange={e => setNewJobAddress(e.target.value)} /></div>
                            <div><label className="block text-sm font-medium mb-1">Client Name</label><input type="text" className="w-full p-3 border rounded-lg focus:ring-2 focus:ring-orange-500" value={newJobClient} onChange={e => setNewJobClient(e.target.value)} /></div>
                            <button type="submit" className="w-full bg-slate-900 text-white font-bold py-3 rounded-lg">Create Job</button>
                          </form>
                       </div>
                     </div>
                  )}

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-6 no-print">
                    {jobs.length === 0 ? (
                      <div className="md:col-span-2 text-center py-24 bg-white rounded-xl border-2 border-dashed border-slate-200">
                        <div className="inline-flex items-center justify-center w-20 h-20 bg-slate-50 rounded-full mb-4"><HardHat className="text-slate-300" size={40} /></div>
                        <h3 className="text-xl font-bold text-slate-700">No Jobs Recorded</h3>
                        <p className="text-slate-400 mt-2 mb-6">Create a job to start logging items.</p>
                        <div className="flex gap-4 justify-center">
                          <button onClick={() => fileImportRef.current?.click()} className="inline-flex items-center gap-2 px-6 py-3 bg-white border border-slate-300 text-slate-700 hover:bg-slate-50 rounded-lg font-bold"><UploadCloud size={18} /> Restore</button>
                          <button onClick={() => setIsJobFormOpen(true)} className="inline-flex items-center gap-2 px-6 py-3 bg-orange-600 hover:bg-orange-500 text-white rounded-lg font-bold shadow-lg"><Plus size={18} /> Create Job</button>
                        </div>
                      </div>
                    ) : (
                      jobs.map(job => <JobProjectCard key={job.id} job={job} onClick={(id) => { setActiveJobId(id); setViewMode('job-detail'); setIsTaskFormOpen(false); window.scrollTo(0, 0); }} onDelete={(id, e) => { e.stopPropagation(); if(window.confirm('Delete job?')) setJobs(p => p.filter(j => j.id !== id)); }} />)
                    )}
                  </div>
                </>
              )}

              {viewMode === 'job-detail' && activeJob && (
                <>
                  <PrintHeader job={activeJob} />
                  
                  {isTaskFormOpen && (
                    <div className="mb-8 bg-white rounded-xl shadow-lg border border-slate-200 overflow-hidden no-print animate-in fade-in slide-in-from-top-4 duration-200">
                      <div className="bg-slate-100 px-6 py-3 border-b border-slate-200 flex items-center justify-between">
                        <h2 className="font-bold text-slate-700 flex items-center gap-2"><Clipboard size={18} /> {editingTaskId ? 'Edit Item' : 'Record Item'}</h2>
                        <button onClick={resetTaskForm} className="text-slate-400 hover:text-red-500"><X size={20}/></button>
                      </div>
                      <form onSubmit={handleSaveTask} className="p-6">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                          <div className="space-y-4">
                            <div><label className="block text-sm font-semibold mb-1">Item Title *</label><input type="text" required className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-orange-500" value={taskTitle} onChange={(e) => setTaskTitle(e.target.value)} /></div>
                            <div><label className="block text-sm font-semibold mb-1">Est. Time</label><input type="text" placeholder="e.g. 2h 30m" className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-orange-500" value={taskTime} onChange={(e) => setTaskTime(e.target.value)} /></div>
                            <div><label className="block text-sm font-semibold mb-1">Notes</label><textarea rows={3} className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-orange-500 resize-none" value={taskDescription} onChange={(e) => setTaskDescription(e.target.value)} /></div>
                          </div>
                          <div className="space-y-4">
                            <div><label className="block text-sm font-semibold mb-1">Materials</label><input type="text" placeholder="Comma separated" className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-orange-500" value={taskMaterials} onChange={(e) => setTaskMaterials(e.target.value)} /></div>
                            <div><label className="block text-sm font-semibold mb-1">Tools</label><input type="text" placeholder="Comma separated" className="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-orange-500" value={taskTools} onChange={(e) => setTaskTools(e.target.value)} /></div>
                            <div>
                              <label className="block text-sm font-semibold mb-2">Photos</label>
                              <div className="space-y-3">
                                <div className="flex items-center gap-4">
                                  <button type="button" onClick={() => fileInputRef.current?.click()} disabled={isProcessingImages} className="flex items-center gap-2 px-4 py-2 bg-slate-100 border rounded-lg text-sm font-medium hover:bg-slate-200 disabled:opacity-50"><ImageIcon size={18} /> {isProcessingImages ? 'Processing...' : 'Add Photos'}</button>
                                  <input ref={fileInputRef} type="file" accept="image/*" multiple className="hidden" onChange={handleImageUpload} />
                                </div>
                                {imagePreviews.length > 0 && (
                                  <div className="flex gap-3 overflow-x-auto py-2">
                                    {imagePreviews.map((src, idx) => (
                                      <div key={idx} className="relative flex-shrink-0 h-20 w-20 rounded-lg bg-slate-200 overflow-hidden border group">
                                        <img src={src} className="h-full w-full object-cover" />
                                        <button type="button" onClick={() => setImagePreviews(p => p.filter((_, i) => i !== idx))} className="absolute top-1 right-1 p-1 bg-red-500 text-white rounded-full opacity-0 group-hover:opacity-100 transition-opacity"><X size={12} /></button>
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>
                            </div>
                          </div>
                        </div>
                        <div className="mt-6 pt-4 border-t border-slate-100 flex justify-end gap-3">
                          <button type="button" onClick={resetTaskForm} className="px-4 py-2 text-slate-600 font-medium">Cancel</button>
                          <button type="submit" disabled={isProcessingImages} className="px-6 py-2 bg-slate-900 text-white rounded-lg font-bold flex items-center gap-2 shadow-sm hover:bg-slate-800 disabled:bg-slate-600"><Save size={18} /> {editingTaskId ? 'Update' : 'Save'}</button>
                        </div>
                      </form>
                    </div>
                  )}

                  <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 print:block">
                    <div className="lg:col-span-2 space-y-6 print:space-y-0 print:block">
                      {activeJob.tasks.length === 0 && !isTaskFormOpen ? (
                        <div className="text-center py-20 bg-white rounded-xl border-2 border-dashed border-slate-200 print:hidden">
                          <div className="inline-flex items-center justify-center w-20 h-20 bg-slate-50 rounded-full mb-4"><Clipboard className="text-slate-300" size={40} /></div>
                          <h3 className="text-xl font-bold text-slate-700">Job Log Empty</h3>
                          <p className="text-slate-400 mt-2">No tasks recorded yet.</p>
                        </div>
                      ) : (
                        <div className="grid gap-6 print:block">
                          {activeJob.tasks.map((task, index) => (
                            <TaskCard key={task.id} task={task} index={index} onDelete={deleteTask} onEdit={handleEditTask} />
                          ))}
                        </div>
                      )}
                      <PrintJobSummary tasks={activeJob.tasks} />
                    </div>
                    <div className="lg:col-span-1 no-print">
                       <SummarySidebar tasks={activeJob.tasks} jobAddress={activeJob.address} clientName={activeJob.clientName} />
                    </div>
                  </div>
                </>
              )}
            </main>
          </div>
        );
      };

      const rootElement = document.getElementById('root');
      if (rootElement) {
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
      }
    </script>
  </body>
</html>
