<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" />
    <title>JobSite Log | Optimized</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
      
      @media print {
        @page { margin: 10mm; size: A4; }
        body { background-color: white !important; }
        .no-print, button { display: none !important; }
        .print-card { 
          break-inside: avoid; 
          border: 1px solid #e2e8f0 !important; 
          margin-bottom: 20px; 
          border-radius: 8px; 
          page-break-inside: avoid;
        }
        /* Forces the browser to not bloat images during PDF generation */
        img { max-width: 100% !important; height: auto !important; image-rendering: -webkit-optimize-contrast; }
      }

      .img-preview-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 8px;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
      import React, { useState, useEffect } from 'react';
      import ReactDOM from 'react-dom/client';
      import { get, set } from 'idb-keyval';
      import { 
        Trash2, ImageIcon, Printer, Plus, X, Hammer, 
        ChevronRight, Sparkles, MapPin, Pencil, Save, HardDrive
      } from 'lucide-react';

      const DB_KEY = 'jobsite-v2-optimized';

      // --- AGGRESSIVE COMPRESSION ENGINE ---
      const compressImage = (file) => {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (e) => {
            const img = new Image();
            img.src = e.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              
              // Max 800px for reports - keeps PDF size tiny
              const MAX_DIM = 800; 
              if (width > height && width > MAX_DIM) {
                height *= MAX_DIM / width;
                width = MAX_DIM;
              } else if (height > MAX_DIM) {
                width *= MAX_DIM / height;
                height = MAX_DIM;
              }

              canvas.width = width;
              canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              
              // Quality 0.6 is the sweet spot for file size vs print quality
              resolve(canvas.toDataURL('image/jpeg', 0.6));
            };
          };
        });
      };

      const App = () => {
        const [jobs, setJobs] = useState([]);
        const [activeJobId, setActiveJobId] = useState(null);
        const [viewMode, setViewMode] = useState('dashboard');
        const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
        const [editingTaskId, setEditingTaskId] = useState(null);
        const [dbSize, setDbSize] = useState('0 KB');
        const [taskData, setTaskData] = useState({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });

        useEffect(() => { loadData(); }, []);

        const loadData = async () => {
          const data = await get(DB_KEY) || [];
          setJobs(data);
          calculateDbSize(data);
        };

        const calculateDbSize = (data) => {
          const string = JSON.stringify(data);
          const size = (new TextEncoder().encode(string).length / 1024 / 1024).toFixed(2);
          setDbSize(`${size} MB`);
        };

        const saveToDB = async (newJobs) => {
          setJobs(newJobs);
          await set(DB_KEY, newJobs);
          calculateDbSize(newJobs);
        };

        const activeJob = jobs.find(j => j.id === activeJobId);

        const handleSaveTask = () => {
          if (!taskData.title) return alert("Task Title required");
          const updatedTasks = editingTaskId 
            ? activeJob.tasks.map(t => t.id === editingTaskId ? { ...taskData, id: editingTaskId } : t)
            : [...activeJob.tasks, { ...taskData, id: Date.now() }];
          
          saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: updatedTasks } : j));
          setIsTaskFormOpen(false);
          setEditingTaskId(null);
          setTaskData({ title: '', time: '', materials: '', tools: '', desc: '', images: [] });
        };

        const handleImageUpload = async (e) => {
          const files = Array.from(e.target.files);
          const compressed = await Promise.all(files.map(f => compressImage(f)));
          setTaskData(prev => ({ ...prev, images: [...prev.images, ...compressed] }));
        };

        return (
          <div className="min-h-screen">
            <header className="bg-slate-900 text-white p-4 no-print flex justify-between items-center sticky top-0 z-50 shadow-md">
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => setViewMode('dashboard')}>
                <Hammer className="text-orange-500" />
                <h1 className="font-bold text-lg tracking-tight">JOBSITE LOG</h1>
              </div>
              <div className="flex items-center gap-3">
                <div className="hidden sm:flex items-center gap-1 text-[10px] font-bold text-slate-400 bg-slate-800 px-3 py-1.5 rounded-full">
                  <HardDrive size={12}/> {dbSize}
                </div>
                {viewMode === 'detail' && (
                  <button onClick={() => window.print()} className="bg-orange-500 text-white px-4 py-2 rounded-lg text-xs font-bold flex items-center gap-2">
                    <Printer size={16} /> PRINT PDF
                  </button>
                )}
              </div>
            </header>

            {viewMode === 'dashboard' ? (
              <main className="p-4 max-w-xl mx-auto">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-xl font-bold text-slate-800">Projects</h2>
                  <button onClick={() => {
                    const addr = prompt("Job Address:");
                    if(addr) saveToDB([...jobs, { id: Date.now(), address: addr, clientName: prompt("Client Name:"), tasks: [] }]);
                  }} className="bg-slate-900 text-white px-4 py-2 rounded-lg text-sm font-bold">+ New Site</button>
                </div>
                
                <div className="space-y-3">
                  {jobs.map(j => (
                    <div key={j.id} className="bg-white p-4 rounded-xl border border-slate-200 flex justify-between items-center hover:border-orange-500 transition-all cursor-pointer group shadow-sm" onClick={() => { setActiveJobId(j.id); setViewMode('detail'); }}>
                      <div>
                        <p className="font-bold text-slate-900">{j.address}</p>
                        <p className="text-xs text-slate-400 font-semibold uppercase">{j.tasks.length} entries</p>
                      </div>
                      <div className="flex items-center gap-2">
                        <button onClick={(e) => { e.stopPropagation(); if(confirm("Delete Project?")) saveToDB(jobs.filter(x => x.id !== j.id)); }} className="p-2 text-slate-300 hover:text-red-500">
                          <Trash2 size={18} />
                        </button>
                        <ChevronRight size={18} className="text-slate-300" />
                      </div>
                    </div>
                  ))}
                </div>
              </main>
            ) : (
              <main className="p-4 max-w-xl mx-auto no-print">
                <button onClick={() => setViewMode('dashboard')} className="mb-4 text-slate-400 font-bold text-xs flex items-center gap-1">
                  <ChevronRight size={14} className="rotate-180" /> BACK
                </button>
                
                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm mb-6">
                  <h2 className="text-2xl font-bold text-slate-900 leading-tight">{activeJob?.address}</h2>
                  <p className="text-slate-400 font-bold text-sm uppercase">{activeJob?.clientName}</p>
                </div>

                <div className="space-y-4 mb-24">
                  {activeJob?.tasks.map((t, i) => (
                    <div key={t.id} className="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                      <div className="bg-slate-50 p-3 border-b flex justify-between items-center">
                        <span className="font-bold text-slate-400 text-xs">LOG #{i+1}</span>
                        <div className="flex gap-2">
                           <button onClick={() => { setEditingTaskId(t.id); setTaskData(t); setIsTaskFormOpen(true); }} className="p-1.5 text-slate-400 hover:text-blue-500"><Pencil size={16}/></button>
                           <button onClick={() => { if(confirm("Delete log?")) saveToDB(jobs.map(j => j.id === activeJobId ? { ...j, tasks: j.tasks.filter(tk => tk.id !== t.id) } : j)); }} className="p-1.5 text-slate-400 hover:text-red-500"><Trash2 size={16}/></button>
                        </div>
                      </div>
                      <div className="p-4">
                        <h3 className="font-bold text-slate-900">{t.title}</h3>
                        <p className="text-slate-500 text-sm mt-1">{t.desc}</p>
                        {t.images?.length > 0 && (
                          <div className="flex gap-2 mt-3 overflow-x-auto pb-1">
                            {t.images.map((img, idx) => (
                              <img key={idx} src={img} className="h-16 w-16 object-cover rounded-lg border flex-shrink-0" />
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                <button onClick={() => setIsTaskFormOpen(true)} className="fixed bottom-6 right-6 bg-slate-900 text-white w-14 h-14 rounded-full shadow-xl flex items-center justify-center active:scale-95 transition-all z-40">
                  <Plus size={28} />
                </button>
              </main>
            )}

            {isTaskFormOpen && (
              <div className="fixed inset-0 z-[100] bg-slate-900/60 backdrop-blur-sm p-4 overflow-y-auto">
                <div className="bg-white rounded-2xl max-w-md mx-auto p-6 shadow-2xl">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-xl font-bold">{editingTaskId ? 'Edit Entry' : 'New Entry'}</h2>
                    <button onClick={() => setIsTaskFormOpen(false)} className="text-slate-400"><X size={24}/></button>
                  </div>
                  
                  <div className="space-y-4">
                    <input placeholder="Task Title" className="w-full p-3 bg-slate-100 rounded-lg outline-none font-bold" value={taskData.title} onChange={e => setTaskData({...taskData, title: e.target.value})} />
                    
                    <div className="flex gap-3">
                      <input placeholder="Time" className="w-24 p-3 bg-slate-100 rounded-lg outline-none font-bold text-center" value={taskData.time} onChange={e => setTaskData({...taskData, time: e.target.value})} />
                      <label className="flex-1 bg-blue-50 text-blue-600 p-3 rounded-lg cursor-pointer flex items-center justify-center font-bold text-xs uppercase">
                        <ImageIcon size={16} className="mr-2" /> Add Photos
                        <input type="file" multiple accept="image/*" className="hidden" onChange={handleImageUpload} />
                      </label>
                    </div>

                    {taskData.images.length > 0 && (
                      <div className="img-preview-grid">
                        {taskData.images.map((img, i) => (
                          <div key={i} className="relative aspect-square">
                            <img src={img} className="w-full h-full object-cover rounded-lg border" />
                            <button onClick={() => setTaskData(p => ({...p, images: p.images.filter((_, idx) => idx !== i)}))} className="absolute -top-1 -right-1 bg-red-500 text-white rounded-full p-1 shadow-sm"><X size={10}/></button>
                          </div>
                        ))}
                      </div>
                    )}
                    
                    <textarea placeholder="Description / Materials / Tools..." className="w-full p-3 bg-slate-100 rounded-lg outline-none text-sm h-24" value={taskData.desc} onChange={e => setTaskData({...taskData, desc: e.target.value})} />
                    
                    <button onClick={handleSaveTask} className="w-full bg-orange-500 text-white p-4 rounded-lg font-bold shadow-lg flex items-center justify-center gap-2">
                      <Save size={18} /> SAVE LOG
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* --- PDF OUTPUT (A4 Optimized) --- */}
            {activeJob && (
              <div className="print-only hidden">
                <div className="border-b-4 border-slate-900 pb-4 mb-6 flex justify-between items-end">
                  <div>
                    <h1 className="text-3xl font-black">SITE REPORT</h1>
                    <p className="text-slate-500 text-xs font-bold uppercase">{new Date().toLocaleDateString('en-AU')}</p>
                  </div>
                  <div className="text-right">
                    <p className="text-xl font-bold">{activeJob.address}</p>
                    <p className="text-slate-500 font-bold text-xs italic">{activeJob.clientName}</p>
                  </div>
                </div>

                {activeJob.tasks.map((t, idx) => (
                  <div key={t.id} className="print-card p-4">
                    <div className="flex justify-between items-start mb-2 border-b pb-2">
                      <h3 className="font-bold text-lg">{idx + 1}. {t.title}</h3>
                      <span className="bg-slate-100 px-3 py-1 rounded text-xs font-black uppercase">Time: {t.time || 'N/A'}</span>
                    </div>
                    <p className="text-sm text-slate-700 mb-4 whitespace-pre-wrap">{t.desc}</p>
                    {t.images?.length > 0 && (
                      <div className="grid grid-cols-2 gap-2 mt-2">
                        {t.images.map((img, i) => (
                          <img key={i} src={img} className="rounded border w-full h-48 object-cover" />
                        ))}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
