<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0f172a" id="theme-color-meta" />
    <title>JobSite Master | Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@babel/standalone@7.23.5/babel.min.js"></script>
    <style>
      body { -webkit-tap-highlight-color: transparent; transition: background-color 0.3s; }
      @media print {
        @page { margin: 8mm; size: A4; }
        html, body { background-color: white !important; color: black !important; -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
        .no-print, button, .action-btns, .fixed { display: none !important; }
        .print-only { display: block !important; }
        .print-card { break-inside: avoid; border: 2px solid #cbd5e1 !important; margin-bottom: 15px; border-radius: 10px; overflow: hidden; page-break-inside: avoid; background: white !important; }
        .print-img-container { break-inside: avoid; page-break-inside: avoid; }
        img { max-width: 100% !important; height: auto !important; }
        .print-header { page-break-after: avoid; }
      }
      .img-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; margin-top: 10px; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .canvas-editor-area { touch-action: none; }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.344.0",
        "idb-keyval": "https://esm.sh/idb-keyval@6.2.1"
      }
    }
    </script>
  </head>
  <body class="bg-slate-100 dark:bg-slate-950 text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="text/babel" data-type="module">
  import React, { useState, useEffect, useRef } from 'react';
  import ReactDOM from 'react-dom/client';
  import { get, set } from 'idb-keyval';
  import {
    Trash2, ImageIcon, Printer, Plus, X, Hammer, ChevronRight, Sparkles,
    Pencil, Save, HardDrive, CheckCircle2, Clock, Moon, Sun, Edit3, Undo,
    RefreshCcw, Move, ZoomIn, Check, Search, DollarSign, Tag,
    MapPinned, Navigation, LocateFixed, AlertTriangle, Receipt
  } from 'lucide-react';

  const DB_KEY = 'jobsite-master-v4';
  const MAX_STOPS = 12;
  const GST_RATE  = 0.1;

  // ─── Utilities ─────────────────────────────────────────────────────────────
  const parseTimeToMinutes = (str) => {
    if (!str) return 0;
    const s = str.toLowerCase().trim();
    const hM = s.match(/(\d+\.?\d*)\s*h/);
    const mM = s.match(/(\d+\.?\d*)\s*m(?:in(?:utes?)?)?(?:\b|$)/);
    if (!hM && !mM) { const n = parseFloat(s); return isNaN(n) ? 0 : n * 60; }
    return (hM ? parseFloat(hM[1]) * 60 : 0) + (mM ? parseFloat(mM[1]) : 0);
  };
  const fmtMins = (m) => { const h = Math.floor(m/60), r = Math.round(m%60); if (!h) return `${r}m`; if (!r) return `${h}h`; return `${h}h ${r}m`; };
  const fmtAUD  = (n) => `$${Number(n||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2})}`;

  const getQuoteTotals = (tasks, gstEnabled) => {
    let labour = 0, mats = 0;
    (tasks||[]).forEach(t => {
      labour += (parseTimeToMinutes(t.time)/60) * (parseFloat(t.rate)||0);
      mats   += parseFloat(t.materialsCost)||0;
    });
    const subtotal = labour + mats;
    const gst      = gstEnabled ? subtotal * GST_RATE : 0;
    const total    = subtotal + gst;
    return { labour, mats, subtotal, gst, total };
  };
  const compressImage = (file) => new Promise((res, rej) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onerror = () => rej(new Error(`FileReader failed: ${file.name}`));
    reader.onload = (ev) => {
      const img = new Image(); img.src = ev.target.result;
      img.onerror = () => rej(new Error(`Decode failed: ${file.name}`));
      img.onload = () => {
        try {
          const c = document.createElement('canvas');
          const MAX = 600; let w = img.width, h = img.height;
          if (w > MAX) { h *= MAX/w; w = MAX; }
          c.width = w; c.height = h;
          c.getContext('2d').drawImage(img, 0, 0, w, h);
          res(c.toDataURL('image/webp', 0.6));
        } catch(e) { rej(e); }
      };
    };
  });

  // ── Statuses ───────────────────────────────────────────────────────────────
  const STATUSES = [
    { key:'draft',    label:'Draft',    cls:'bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 border-slate-200 dark:border-slate-700' },
    { key:'sent',     label:'Sent',     cls:'bg-blue-100 dark:bg-blue-900/40 text-blue-600 dark:text-blue-300 border-blue-200 dark:border-blue-800' },
    { key:'approved', label:'Approved', cls:'bg-emerald-100 dark:bg-emerald-900/40 text-emerald-600 dark:text-emerald-300 border-emerald-200 dark:border-emerald-800' },
    { key:'invoiced', label:'Invoiced', cls:'bg-purple-100 dark:bg-purple-900/40 text-purple-600 dark:text-purple-300 border-purple-200 dark:border-purple-800' },
  ];
  const getStatus = (k) => STATUSES.find(s => s.key===k) || STATUSES[0];

  // ── Templates (still present, can be improved later) ────────────────────
  const TEMPLATES = {
    quote: {
      painting_interior: { title:"Interior Painting", materials:"Paint, Primer, Drop Sheets, Painter's Tape, Filler", tools:"Brushes, Rollers, Extension Poles, Sandpaper", desc:"Surface prep, fill holes, prime and 2 finish coats" },
      painting_exterior: { title:"Exterior Painting", materials:"Exterior Paint, Primer, Weatherproof Filler, Drop Sheets", tools:"Pressure Washer, Scrapers, Brushes, Rollers, Ladders", desc:"Pressure wash, scrape, repair, prime and 2 coats" },
      drywall_repair:    { title:"Drywall/Gyprock Repair", materials:"Plasterboard, Joint Compound, Mesh Tape, Sandpaper, Paint", tools:"Utility Knife, Trowels, Sanding Block, Drywall Saw", desc:"Cut damaged section, install new board, tape, compound, sand and paint" },
      deck_build:        { title:"Deck Construction", materials:"Treated Pine/Hardwood Decking, Joists, Posts, Concrete, Screws", tools:"Circular Saw, Drill, Level, Post Hole Digger, String Line", desc:"Site prep, post installation, frame build, decking installation" },
      laminate_flooring: { title:"Laminate/Vinyl Flooring", materials:"Laminate/Vinyl Planks, Underlay, Skirting Boards, Adhesive", tools:"Jigsaw, Spacers, Tapping Block, Pull Bar, Measuring Tape", desc:"Remove old flooring, level subfloor, install underlay and planks" },
      fencing:           { title:"Fence Installation", materials:"Timber Palings/Colorbond, Steel/Timber Posts, Concrete, Rails, Screws", tools:"Post Hole Digger, Level, String Line, Power Drill, Saw", desc:"Mark line, dig holes, set posts in concrete, install rails and palings" },
      pressure_washing:  { title:"Pressure Washing", materials:"Industrial Degreaser, Surface Cleaner Solution", tools:"Petrol Pressure Washer, Turbo Nozzle, Surface Cleaner", desc:"Deep clean driveways, paths, decks, exteriors, remove mould" },
      general_repairs:   { title:"General Repairs", materials:"Various (depends on scope)", tools:"Basic Hand Tools, Power Tools as Required", desc:"Multiple small tasks - adjustments, hole filling, minor fixes" }
    },
    handover: {
      painting_interior: { title:"Interior Painting", materials:"N/A", tools:"No delays", desc:"All surfaces painted to specification. Touch-up paint provided to client." },
      deck_build:        { title:"Deck Construction", materials:"N/A", tools:"No delays", desc:"Deck construction complete. All safety checks passed. Client briefed on maintenance." },
      pressure_washing:  { title:"Pressure Washing", materials:"N/A", tools:"No delays", desc:"All surfaces cleaned. Water run-off managed. Area left clean and dry." },
      general_repairs:   { title:"General Repairs", materials:"N/A", tools:"No delays", desc:"All repair items completed as per quote. Work area cleaned." },
      cleanup:           { title:"Site Cleanup", materials:"Cleaning supplies", tools:"Minor weather delay", desc:"Site cleaned of all debris. Surfaces wiped down. Client access restored." }
    }
  };

  // ── New Job Modal ──────────────────────────────────────────────────────────
  const NewJobModal = ({ type, onSave, onClose }) => {
    const [addr, setAddr]     = useState('');
    const [client, setClient] = useState('');
    const isHandover = type === 'handover';
    const go = () => addr.trim() && onSave(addr.trim(), client);
    return (
      <div className="fixed inset-0 z-[150] bg-slate-900/90 backdrop-blur-md flex items-center justify-center p-4">
        <div className="bg-white dark:bg-slate-900 rounded-[2.5rem] w-full max-w-md p-8 shadow-2xl border dark:border-slate-800">
          <div className="flex justify-between items-center mb-6">
            <div>
              <span className={`text-[10px] font-black px-2 py-0.5 rounded-md uppercase tracking-widest ${isHandover ? 'bg-emerald-100 dark:bg-emerald-900 text-emerald-600 dark:text-emerald-300' : 'bg-orange-100 dark:bg-orange-900 text-orange-600 dark:text-orange-300'}`}>
                {isHandover ? 'Completed Works' : 'Field Report'}
              </span>
              <h2 className="text-2xl font-black text-slate-900 dark:text-white mt-2">New Project</h2>
            </div>
            <button onClick={onClose} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-white"><X size={20}/></button>
          </div>
          <div className="space-y-4">
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Job Address *</label>
              <input autoFocus className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none font-bold dark:text-white dark:placeholder-slate-500 focus:ring-2 focus:ring-orange-400" placeholder="e.g. 42 Acacia Ave, Sydney NSW" value={addr} onChange={e => setAddr(e.target.value)} onKeyDown={e => e.key==='Enter' && go()}/>
            </div>
            <div>
              <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Client Name</label>
              <input className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none font-medium dark:text-white dark:placeholder-slate-500 focus:ring-2 focus:ring-orange-400" placeholder="e.g. John Smith" value={client} onChange={e => setClient(e.target.value)} onKeyDown={e => e.key==='Enter' && go()}/>
            </div>
            <button onClick={go} disabled={!addr.trim()} className={`w-full text-white p-5 rounded-[2rem] font-black text-lg shadow-xl flex items-center justify-center gap-2 mt-2 ${addr.trim() ? (isHandover ? 'bg-emerald-600 hover:bg-emerald-500' : 'bg-slate-900 hover:bg-slate-800 dark:bg-orange-500 dark:hover:bg-orange-400') : 'bg-slate-200 dark:bg-slate-800 text-slate-400 cursor-not-allowed'}`}>
              <Plus size={20}/> Create Project
            </button>
          </div>
        </div>
      </div>
    );
  };

  // ── Main App ───────────────────────────────────────────────────────────────
  const App = () => {
    const [jobs, setJobs]               = useState([]);
    const [activeJobId, setActiveJobId] = useState(null);
    const [viewMode, setViewMode]       = useState('dashboard');
    const [isTaskFormOpen, setIsTaskFormOpen] = useState(false);
    const [editingTaskId, setEditingTaskId]   = useState(null);
    const [dbSize, setDbSize]           = useState('0 MB');
    const [isDarkMode, setIsDarkMode]   = useState(() => localStorage.getItem('theme') === 'dark');
    const [newJobModal, setNewJobModal] = useState(null);
    const [searchQ, setSearchQ]         = useState('');
    const [filterType, setFilterType]   = useState('all');
    const [isEditingHeader, setIsEditingHeader] = useState(false);
    const [headerDraft, setHeaderDraft] = useState({
      address:'', clientName:'', clientRef:'', projectNotes:'', projectPhotos:[]
    });

    // Route planning
    const [selectionMode, setSelectionMode] = useState(false);
    const [selectedJobs, setSelectedJobs]   = useState([]);
    const [useMyLocation, setUseMyLocation] = useState(true);
    const [locStatus, setLocStatus]         = useState('idle');
    const [currentCoords, setCurrentCoords] = useState(null);

    const EMPTY_TASK = { title:'', time:'', rate:'', materialsCost:'', materials:'', tools:'', desc:'', images:[] };
    const [taskData, setTaskData] = useState(EMPTY_TASK);

    // Canvas
    const [editingImageIdx, setEditingImageIdx] = useState(null);
    const canvasRef    = useRef(null);
    const [isDrawing, setIsDrawing]   = useState(false);
    const [penColor, setPenColor]     = useState('#ef4444');
    const [undoStack, setUndoStack]   = useState([]);
    const [canvasZoom, setCanvasZoom] = useState(1);
    const [canvasPan, setCanvasPan]   = useState({ x:0, y:0 });
    const [canvasMode, setCanvasMode] = useState('draw');
    const zoomRef     = useRef(1);
    const panRef      = useRef({ x:0, y:0 });
    const modeRef     = useRef('draw');
    const drawRef     = useRef(false);
    const pinchRef    = useRef(null);
    const panStartRef = useRef(null);

    const COLORS = [
      { hex:'#ef4444', name:'Red' }, { hex:'#22c55e', name:'Green' },
      { hex:'#eab308', name:'Yellow' }, { hex:'#ffffff', name:'White' },
      { hex:'#000000', name:'Black' }
    ];

    useEffect(() => { loadJobs(); }, []);
    useEffect(() => {
      const root = document.documentElement;
      if (isDarkMode) { root.classList.add('dark'); document.getElementById('theme-color-meta').setAttribute('content','#020617'); localStorage.setItem('theme','dark'); }
      else { root.classList.remove('dark'); document.getElementById('theme-color-meta').setAttribute('content','#0f172a'); localStorage.setItem('theme','light'); }
    }, [isDarkMode]);
    useEffect(() => { zoomRef.current = canvasZoom; }, [canvasZoom]);
    useEffect(() => { panRef.current  = canvasPan;  }, [canvasPan]);
    useEffect(() => { modeRef.current = canvasMode; }, [canvasMode]);
    useEffect(() => { drawRef.current = isDrawing;  }, [isDrawing]);
    useEffect(() => { if (viewMode !== 'dashboard') exitSelectionMode(); }, [viewMode]);

    const loadJobs  = async () => { const d = await get(DB_KEY)||[]; setJobs(d); updMetric(d); };
    const updMetric = (d) => setDbSize(`${(new TextEncoder().encode(JSON.stringify(d)).length/1024/1024).toFixed(2)} MB`);
    const saveToDB  = async (nj) => {
      setJobs(nj);
      try { await set(DB_KEY, nj); } catch(e) { console.error(e); alert('Warning: Data could not be saved.'); }
      updMetric(nj);
    };

    const activeJob   = jobs.find(j => j.id === activeJobId);
    const getTotals   = (tasks) => { const m=(tasks||[]).reduce((a,t)=>a+parseTimeToMinutes(t.time),0); return { mins:m, str:fmtMins(m) }; };
    const quoteTotals = activeJob?.type==='quote' ? getQuoteTotals(activeJob.tasks, activeJob.gstEnabled) : null;

    // ── CRUD ──────────────────────────────────────────────────────────────────
    const handleCreateJob = (address, clientName) => {
      saveToDB([...jobs, {
        id:Date.now(), date:new Date().toISOString(), type:newJobModal,
        address, clientName, clientRef:'', projectNotes:'', projectPhotos:[],
        tasks:[], status:'draft', gstEnabled:false
      }]);
      setNewJobModal(null);
    };
    const cycleStatus  = (id) => {
      const j=jobs.find(x=>x.id===id), idx=STATUSES.findIndex(s=>s.key===(j.status||'draft'));
      saveToDB(jobs.map(x=>x.id===id?{...x,status:STATUSES[(idx+1)%STATUSES.length].key}:x));
    };
    const toggleGST    = (id) => saveToDB(jobs.map(j=>j.id===id?{...j,gstEnabled:!j.gstEnabled}:j));

    // ── Header editing (includes project metadata) ─────────────────────────
    const startEditHeader = () => {
      setHeaderDraft({
        address: activeJob.address,
        clientName: activeJob.clientName,
        clientRef: activeJob.clientRef || '',
        projectNotes: activeJob.projectNotes || '',
        projectPhotos: activeJob.projectPhotos || [],
      });
      setIsEditingHeader(true);
    };
    const saveHeaderEdit = () => {
      if (!headerDraft.address.trim()) return;
      saveToDB(jobs.map(j => j.id===activeJobId ? {
        ...j,
        address: headerDraft.address.trim(),
        clientName: headerDraft.clientName,
        clientRef: headerDraft.clientRef,
        projectNotes: headerDraft.projectNotes,
        projectPhotos: headerDraft.projectPhotos,
      } : j));
      setIsEditingHeader(false);
    };
    const handleProjectPhotoUpload = async (e) => {
      try {
        const compressed = await Promise.all(Array.from(e.target.files).map(compressImage));
        setHeaderDraft(d => ({ ...d, projectPhotos: [...d.projectPhotos, ...compressed] }));
      } catch { alert('One or more images could not be processed.'); }
    };

    // Task modal
    const handleSaveTask = () => {
      if (!taskData.title) return alert('Title Required');
      if (!activeJob) return;
      const updated = editingTaskId
        ? activeJob.tasks.map(t => t.id===editingTaskId ? { ...taskData, id: editingTaskId } : t)
        : [...activeJob.tasks, { ...taskData, id: Date.now() }];
      saveToDB(jobs.map(j => j.id===activeJobId ? { ...j, tasks: updated } : j));
      closeModal();
    };
    const closeModal = () => { setIsTaskFormOpen(false); setEditingTaskId(null); setTaskData(EMPTY_TASK); };
    const handleImageUpload = async (e) => {
      try { const c=await Promise.all(Array.from(e.target.files).map(compressImage)); setTaskData(p=>({...p,images:[...p.images,...c]})); }
      catch { alert('One or more images could not be processed.'); }
    };

    // ── Route planning ────────────────────────────────────────────────────────
    const exitSelectionMode = () => { setSelectionMode(false); setSelectedJobs([]); setLocStatus('idle'); setCurrentCoords(null); };
    const toggleSelectionMode = () => { if (selectionMode) exitSelectionMode(); else { setSelectionMode(true); setSelectedJobs([]); } };
    const toggleJobSelection  = (id) => setSelectedJobs(prev => prev.includes(id) ? prev.filter(x=>x!==id) : prev.length>=MAX_STOPS ? prev : [...prev,id]);
    const selectAllVisible    = () => setSelectedJobs(prev => { const e=new Set(prev); return [...prev,...filteredJobs.map(j=>j.id).filter(id=>!e.has(id))].slice(0,MAX_STOPS); });
    const getMyLocation = () => {
      if (!navigator.geolocation) { setLocStatus('denied'); return; }
      setLocStatus('loading');
      navigator.geolocation.getCurrentPosition(
        (pos) => { setCurrentCoords({lat:pos.coords.latitude,lng:pos.coords.longitude}); setLocStatus('ok'); },
        ()    => { setLocStatus('denied'); setUseMyLocation(false); }
      );
    };
    const handleLocToggle = () => { const next=!useMyLocation; setUseMyLocation(next); if (next && locStatus==='idle') getMyLocation(); };
    const openGoogleMaps  = () => {
      const ordered = selectedJobs.map(id=>jobs.find(j=>j.id===id)).filter(Boolean);
      if (!ordered.length) return;
      let origin, stops;
      if (useMyLocation && currentCoords) { origin=`${currentCoords.lat},${currentCoords.lng}`; stops=ordered; }
      else { origin=encodeURIComponent(ordered[0].address); stops=ordered.slice(1); }
      const dest   = stops.length>0 ? encodeURIComponent(stops[stops.length-1].address) : origin;
      const wps    = stops.slice(0,-1).map(j=>encodeURIComponent(j.address)).join('|');
      let url = `https://www.google.com/maps/dir/?api=1&origin=${origin}&destination=${dest}&travelmode=driving`;
      if (wps) url += `&waypoints=${wps}`;
      window.open(url, '_blank', 'noopener');
    };
    const atStopLimit = selectedJobs.length >= MAX_STOPS;

    // ── Filtered jobs ─────────────────────────────────────────────────────────
    const filteredJobs = jobs
      .filter(j => filterType==='all' || j.type===filterType)
      .filter(j => !searchQ.trim() || j.address.toLowerCase().includes(searchQ.toLowerCase()) || (j.clientName||'').toLowerCase().includes(searchQ.toLowerCase()))
      .sort((a,b) => b.id-a.id);

    // ── Canvas (unchanged, kept for completeness) ────────────────────────────
    const resetView = () => { setCanvasZoom(1); zoomRef.current=1; setCanvasPan({x:0,y:0}); panRef.current={x:0,y:0}; setCanvasMode('draw'); modeRef.current='draw'; };
    useEffect(() => {
      if (editingImageIdx!==null && canvasRef.current) {
        resetView();
        const cvs=canvasRef.current, ctx=cvs.getContext('2d'), img=new Image();
        img.src=taskData.images[editingImageIdx];
        img.onload=()=>{ cvs.width=img.width; cvs.height=img.height; ctx.drawImage(img,0,0,img.width,img.height); setUndoStack([cvs.toDataURL()]); };
      }
    }, [editingImageIdx, taskData.images]);
    const getCoords = (e) => {
      const cvs=canvasRef.current, r=cvs.getBoundingClientRect();
      let cx=e.clientX, cy=e.clientY;
      if (e.touches?.length>0) { cx=e.touches[0].clientX; cy=e.touches[0].clientY; }
      return { x:(cx-r.left)*(cvs.width/r.width), y:(cy-r.top)*(cvs.height/r.height) };
    };
    const startDraw  = (e) => {
      setIsDrawing(true); drawRef.current=true;
      const {x,y}=getCoords(e), ctx=canvasRef.current.getContext('2d');
      ctx.strokeStyle=penColor; ctx.lineWidth=Math.max(3,canvasRef.current.width/100);
      ctx.lineCap='round'; ctx.lineJoin='round'; ctx.beginPath(); ctx.moveTo(x,y);
    };
    const doDraw     = (e) => {
      if (!drawRef.current) return; e.preventDefault();
      const {x,y}=getCoords(e), ctx=canvasRef.current.getContext('2d');
      ctx.lineTo(x,y); ctx.stroke();
    };
    const stopDraw   = () => {
      if (!drawRef.current) return;
      setIsDrawing(false); drawRef.current=false;
      setUndoStack(p=>[...p,canvasRef.current.toDataURL()]);
    };
    const handleUndo = () => {
      if (undoStack.length<=1) return;
      const ns=[...undoStack]; ns.pop();
      const img=new Image(); img.src=ns[ns.length-1];
      img.onload=()=>{ const cvs=canvasRef.current,ctx=cvs.getContext('2d'); ctx.clearRect(0,0,cvs.width,cvs.height); ctx.drawImage(img,0,0,cvs.width,cvs.height); setUndoStack(ns); };
    };
    const handleClear = () => {
      if (undoStack.length<=1) return;
      const img=new Image(); img.src=undoStack[0];
      img.onload=()=>{ const cvs=canvasRef.current,ctx=cvs.getContext('2d'); ctx.clearRect(0,0,cvs.width,cvs.height); ctx.drawImage(img,0,0,cvs.width,cvs.height); setUndoStack([undoStack[0]]); };
    };
    const saveAnnotated = () => {
      if (!canvasRef.current) return;
      const imgs=[...taskData.images]; imgs[editingImageIdx]=canvasRef.current.toDataURL('image/webp',0.8);
      setTaskData(p=>({...p,images:imgs})); setEditingImageIdx(null);
    };
    const dist2 = (t1,t2) => Math.hypot(t1.clientX-t2.clientX, t1.clientY-t2.clientY);
    const onTouchStart = (e) => {
      if (e.touches.length===2) {
        if (drawRef.current) { drawRef.current=false; setIsDrawing(false); setUndoStack(p=>[...p,canvasRef.current.toDataURL()]); }
        pinchRef.current={ dist:dist2(e.touches[0],e.touches[1]), zoom:zoomRef.current };
      } else if (e.touches.length===1) {
        pinchRef.current=null;
        if (modeRef.current==='pan') { panStartRef.current={ clientX:e.touches[0].clientX, clientY:e.touches[0].clientY, panX:panRef.current.x, panY:panRef.current.y }; }
        else startDraw(e);
      }
    };
    const onTouchMove = (e) => {
      e.preventDefault();
      if (e.touches.length===2 && pinchRef.current) {
        const nz=Math.min(Math.max(pinchRef.current.zoom*(dist2(e.touches[0],e.touches[1])/pinchRef.current.dist),1),6);
        setCanvasZoom(nz); zoomRef.current=nz;
      } else if (e.touches.length===1) {
        if (modeRef.current==='pan' && panStartRef.current) {
          const np={ x:panStartRef.current.panX+(e.touches[0].clientX-panStartRef.current.clientX), y:panStartRef.current.panY+(e.touches[0].clientY-panStartRef.current.clientY) };
          setCanvasPan(np); panRef.current=np;
        } else if (modeRef.current==='draw') doDraw(e);
      }
    };
    const onTouchEnd = (e) => {
      if (e.touches.length<2) pinchRef.current=null;
      if (e.touches.length===0) { panStartRef.current=null; if (modeRef.current==='draw') stopDraw(); }
    };
    const toggleMode = () => { const n=modeRef.current==='draw'?'pan':'draw'; setCanvasMode(n); modeRef.current=n; };
    const onMDown = (e) => {
      if (modeRef.current==='draw') startDraw(e);
      else panStartRef.current={ clientX:e.clientX, clientY:e.clientY, panX:panRef.current.x, panY:panRef.current.y };
    };
    const onMMove = (e) => {
      if (modeRef.current==='draw') doDraw(e);
      else if (modeRef.current==='pan' && panStartRef.current) {
        const np={ x:panStartRef.current.panX+(e.clientX-panStartRef.current.clientX), y:panStartRef.current.panY+(e.clientY-panStartRef.current.clientY) };
        setCanvasPan(np); panRef.current=np;
      }

                      <div className="flex justify-between items-start mb-2">
                        <h3 className="font-black text-xl text-slate-900 dark:text-white">{t.title}</h3>
                        <span className="bg-orange-100 dark:bg-orange-900/40 text-orange-700 dark:text-orange-400 px-3 py-1 rounded-full text-xs font-black ml-2 flex-shrink-0">{t.time}</span>
                      </div>
                      <p className="text-slate-500 dark:text-slate-400 text-sm leading-relaxed mb-3">{t.desc}</p>
                      {activeJob.type==='quote' && subtotal>0 && (
                        <div className="flex gap-2 mb-3 flex-wrap">
                          {labour>0 && <span className="text-[11px] font-black bg-blue-50 dark:bg-blue-900/30 text-blue-600 dark:text-blue-300 px-3 py-1 rounded-full">Labour {fmtAUD(labour)}</span>}
                          {mats>0   && <span className="text-[11px] font-black bg-amber-50 dark:bg-amber-900/30 text-amber-600 dark:text-amber-300 px-3 py-1 rounded-full">Materials {fmtAUD(mats)}</span>}
                          <span className="text-[11px] font-black bg-emerald-50 dark:bg-emerald-900/30 text-emerald-600 dark:text-emerald-300 px-3 py-1 rounded-full">Subtotal {fmtAUD(subtotal)}</span>
                        </div>
                      )}
                      {t.images?.length>0 && (
                        <div className="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                          {t.images.map((img,idx) => <div key={idx} className="h-24 w-32 flex-shrink-0"><img src={img} className="w-full h-full object-cover rounded-xl border dark:border-slate-600 shadow-sm"/></div>)}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
              {activeJob?.tasks.length===0 && <div className="text-center py-20 text-slate-300 dark:text-slate-700 font-black uppercase tracking-widest">No Log Entries Yet</div>}
            </div>

            <button onClick={() => setIsTaskFormOpen(true)} className={`fixed bottom-8 right-8 text-white w-20 h-20 rounded-full shadow-2xl flex items-center justify-center active:scale-90 transition-all z-40 border-4 border-white dark:border-slate-800 ${activeJob?.type==='handover'?'bg-emerald-600':'bg-slate-900 dark:bg-slate-700'}`}>
              <Plus size={40}/>
            </button>
          </main>
        )}

        {/* ── Route planning sticky bar ── */}
        {selectionMode && (
          <div className="fixed bottom-0 left-0 right-0 z-50 bg-slate-950/95 backdrop-blur-md border-t border-slate-800 p-4 no-print">
            {selectedJobs.length>0 && (
              <div className="flex gap-2 overflow-x-auto no-scrollbar mb-3 pb-1">
                {useMyLocation && locStatus==='ok' && (
                  <div className="flex-shrink-0 flex items-center gap-1.5 bg-emerald-900/60 border border-emerald-700 px-3 py-1.5 rounded-full">
                    <LocateFixed size={11} className="text-emerald-400"/><span className="text-emerald-300 text-[11px] font-black uppercase">You</span>
                  </div>
                )}
                {selectedJobs.map((id, idx) => {
                  const j=jobs.find(x=>x.id===id);
                  return j ? (
                    <div key={id} className="flex-shrink-0 flex items-center gap-1.5 bg-slate-800 border border-slate-700 pl-1.5 pr-3 py-1.5 rounded-full">
                      <div className="w-5 h-5 rounded-full bg-blue-500 text-white text-[10px] font-black flex items-center justify-center flex-shrink-0">{idx+1}</div>
                      <span className="text-slate-200 text-[11px] font-black truncate max-w-[120px]">{j.address}</span>
                      <button onClick={e=>{ e.stopPropagation(); toggleJobSelection(id); }} className="text-slate-500 hover:text-red-400 ml-1"><X size={12}/></button>
                    </div>
                  ) : null;
                })}
              </div>
            )}
            <div className="flex items-center justify-between gap-3">
              <div>
                <p className="text-white font-black text-sm">{selectedJobs.length===0?'Tap jobs to add stops':`${selectedJobs.length} stop${selectedJobs.length!==1?'s':''} selected`}</p>
                {useMyLocation&&locStatus==='ok' ? <p className="text-emerald-400 text-[10px] font-black uppercase">Starting from your location</p>
                  : selectedJobs.length>0 ? <p className="text-slate-500 text-[10px] font-black uppercase">Starting from stop 1</p> : null}
              </div>
              <button onClick={openGoogleMaps} disabled={selectedJobs.length===0} className={`flex items-center gap-2 px-6 py-3 rounded-2xl font-black text-sm uppercase tracking-widest transition-all active:scale-95 ${selectedJobs.length>0?'bg-blue-600 hover:bg-blue-500 text-white shadow-lg shadow-blue-900/50':'bg-slate-800 text-slate-600 cursor-not-allowed'}`}>
                <MapPinned size={18}/> Open in Maps
              </button>
            </div>
          </div>
        )}

        {/* ══ New Job Modal ══ */}
        {newJobModal && <NewJobModal type={newJobModal} onSave={handleCreateJob} onClose={() => setNewJobModal(null)}/>}

        {/* ══ Task Form Modal ══ */}
        {isTaskFormOpen && (
          <div className="fixed inset-0 z-[100] bg-slate-900/90 dark:bg-slate-950/95 backdrop-blur-md p-4 overflow-y-auto">
            <div className="bg-white dark:bg-slate-900 rounded-[3rem] max-w-md mx-auto p-8 shadow-2xl mt-4 border dark:border-slate-800">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-2xl font-black text-slate-900 dark:text-white">{editingTaskId?'Edit':'New'} {activeJob?.type==='handover'?'Works Record':'Report Entry'}</h2>
                <button onClick={closeModal} className="bg-slate-100 dark:bg-slate-800 p-2 rounded-full text-slate-400 hover:text-slate-600 dark:hover:text-white"><X size={20}/></button>
              </div>
              <div className="mb-6">
                <label className="text-[10px] font-black text-slate-400 uppercase tracking-widest block mb-2">Quick Templates</label>
                <div className="flex gap-2 overflow-x-auto pb-2 no-scrollbar">
                  {Object.keys(TEMPLATES[activeJob?.type]||{}).map(key => (
                    <button key={key} onClick={() => setTaskData(p=>({...p,...TEMPLATES[activeJob.type][key]}))} className="whitespace-nowrap bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 px-4 py-2 rounded-2xl text-[12px] font-black text-slate-700 dark:text-slate-300 uppercase tracking-widest hover:border-orange-500 dark:hover:border-orange-500 transition-all">
                      <Sparkles size={14} className="inline mr-1 text-orange-500"/> {key.replace(/_/g,' ')}
                    </button>
                  ))}
                </div>
              </div>
              <div className="space-y-4">
                <input placeholder="Task / Item Title" className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none font-bold dark:text-white dark:placeholder-slate-500" value={taskData.title} onChange={e=>setTaskData(p=>({...p,title:e.target.value}))}/>
                <div className="flex gap-3">
                  <div className="flex-1 relative">
                    <input placeholder="Time (e.g. 2h 30m)" className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none font-black dark:text-white dark:placeholder-slate-500 text-sm" value={taskData.time} onChange={e=>setTaskData(p=>({...p,time:e.target.value}))}/>
                    {taskData.time && <div className="absolute -bottom-5 left-4 text-[9px] text-orange-500 font-black">= {fmtMins(parseTimeToMinutes(taskData.time))}</div>}
                  </div>
                  <label className="flex-shrink-0 bg-slate-100 dark:bg-slate-800 px-5 rounded-2xl cursor-pointer flex items-center justify-center hover:bg-slate-200 dark:hover:bg-slate-700 gap-2">
                    <ImageIcon className="text-slate-600 dark:text-slate-400" size={18}/>
                    <span className="text-xs font-black text-slate-500 dark:text-slate-300 uppercase">Photos</span>
                    <input type="file" multiple accept="image/*" className="hidden" onChange={handleImageUpload}/>
                  </label>
                </div>
                {activeJob?.type==='quote' && (
                  <div className="flex gap-3 mt-2">
                    <div className="flex-1 relative">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-black text-sm">$</span>
                      <input placeholder="Rate/hr" className="w-full pl-7 pr-10 p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none font-black dark:text-white dark:placeholder-slate-500 text-sm" value={taskData.rate} onChange={e=>setTaskData(p=>({...p,rate:e.target.value}))}/>
                      <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[9px] text-slate-400 font-black uppercase">/hr</span>
                    </div>
                    <div className="flex-1 relative">
                      <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-black text-sm">$</span>
                      <input placeholder="Materials $" className="w-full pl-7 p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none font-black dark:text-white dark:placeholder-slate-500 text-sm" value={taskData.materialsCost} onChange={e=>setTaskData(p=>({...p,materialsCost:e.target.value}))}/>
                    </div>
                  </div>
                )}
                {activeJob?.type==='quote' && (() => {
                  const hrs=parseTimeToMinutes(taskData.time)/60;
                  const labour=hrs*(parseFloat(taskData.rate)||0);
                  const mats=parseFloat(taskData.materialsCost)||0;
                  const total=labour+mats;
                  return total>0 ? (
                    <div className="bg-slate-900 dark:bg-slate-800 rounded-2xl px-5 py-3 flex justify-between items-center">
                      <div className="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                        {labour>0 && <span className="mr-3">Labour {fmtAUD(labour)}</span>}
                        {mats>0 && <span>Mats {fmtAUD(mats)}</span>}
                      </div>
                      <div className="text-white font-black">{fmtAUD(total)}</div>
                    </div>
                  ) : null;
                })()}
                {taskData.images.length>0 && (
                  <div className="mt-6 img-preview-grid">
                    {taskData.images.map((img,i) => (
                      <div key={i} className="relative w-full aspect-[4/3] group cursor-pointer" onClick={() => setEditingImageIdx(i)}>
                        <img src={img} className="w-full h-full object-cover rounded-xl border dark:border-slate-700 shadow-sm"/>
                        <div className="absolute inset-0 bg-slate-900/50 rounded-xl opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><Edit3 className="text-white drop-shadow-md" size={24}/></div>
                        <button onClick={e=>{ e.stopPropagation(); setTaskData(p=>({...p,images:p.images.filter((_,idx)=>idx!==i)})); }} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1 shadow-md z-10"><X size={12}/></button>
                      </div>
                    ))}
                    <div className="col-span-full text-[10px] text-center text-slate-400 font-bold uppercase mt-1">Tap photo to annotate</div>
                  </div>
                )}
                <input placeholder="Materials Used" className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none text-sm font-medium dark:text-white dark:placeholder-slate-500" value={taskData.materials} onChange={e=>setTaskData(p=>({...p,materials:e.target.value}))}/>
                <input placeholder={activeJob?.type==='handover'?'Notes / Delays':'Tools Used'} className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none text-sm font-medium border-l-4 border-slate-300 dark:border-slate-600 dark:text-white dark:placeholder-slate-500" value={taskData.tools} onChange={e=>setTaskData(p=>({...p,tools:e.target.value}))}/>
                <textarea placeholder="Full details…" className="w-full p-4 bg-slate-50 dark:bg-slate-800 rounded-2xl outline-none text-sm font-medium h-28 resize-none dark:text-white dark:placeholder-slate-500" value={taskData.desc} onChange={e=>setTaskData(p=>({...p,desc:e.target.value}))}/>
                <button onClick={handleSaveTask} className={`w-full text-white p-5 rounded-[2rem] font-black text-lg shadow-xl flex items-center justify-center gap-2 transition-all hover:scale-[1.02] ${activeJob?.type==='handover'?'bg-emerald-600 hover:bg-emerald-500':'bg-slate-900 dark:bg-slate-700 hover:bg-slate-800 dark:hover:bg-slate-600'}`}>
                  <Save size={20}/> SAVE ENTRY
                </button>
              </div>
            </div>
          </div>
        )}

        {/* ══ Canvas Editor ══ */}
        {editingImageIdx!==null && (
          <div className="fixed inset-0 z-[200] bg-slate-950 flex flex-col">
            <div className="flex justify-between items-center p-4 bg-slate-900 border-b border-slate-800 shadow-md z-10 flex-shrink-0">
              <button onClick={() => setEditingImageIdx(null)} className="text-slate-300 hover:text-white font-bold text-sm px-4 py-2">CANCEL</button>
              <div className="flex items-center gap-2 text-white text-xs font-black uppercase tracking-widest"><Edit3 size={14} className="text-orange-500"/> Mark Defects</div>
              <button onClick={saveAnnotated} className="bg-orange-500 text-white font-bold text-sm px-4 py-2 rounded-xl">SAVE</button>
            </div>
            <div className="flex items-center justify-between px-4 py-2 bg-slate-900/80 border-b border-slate-800/50 flex-shrink-0">
              <div className="flex items-center gap-2">
                <div className={`flex items-center gap-1.5 text-[10px] font-black uppercase tracking-widest px-3 py-1.5 rounded-full ${canvasMode==='draw'?'bg-orange-500/20 text-orange-400 border border-orange-500/40':'bg-blue-500/20 text-blue-400 border border-blue-500/40'}`}>
                  {canvasMode==='draw'?<Pencil size={11}/>:<Move size={11}/>}
                  {canvasMode==='draw'?'Draw mode':'Pan mode'}
                </div>
                {canvasZoom>1 && <div className="text-[10px] font-black text-slate-500 uppercase">{canvasZoom.toFixed(1)}×</div>}
              </div>
              <div className="text-[10px] font-black text-slate-600 uppercase tracking-widest">Pinch to zoom · 2 fingers</div>
            </div>
            <div className="flex-1 overflow-hidden relative flex items-center justify-center bg-slate-950 canvas-editor-area">
              <div style={{ transform:`translate(${canvasPan.x}px,${canvasPan.y}px) scale(${canvasZoom})`, transformOrigin:'center center', transition:'none', willChange:'transform' }}>
                <canvas ref={canvasRef}
                  onMouseDown={onMDown} onMouseMove={onMMove} onMouseUp={onMUp} onMouseLeave={onMUp}
                  onTouchStart={onTouchStart} onTouchMove={onTouchMove} onTouchEnd={onTouchEnd}
                  className="max-w-full max-h-full object-contain shadow-2xl"
                  style={{ cursor:canvasMode==='draw'?'crosshair':'grab', display:'block' }}/>
              </div>
            </div>
            <div className="bg-slate-900 border-t border-slate-800 p-4 z-10 flex-shrink-0">
              <div className="flex justify-between items-center">
                <div className="flex gap-3 items-center">
                  {COLORS.map(c => <button key={c.name} onClick={() => setPenColor(c.hex)} className={`w-8 h-8 rounded-full shadow-inner transition-transform ${penColor===c.hex?'scale-125 ring-2 ring-white ring-offset-1 ring-offset-slate-900':'opacity-70 hover:opacity-100'}`} style={{backgroundColor:c.hex}}/>)}
                </div>
                <div className="flex items-center gap-3">
                  <button onClick={toggleMode} className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase transition-colors px-3 py-2 rounded-xl ${canvasMode==='pan'?'bg-blue-500/20 text-blue-400':'text-slate-400 hover:text-white'}`}>
                    {canvasMode==='draw'?<Move size={20}/>:<Pencil size={20}/>}
                    {canvasMode==='draw'?'Pan':'Draw'}
                  </button>
                  {canvasZoom>1 && (
                    <button onClick={() => { setCanvasZoom(1); zoomRef.current=1; setCanvasPan({x:0,y:0}); panRef.current={x:0,y:0}; }} className="flex flex-col items-center gap-1 text-[10px] font-black uppercase text-slate-400 hover:text-white">
                      <ZoomIn size={20}/>Reset
                    </button>
                  )}
                  <button onClick={handleUndo} disabled={undoStack.length<=1} className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase ${undoStack.length<=1?'text-slate-700':'text-slate-300 hover:text-white'}`}><Undo size={20}/>Undo</button>
                  <button onClick={handleClear} disabled={undoStack.length<=1} className={`flex flex-col items-center gap-1 text-[10px] font-black uppercase ${undoStack.length<=1?'text-slate-700':'text-red-400 hover:text-red-300'}`}><RefreshCcw size={20}/>Clear</button>
                </div>
              </div>
            </div>
          </div>
        )}

        {/* ══ Print View (client-first, compact header) ══ */}
        {activeJob && (
          <div className="print-only hidden p-4">
            <div className="print-header border-b-2 border-slate-300 pb-3 mb-4 flex flex-col gap-1">
              <div className="flex justify-between text-xs font-black uppercase text-slate-500">
                <span>{activeJob.type==='handover' ? 'Completed Works' : 'Field Report'}</span>
                <span>{new Date(activeJob.date||Date.now()).toLocaleDateString('en-AU',{dateStyle:'full'})}</span>
              </div>
              <h1 className="text-3xl font-black text-slate-900 uppercase">{activeJob.clientName || '—'}</h1>
              {activeJob.clientRef && <p className="text-lg font-bold text-slate-700">REF: {activeJob.clientRef}</p>}
              <p className="text-slate-500 font-medium">{activeJob.address}</p>
              <div className="flex gap-4 mt-2 text-sm font-medium">
                <span>TOTAL TIME: {getTotals(activeJob.tasks).str}</span>
                {quoteTotals && quoteTotals.total>0 && <span>TOTAL: {fmtAUD(quoteTotals.total)}{activeJob.gstEnabled?' (inc. GST)':''}</span>}
              </div>
              {activeJob.projectNotes && <p className="text-slate-600 italic text-sm mt-2 border-l-4 border-slate-300 pl-3">{activeJob.projectNotes}</p>}
              {activeJob.projectPhotos?.length>0 && (
                <div className="flex gap-2 mt-2">
                  {activeJob.projectPhotos.map((p,i) => <img key={i} src={p} className="h-20 rounded" />)}
                </div>
              )}
            </div>

            {/* Task cards */}
            {activeJob.tasks.map((t, idx) => {
              const labour=(parseTimeToMinutes(t.time)/60)*(parseFloat(t.rate)||0);
              const mats=parseFloat(t.materialsCost)||0;
              const subtotal=labour+mats;
              return (
                <div key={t.id} className="print-card">
                  <div className={`px-5 py-3 font-black border-b flex justify-between items-center text-lg uppercase ${activeJob.type==='handover'?'bg-emerald-50 text-emerald-800 border-emerald-200':'bg-slate-50 text-slate-800 border-slate-200'}`}>
                    <span>{idx+1}. {t.title}</span>
                    <div className="flex items-center gap-4">
                      <span className="text-sm">{t.time}</span>
                      {activeJob.type==='quote' && subtotal>0 && <span className="text-sm text-emerald-700">{fmtAUD(subtotal)}</span>}
                    </div>
                  </div>
                  <div className="p-6">
                    <p className="text-[14px] text-slate-700 mb-6 leading-relaxed border-l-4 border-slate-200 pl-4 italic font-medium">"{t.desc}"</p>
                    <div className="grid grid-cols-2 gap-4 mb-4">
                      <div className="p-4 bg-slate-50 rounded-xl border"><label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Materials</label><span className="text-[12px] font-bold text-slate-600 uppercase">{t.materials||'None'}</span></div>
                      <div className="p-4 bg-slate-50 rounded-xl border"><label className="text-[10px] font-black uppercase text-slate-400 block mb-1">{activeJob.type==='handover'?'Notes/Delays':'Tools Used'}</label><span className="text-[12px] font-bold text-slate-600 uppercase">{t.tools||'None'}</span></div>
                      {activeJob.type==='quote' && (labour>0||mats>0) && (
                        <>
                          <div className="p-4 bg-slate-50 rounded-xl border"><label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Labour Cost</label><span className="text-[12px] font-bold text-slate-600">{fmtAUD(labour)} ({t.rate?`$${t.rate}/hr`:'—'})</span></div>
                          <div className="p-4 bg-slate-50 rounded-xl border"><label className="text-[10px] font-black uppercase text-slate-400 block mb-1">Materials Cost</label><span className="text-[12px] font-bold text-slate-600">{fmtAUD(mats)}</span></div>
                        </>
                      )}
                    </div>
                    {t.images?.length>0 && (
                      <div className="grid grid-cols-3 gap-3 print-img-container">
                        {t.images.map((img,i) => <div key={i} className="rounded-lg overflow-hidden border aspect-[4/3] shadow-sm bg-slate-100"><img src={img} className="w-full h-full object-cover"/></div>)}
                      </div>
                    )}
                  </div>
                </div>
              );
            })}

            {/* Quote total footer */}
            {activeJob.type==='quote' && quoteTotals && quoteTotals.total>0 && (
              <div className="mt-6 border-2 border-slate-900 rounded-2xl p-6 flex justify-between items-end">
                <div>
                  <p className="font-black uppercase text-slate-500 text-sm">Labour: {fmtAUD(quoteTotals.labour)}</p>
                  <p className="font-black uppercase text-slate-500 text-sm">Materials: {fmtAUD(quoteTotals.mats)}</p>
                  {activeJob.gstEnabled && (
                    <>
                      <p className="font-black uppercase text-slate-600 text-sm mt-2 border-t border-slate-200 pt-2">Subtotal: {fmtAUD(quoteTotals.subtotal)}</p>
                      <p className="font-black uppercase text-slate-600 text-sm">GST (10%): {fmtAUD(quoteTotals.gst)}</p>
                    </>
                  )}
                </div>
                <div className="text-right">
                  <p className="text-[10px] font-black uppercase text-slate-400 tracking-widest">{activeJob.gstEnabled?'Total inc. GST':'Quote Total'}</p>
                  <p className="text-4xl font-black text-slate-900">{fmtAUD(quoteTotals.total)}</p>
                  {activeJob.gstEnabled && <p className="text-xs text-slate-400 font-bold mt-1">GST included: {fmtAUD(quoteTotals.gst)}</p>}
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    );
  };

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
    </script>
  </body>
</html>
